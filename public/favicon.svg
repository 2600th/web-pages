<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>2600th</title>
  <!-- Signal mark: the site's oscilloscope trace locking onto 2600 Hz. The gold beam spot
       is the lock. Source of truth for the ICO, Apple and manifest icons. No external assets. -->
  <rect width="64" height="64" rx="14" fill="#03040a"/>
  <path d="M8 32h48" stroke="#4d74ff" stroke-opacity=".28" stroke-width="1.5"/>
  <path d="M1 8c2.5-6 4.5-6 6.5 0s4 6 6.5 0 4-6 6.5 0" transform="translate(6.3 13.6) scale(2.3)" fill="none" stroke="#9db6ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="53.4" cy="32" r="5" fill="#e8b45a"/>
</svg>
