mily=\"monospace\" font-size=\"10\">\n    <rect x=\"60\" y=\"55\" width=\"120\" height=\"140\" fill=\"#b8651a\"/>\n    <text x=\"120\" y=\"128\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\">GPU chip</text>\n    <text x=\"120\" y=\"145\" text-anchor=\"middle\" fill=\"#fff\">~30%</text>\n    <rect x=\"195\" y=\"115\" width=\"120\" height=\"80\" fill=\"#2a5f8f\"/>\n    <text x=\"255\" y=\"148\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\">Power (5yr)</text>\n    <text x=\"255\" y=\"165\" text-anchor=\"middle\" fill=\"#fff\">~25%</text>\n    <rect x=\"330\" y=\"130\" width=\"120\" height=\"65\" fill=\"#2f7a3e\"/>\n    <text x=\"390\" y=\"158\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\">Cooling / DC</text>\n    <text x=\"390\" y=\"175\" text-anchor=\"middle\" fill=\"#fff\">~20%</text>\n    <rect x=\"465\" y=\"145\" width=\"120\" height=\"50\" fill=\"#6b4a9e\"/>\n    <text x=\"525\" y=\"168\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\">Network</text>\n    <text x=\"525\" y=\"183\" text-anchor=\"middle\" fill=\"#fff\">~15%</text>\n    <rect x=\"600\" y=\"165\" width=\"45\" height=\"30\" fill=\"#706659\"/>\n    <text x=\"622\" y=\"180\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"9\" font-weight=\"700\">ops</text>\n    <text x=\"622\" y=\"192\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"9\">~10%</text>\n  </g>\n  <text x=\"330\" y=\"212\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" font-style=\"italic\" fill=\"#706659\">A 2× cheaper chip with 2× worse efficiency is ~break-even. Perf/watt moves the whole bar.</text>\n</svg>", "section_id": "inference", "section_num": "06", "section_title": "Inference & Serving", "section_color": "blue", "timestamp_sec": 1936, "timestamp_fmt": "32:16", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1936s"}, {"name": "TSMC", "expansion": "(Taiwan Semiconductor Manufacturing)", "plain": "Taiwan Semiconductor Manufacturing Company. Founded 1987. World's largest contract chip foundry. Makes essentially all of Nvidia's leading-edge silicon. Near-monopoly on sub-5nm manufacturing. ~75,000 employees.", "analogy": null, "why_matters": "Jensen's comment that 'Nvidia and TSMC don't have a legal contract' is striking — a 30-year relationship worth hundreds of billions operates on handshake trust and commercial interdependence. This is the deep moat, not the paper kind.", "context": "Jensen: 'I can completely trust them. There's always some rough justice.'", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 8, "timestamp_fmt": "0:08", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=8s"}, {"name": "ASML", "expansion": "", "plain": "Dutch, founded 1984. Only company that makes EUV lithography machines. ~40,000 employees. Each machine ~$200M, weighs 180 tons, takes a year to ship. Without ASML, no leading-edge chips anywhere.", "analogy": null, "why_matters": "Arguably the most strategically important company in the global tech supply chain. The US-China tech rivalry runs through ASML's export licenses.", "context": "Dwarkesh frames the 2030 compute question: 'how do you get 2x EUV machines year over year?'", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 872, "timestamp_fmt": "14:32", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=872s"}, {"name": "SK Hynix / Micron / Samsung", "expansion": "", "plain": "The three companies that make HBM. Their combined output gates global AI chip production. SK Hynix leads on HBM3/3e shipments. Micron is strong US partner. Samsung #3 currently, struggling on HBM4 yield.", "analogy": null, "why_matters": "Nvidia's relationships with all three — Sanjay Mehrotra of Micron specifically called out by Jensen — illustrate why the 'supply chain' is plural. Single-source any component and you have a disaster.", "context": "Jensen credits Micron CEO Sanjay Mehrotra for early HBM belief.", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 19, "timestamp_fmt": "0:19", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=19s"}, {"name": "Lumentum / Coherent", "expansion": "", "plain": "US-based makers of optical components (lasers, transceivers) for silicon photonics. Both publicly traded. Nvidia invested in both to seed the photonics supply chain before it was commercially viable at scale.", "analogy": null, "why_matters": "Classic Nvidia move: spot a 5-year-away constraint, invest upstream to ensure supply exists when needed. Same playbook as HBM in 2015, now for photonics.", "context": "Jensen: 'investments with Lumentum, Coherent, and silicon photonics reshaped the supply chain.'", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 722, "timestamp_fmt": "12:02", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=722s"}, {"name": "Hopper", "expansion": "(H100 / H200)", "plain": "Nvidia's 2022 architecture (H100, H200). Named after computer scientist Grace Hopper. Trained GPT-4, Claude 3, Gemini 1, Llama 3. Still the most commonly deployed AI chip in 2026 — dominant install base.", "analogy": null, "why_matters": "The 'AI boom' is largely a Hopper story. New models train on Blackwell, but Hopper is the installed base serving the billions of daily queries. Architecture matters over time, not just at launch.", "context": "Used as baseline: 'Blackwell is 50 times Hopper' in perf/watt.", "subvis": "\n<svg viewBox=\"0 0 680 210\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Nvidia's annual architecture cadence</text>\n  <line x1=\"60\" y1=\"130\" x2=\"620\" y2=\"130\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <g font-family=\"monospace\" font-size=\"10\">\n    <g transform=\"translate(100,130)\">\n      <circle cx=\"0\" cy=\"0\" r=\"7\" fill=\"#b8651a\"/>\n      <text text-anchor=\"middle\" y=\"-18\" font-weight=\"700\">2022</text>\n      <text text-anchor=\"middle\" y=\"22\" font-weight=\"700\">Hopper</text>\n      <text text-anchor=\"middle\" y=\"36\" fill=\"#706659\" font-size=\"9\">H100/H200</text>\n      <text text-anchor=\"middle\" y=\"50\" fill=\"#706659\" font-size=\"9\">trained GPT-4</text>\n    </g>\n    <g transform=\"translate(240,130)\">\n      <circle cx=\"0\" cy=\"0\" r=\"9\" fill=\"#a8321f\"/>\n      <text text-anchor=\"middle\" y=\"-18\" font-weight=\"700\">2024</text>\n      <text text-anchor=\"middle\" y=\"26\" font-weight=\"700\">Blackwell</text>\n      <text text-anchor=\"middle\" y=\"40\" fill=\"#706659\" font-size=\"9\">B200, NVL72</text>\n      <text text-anchor=\"middle\" y=\"54\" fill=\"#706659\" font-size=\"9\">30-50× Hopper</text>\n    </g>\n    <g transform=\"translate(380,130)\">\n      <circle cx=\"0\" cy=\"0\" r=\"9\" fill=\"#2f7a3e\"/>\n      <text text-anchor=\"middle\" y=\"-18\" font-weight=\"700\">2026</text>\n      <text text-anchor=\"middle\" y=\"26\" font-weight=\"700\">Vera Rubin</text>\n      <text text-anchor=\"middle\" y=\"40\" fill=\"#706659\" font-size=\"9\">CES 2026, H2 ship</text>\n      <text text-anchor=\"middle\" y=\"54\" fill=\"#706659\" font-size=\"9\">10× inference cost</text>\n    </g>\n    <g transform=\"translate(500,130)\">\n      <circle cx=\"0\" cy=\"0\" r=\"7\" fill=\"#2a5f8f\"/>\n      <text text-anchor=\"middle\" y=\"-18\" font-weight=\"700\">2027</text>\n      <text text-anchor=\"middle\" y=\"26\" font-weight=\"700\">Rubin Ultra</text>\n      <text text-anchor=\"middle\" y=\"40\" fill=\"#706659\" font-size=\"9\">2× Rubin</text>\n    </g>\n    <g transform=\"translate(600,130)\">\n      <circle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#6b4a9e\"/>\n      <text text-anchor=\"middle\" y=\"-18\" font-weight=\"700\">2028</text>\n      <text text-anchor=\"middle\" y=\"26\" font-weight=\"700\">Feynman</text>\n    </g>\n  </g>\n  <text x=\"340\" y=\"195\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-style=\"italic\" fill=\"#706659\">Every year, a new architecture. No ASIC competitor can match this cadence.</text>\n</svg>", "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 912, "timestamp_fmt": "15:12", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=912s"}, {"name": "Blackwell / Blackwell Ultra", "expansion": "(B100/B200, B300)", "plain": "Nvidia's 2024-25 architecture (B100/B200, B300). Named after statistician David Blackwell. Ships in NVL72 racks. First architecture that treats the rack as the fundamental design unit, not the chip.", "analogy": null, "why_matters": "Announced at 35× Hopper; Dylan Patel's benchmarks measured 50× in real workloads. The magnitude of the jump is itself Jensen's argument against ASICs — nobody else delivered anything close in 2024.", "context": "Announced at 35× Hopper; Dylan Patel's benchmarks measured 50×.", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 912, "timestamp_fmt": "15:12", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=912s"}, {"name": "Vera Rubin / Rubin Ultra", "expansion": "", "plain": "Nvidia's 2026 architecture — announced at CES 2026 (January), full production, products shipping H2 2026. Named after astronomer Vera Rubin. TSMC N3. Delivers ~10× inference token cost reduction vs Blackwell, 4× fewer GPUs to train MoE models. Rubin Ultra follows in 2027.", "analogy": null, "why_matters": "Rubin is what the current hyperscaler capex is actually buying. Microsoft's Fairwater AI superfactories, Anthropic's expansion, OpenAI's Stargate — all designed around Rubin NVL72 racks.", "context": "Jensen: 'Vera Rubin is going to be incredible. Next year, Vera Rubin Ultra will come.'", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 3342, "timestamp_fmt": "55:42", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=3342s"}, {"name": "Feynman", "expansion": "", "plain": "Nvidia's architecture after Rubin Ultra, named after physicist Richard Feynman. Expected ~2028. Likely TSMC A16 / 1.6nm node with backside power delivery. Details not yet public.", "analogy": null, "why_matters": "Jensen's annual-cadence claim is what this name represents. Naming a chip 3 years out is a commitment device — it signals to suppliers that the train isn't slowing.", "context": "Jensen: 'Feynman will come. And the year after that, I haven't introduced the name yet.'", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 3342, "timestamp_fmt": "55:42", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=3342s"}, {"name": "Ampere", "expansion": "(A10 / A100)", "plain": "Nvidia's 2020 architecture (A100, A10). A100 was the dominant AI chip before Hopper — trained GPT-3 and early Claude. Still widely deployed in second-tier clouds and smaller labs.", "analogy": null, "why_matters": "The A100 is the chip that made 'AI chip' a meaningful category. Before A100, there was no enterprise expectation that Nvidia owned AI hardware. By 2022 there was no doubt.", "context": "Jensen listing install base: 'goes back to the A10, A100, H100, H200, the L series, the P series.'", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 5732, "timestamp_fmt": "1:35:32", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=5732s"}, {"name": "Trainium", "expansion": "", "plain": "Amazon's custom AI training chip. Used primarily by Anthropic under the multi-billion AWS investment deal. Trainium 2 late 2024; Trainium 3 expected 2026.", "analogy": null, "why_matters": "Exhibit A in Jensen's 'Anthropic-is-a-unique-instance' argument: 'Without Anthropic, why would there be Trainium growth at all? It's 100% Anthropic.'", "context": "Jensen: 'Without Anthropic, why would there be Trainium growth at all? It's 100% Anthropic.'", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 1523, "timestamp_fmt": "25:23", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1523s"}, {"name": "Groq", "expansion": "", "plain": "Inference-specific chip startup. Deterministic, compiler-scheduled LPU (Language Processing Unit) architecture — software decides every data move at nanosecond granularity, so no runtime overhead. Founded 2016 by Jonathan Ross (former Google TPU co-creator). Nvidia announced a $20B licensing deal + acqui-hire on December 24, 2025.", "analogy": "A GPU is like a kitchen where chefs grab ingredients as they need them. An LPU is a perfectly choreographed assembly line — every ingredient arrives exactly when called for, no one ever waits.", "why_matters": "The Groq deal is strategically huge: it removes Nvidia's most credible inference-specific competitor AND brings the TPU-pedigree founder in-house. By March 2026, 'Groq 3 LPX' shipped as a chip inside the Rubin platform.", "context": "Jensen: 'we added Groq, and we're going to fold Groq into our CUDA ecosystem.'", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 5869, "timestamp_fmt": "1:37:49", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=5869s"}, {"name": "Cerebras", "expansion": "", "plain": "Makes wafer-scale chips — a single chip the size of a dinner plate (300mm × 215mm). One CS-3 system has ~4 trillion transistors and ~900,000 cores.", "analogy": null, "why_matters": "Dwarkesh raises wafer-scale as an alternative architectural path. Jensen's response: 'we don't have a better idea, simulated provably worse' — Nvidia did the math, decided the tradeoffs don't work.", "context": "Dwarkesh raises 'Cerebras-style wafer scale.' Jensen: 'We don't have a better idea. Simulated, provably worse.'", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 5810, "timestamp_fmt": "1:36:50", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=5810s"}, {"name": "Dojo", "expansion": "", "plain": "Tesla's custom AI training supercomputer, D1/D2 chips, announced 2021. Shut down August 2025 — Musk called it 'an evolutionary dead end.' Team dispersed; Tesla pivoted to Samsung-made AI5/AI6 chips for inference. Restarted January 2026 per Wikipedia but in a different form.", "analogy": null, "why_matters": "Dojo is the poster child for Jensen's 'cancelled ASICs' claim. Six years of hype, $500M committed to Buffalo, ex-AMD founder Ganesh Venkataramanan's team — all disbanded. The moat narrative gets a data point.", "context": "Dwarkesh: 'a Dojo-style huge package' as an alternative architectural path.", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 5810, "timestamp_fmt": "1:36:50", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=5810s"}, {"name": "Synopsys / Cadence", "expansion": "", "plain": "The two dominant EDA (Electronic Design Automation) software vendors. Every chip designer on Earth uses their tools for layout, simulation, verification. Combined market cap ~$200B.", "analogy": null, "why_matters": "Jensen's counter-intuitive take on AI and chip design: 100 engineers × 1,000 agents × 10 sims each = 100× more EDA tool usage, not zero. AI won't replace the tools; it'll explode demand for them.", "context": "Jensen: 'the number of agents is going to grow exponentially, and the number of tool users is going to grow exponentially.'", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 189, "timestamp_fmt": "3:09", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=189s"}, {"name": "Neoclouds", "expansion": "", "plain": "New-generation GPU-rental clouds built specifically for AI: CoreWeave, Crusoe, Lambda, Nebius, Nscale. Faster to deploy new Nvidia chips than hyperscalers, because they don't have the enterprise-IT complexity to manage alongside.", "analogy": null, "why_matters": "Jensen invests in neoclouds deliberately — they keep hyperscalers honest on pricing and ensure Nvidia chips reach labs that don't want to rent from AWS/Azure/GCP. Political/strategic channel management.", "context": "Jensen: 'If we didn't support CoreWeave, these neoclouds, these AI clouds, wouldn't exist.'", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 2764, "timestamp_fmt": "46:04", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=2764s"}, {"name": "Hyperscalers", "expansion": "", "plain": "AWS, Azure, GCP, Oracle Cloud, sometimes Meta. ~60% of Nvidia revenue flows through them. Most of the Nvidia deployed at hyperscalers is rented to external customers — Nvidia is indirectly their product, not just their supplier.", "analogy": null, "why_matters": "Dwarkesh's pressure point: '60% of your revenue from five buyers who are also your biggest potential competitors.' Jensen's defense: they're customer-channels, not competitors, because most of what they buy serves THEIR customers.", "context": "Dwarkesh: '60% of your revenue is coming from these big five hyperscalers.'", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 1490, "timestamp_fmt": "24:50", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1490s"}, {"name": "OCI", "expansion": "(Oracle Cloud Infrastructure)", "plain": "Oracle Cloud Infrastructure. Smaller than AWS/Azure/GCP but punches above its weight in AI hosting. Hosts significant Nvidia deployments for OpenAI via the Stargate partnership. The Oracle-OpenAI-Nvidia triangle is a major capex axis.", "analogy": null, "why_matters": "OCI's AI growth is one of the most dramatic shifts in cloud in 2025-26. Nvidia's investment in broadening the customer base (beyond AWS dominance) matters enormously.", "context": "Jensen: 'we're in every cloud, including Google, Amazon, Azure, and OCI.'", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 1105, "timestamp_fmt": "18:25", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1105s"}, {"name": "xAI", "expansion": "", "plain": "Elon Musk's AI company, founded 2023. Trains Grok. Runs its own Nvidia supercomputer ('Colossus') in Memphis — 200,000+ Hoppers stood up in months, one of the fastest GPU deployments ever. Rare lab that owns compute rather than renting.", "analogy": null, "why_matters": "xAI illustrates the 'own-it' alternative to the neocloud/hyperscaler rental model. Jensen: 'we have the ability to help you operate it yourself, like we did for Elon.' Shows Nvidia's operational flexibility.", "context": "Jensen: 'we obviously have the ability to help you operate it yourself, like we did for Elon with xAI.'", "subvis": null, "section_id": "players", "section_num": "07", "section_title": "Companies & Products", "section_color": "dark", "timestamp_sec": 1129, "timestamp_fmt": "18:49", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1129s"}, {"name": "Moat", "expansion": "", "plain": "Warren Buffett's term for durable competitive advantage. Not one thing — usually several reinforcing layers: scale, switching costs, network effects, brand, regulatory capture, technical depth. Jensen's Nvidia moat: install base × programmability × ecosystem × annual cadence × supply chain.", "analogy": null, "why_matters": "The key question of the entire interview. Can any single layer be breached enough to matter? A competitor who beats CUDA but lacks install base loses. One with scale but no co-design loses. Attacks keep failing because the moat is 5-dimensional.", "context": "Dwarkesh: 'Is this really Nvidia's big moat for the next few years?'", "subvis": "\n<svg viewBox=\"0 0 680 280\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Nvidia's moat: 5 compounding layers, not one</text>\n  <circle cx=\"340\" cy=\"150\" r=\"40\" fill=\"#76b900\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <text x=\"340\" y=\"148\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">Nvidia</text>\n  <text x=\"340\" y=\"163\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#fff\">GPU + CUDA</text>\n  <circle cx=\"340\" cy=\"150\" r=\"68\" fill=\"none\" stroke=\"#b8651a\" stroke-width=\"1\" stroke-dasharray=\"3,2\"/>\n  <circle cx=\"340\" cy=\"150\" r=\"96\" fill=\"none\" stroke=\"#2f7a3e\" stroke-width=\"1\" stroke-dasharray=\"4,2\"/>\n  <circle cx=\"340\" cy=\"150\" r=\"122\" fill=\"none\" stroke=\"#2a5f8f\" stroke-width=\"1\" stroke-dasharray=\"5,2\"/>\n  <circle cx=\"340\" cy=\"150\" r=\"148\" fill=\"none\" stroke=\"#6b4a9e\" stroke-width=\"1\" stroke-dasharray=\"6,2\"/>\n  <text x=\"340\" y=\"84\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" font-weight=\"700\" fill=\"#b8651a\">install base (200M+ GPUs)</text>\n  <text x=\"340\" y=\"57\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" font-weight=\"700\" fill=\"#2f7a3e\">CUDA software ecosystem</text>\n  <text x=\"340\" y=\"30\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" font-weight=\"700\" fill=\"#2a5f8f\">1-yr architecture cadence</text>\n  <text x=\"340\" y=\"280\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" font-weight=\"700\" fill=\"#6b4a9e\">supply-chain capex credibility</text>\n  <g font-family=\"Georgia\" font-size=\"10\" fill=\"#706659\" font-style=\"italic\">\n    <text x=\"40\" y=\"152\" text-anchor=\"start\">Beat</text>\n    <text x=\"40\" y=\"166\" text-anchor=\"start\">one layer?</text>\n    <text x=\"40\" y=\"180\" text-anchor=\"start\">Still lose.</text>\n    <text x=\"640\" y=\"152\" text-anchor=\"end\">Beat four?</text>\n    <text x=\"640\" y=\"166\" text-anchor=\"end\">Still need the</text>\n    <text x=\"640\" y=\"180\" text-anchor=\"end\">fifth to ship.</text>\n  </g>\n</svg>", "section_id": "concepts", "section_num": "08", "section_title": "Business & Strategic Concepts", "section_color": "red", "timestamp_sec": 284, "timestamp_fmt": "4:44", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=284s"}, {"name": "Five-layer cake / stack", "expansion": "", "plain": "Jensen's framing: Energy → Chips & Systems → Frameworks & Software → Models → Applications. His core argument for engaging China: you can't win 'AI' by winning only one layer, and export policy focused only on Layer 2 (chips) cedes the others.", "analogy": null, "why_matters": "Jensen's non-obvious claim during the China debate. If 50% of AI devs work against a non-US stack, the US loses Global South deployment long after the short-term chip advantage expires. Systems thinking applied to geopolitics.", "context": "Recurring throughout: 'AI is a five-layer cake.'", "subvis": "\n<svg viewBox=\"0 0 660 280\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"330\" y=\"20\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Jensen's five-layer cake</text>\n  <rect x=\"80\" y=\"40\" width=\"500\" height=\"36\" fill=\"#efe6f2\" stroke=\"#6b4a9e\" stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"63\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\">5. Applications</text>\n  <text x=\"540\" y=\"63\" text-anchor=\"end\" font-family=\"Georgia\" font-size=\"11\" fill=\"#706659\" font-style=\"italic\">ChatGPT, Cursor, Perplexity, agents</text>\n  <rect x=\"80\" y=\"82\" width=\"500\" height=\"36\" fill=\"#e8f2e0\" stroke=\"#2f7a3e\" stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"105\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\">4. Models</text>\n  <text x=\"540\" y=\"105\" text-anchor=\"end\" font-family=\"Georgia\" font-size=\"11\" fill=\"#706659\" font-style=\"italic\">GPT, Claude, Gemini, DeepSeek, Qwen</text>\n  <rect x=\"80\" y=\"124\" width=\"500\" height=\"36\" fill=\"#fffdf8\" stroke=\"#2a5f8f\" stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"147\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\">3. Frameworks / Software</text>\n  <text x=\"540\" y=\"147\" text-anchor=\"end\" font-family=\"Georgia\" font-size=\"11\" fill=\"#706659\" font-style=\"italic\">CUDA, PyTorch, vLLM, SGLang</text>\n  <rect x=\"80\" y=\"166\" width=\"500\" height=\"36\" fill=\"#fef3d8\" stroke=\"#b8651a\" stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"189\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\">2. Chips &amp; Systems</text>\n  <text x=\"540\" y=\"189\" text-anchor=\"end\" font-family=\"Georgia\" font-size=\"11\" fill=\"#706659\" font-style=\"italic\">Nvidia, TPU, TSMC, HBM, CoWoS</text>\n  <rect x=\"80\" y=\"208\" width=\"500\" height=\"36\" fill=\"#fbeae5\" stroke=\"#a8321f\" stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"231\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\">1. Energy</text>\n  <text x=\"540\" y=\"231\" text-anchor=\"end\" font-family=\"Georgia\" font-size=\"11\" fill=\"#706659\" font-style=\"italic\">gigawatts, grid, cooling, water</text>\n  <text x=\"330\" y=\"268\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-style=\"italic\" fill=\"#706659\">\"You can't win AI by winning one layer\" — Jensen's framing for the China debate</text>\n</svg>", "section_id": "concepts", "section_num": "08", "section_title": "Business & Strategic Concepts", "section_color": "red", "timestamp_sec": 146, "timestamp_fmt": "2:26", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=146s"}, {"name": "Flywheel", "expansion": "", "plain": "Self-reinforcing business loop — each revolution makes the next easier. Amazon's retail flywheel is the canonical example. Nvidia's: more GPUs sold → bigger install base → more devs target CUDA → better perf/$ per new chip → more GPUs sold.", "analogy": "A real flywheel stores rotational energy — push it once, it keeps spinning. Push it once a year, it spins faster every year. Eventually stopping it requires as much force as every push ever applied, combined.", "why_matters": null, "context": "Jensen: 'the flywheel is install base, the programmability of our architecture, and the richness of our ecosystem.'", "subvis": "\n<svg viewBox=\"0 0 640 260\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <defs><marker id=\"fw-arr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2f7a3e\"/></marker></defs>\n  <text x=\"320\" y=\"20\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Each revolution makes the next spin easier</text>\n  <circle cx=\"320\" cy=\"60\" r=\"38\" fill=\"#fef3d8\" stroke=\"#b8651a\" stroke-width=\"1.5\"/>\n  <text x=\"320\" y=\"58\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\">more GPUs</text>\n  <text x=\"320\" y=\"72\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" fill=\"#706659\">shipped</text>\n  <circle cx=\"500\" cy=\"150\" r=\"38\" fill=\"#e8f2e0\" stroke=\"#2f7a3e\" stroke-width=\"1.5\"/>\n  <text x=\"500\" y=\"148\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\">bigger install</text>\n  <text x=\"500\" y=\"162\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" fill=\"#706659\">base</text>\n  <circle cx=\"320\" cy=\"230\" r=\"38\" fill=\"#efe6f2\" stroke=\"#6b4a9e\" stroke-width=\"1.5\"/>\n  <text x=\"320\" y=\"228\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\">devs target</text>\n  <text x=\"320\" y=\"242\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" fill=\"#706659\">CUDA first</text>\n  <circle cx=\"140\" cy=\"150\" r=\"38\" fill=\"#e8eef5\" stroke=\"#2a5f8f\" stroke-width=\"1.5\"/>\n  <text x=\"140\" y=\"148\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\">better perf</text>\n  <text x=\"140\" y=\"162\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" fill=\"#706659\">per $ / watt</text>\n  <g stroke=\"#2f7a3e\" stroke-width=\"2\" fill=\"none\">\n    <path d=\"M 358 70 Q 450 80 488 120\" marker-end=\"url(#fw-arr2)\"/>\n    <path d=\"M 500 188 Q 440 225 358 225\" marker-end=\"url(#fw-arr2)\"/>\n    <path d=\"M 282 225 Q 160 220 142 188\" marker-end=\"url(#fw-arr2)\"/>\n    <path d=\"M 168 125 Q 210 68 282 65\" marker-end=\"url(#fw-arr2)\"/>\n  </g>\n  <text x=\"320\" y=\"150\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-style=\"italic\" fill=\"#706659\">Nvidia's</text>\n  <text x=\"320\" y=\"165\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-style=\"italic\" fill=\"#706659\">flywheel</text>\n</svg>", "section_id": "concepts", "section_num": "08", "section_title": "Business & Strategic Concepts", "section_color": "red", "timestamp_sec": 2041, "timestamp_fmt": "34:01", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=2041s"}, {"name": "Install base", "expansion": "", "plain": "Total deployed units. Nvidia: 'several hundred million GPUs,' including consumer RTX cards. Developers target where the install base is — which reinforces the lead.", "analogy": null, "why_matters": "Why Nvidia's CONSUMER gaming GPUs are a strategic asset, not a side business. Every RTX in a gamer's PC is a CUDA device some future ML student will learn on. Free developer pipeline.", "context": "Jensen: 'Nvidia's CUDA ecosystem is ultimately its great treasure. Several hundred million GPUs out there.'", "subvis": null, "section_id": "concepts", "section_num": "08", "section_title": "Business & Strategic Concepts", "section_color": "red", "timestamp_sec": 1662, "timestamp_fmt": "27:42", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1662s"}, {"name": "Commoditize", "expansion": "", "plain": "Reduce to interchangeable, price-only competition. Wheat is commoditized — no one cares which farm it came from, only price. Once you're a commodity, margins collapse toward zero.", "analogy": null, "why_matters": "Dwarkesh's opening challenge: does AI commoditize software, eventually reaching Nvidia? Jensen's counter: producing tokens profitably requires winning all five layers — harder to commoditize than one layer.", "context": "Jensen: 'The transformation of electrons to tokens is hard to completely commoditize.'", "subvis": "\n<svg viewBox=\"0 0 680 220\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Commoditization curve — the question Dwarkesh opens with</text>\n  <line x1=\"70\" y1=\"180\" x2=\"630\" y2=\"180\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <line x1=\"70\" y1=\"40\" x2=\"70\" y2=\"180\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <text x=\"350\" y=\"205\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\">time →</text>\n  <text x=\"30\" y=\"110\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\" transform=\"rotate(-90 30 110)\">margin</text>\n  <path d=\"M 90 60 Q 220 65 340 100 T 600 170\" fill=\"none\" stroke=\"#b8651a\" stroke-width=\"2.5\"/>\n  <g font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">\n    <circle cx=\"100\" cy=\"63\" r=\"4\" fill=\"#b8651a\"/>\n    <text x=\"115\" y=\"55\" font-weight=\"700\">new capability</text>\n    <text x=\"115\" y=\"68\">high margin, scarce</text>\n    <circle cx=\"280\" cy=\"85\" r=\"4\" fill=\"#b8651a\"/>\n    <text x=\"295\" y=\"78\" font-weight=\"700\">many vendors</text>\n    <text x=\"295\" y=\"91\">margin compresses</text>\n    <circle cx=\"460\" cy=\"135\" r=\"4\" fill=\"#b8651a\"/>\n    <text x=\"475\" y=\"128\" font-weight=\"700\">standardized</text>\n    <text x=\"475\" y=\"141\">margin = single digits</text>\n    <circle cx=\"590\" cy=\"170\" r=\"4\" fill=\"#a8321f\"/>\n    <text x=\"590\" y=\"162\" text-anchor=\"end\" font-weight=\"700\" fill=\"#a8321f\">commodity</text>\n  </g>\n  <text x=\"350\" y=\"218\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" font-style=\"italic\" fill=\"#2f7a3e\">Jensen's claim: AI's 5-layer transformation resists this because each layer holds the next up.</text>\n</svg>", "section_id": "concepts", "section_num": "08", "section_title": "Business & Strategic Concepts", "section_color": "red", "timestamp_sec": 0, "timestamp_fmt": "0:00", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=0s"}, {"name": "Purchase commitments", "expansion": "", "plain": "Contractual obligations to buy specific supply over specific time windows. ~$100B disclosed by Nvidia ($250B per SemiAnalysis) with TSMC, HBM makers, packaging. Locked-in demand that unlocks supplier capex.", "analogy": null, "why_matters": "Jensen uses the scale to counter 'bubble' narratives. If Nvidia has contracted $250B of supply and is still sold out, demand isn't speculative. Puts concrete numbers on the flywheel.", "context": "Dwarkesh's setup: 'You've got $100+ billion of purchase commitments... is this the moat?'", "subvis": "\n<svg viewBox=\"0 0 660 200\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"330\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">The $250B paper chain that makes the whole stack move</text>\n  <g font-family=\"monospace\" font-size=\"10\">\n    <rect x=\"20\" y=\"55\" width=\"110\" height=\"50\" fill=\"#efe6f2\" stroke=\"#6b4a9e\" stroke-width=\"1.5\"/>\n    <text x=\"75\" y=\"76\" text-anchor=\"middle\" font-weight=\"700\">AI labs</text>\n    <text x=\"75\" y=\"92\" text-anchor=\"middle\" fill=\"#706659\">commit capex</text>\n    <rect x=\"170\" y=\"55\" width=\"110\" height=\"50\" fill=\"#e8eef5\" stroke=\"#2a5f8f\" stroke-width=\"1.5\"/>\n    <text x=\"225\" y=\"76\" text-anchor=\"middle\" font-weight=\"700\">Nvidia</text>\n    <text x=\"225\" y=\"92\" text-anchor=\"middle\" fill=\"#706659\">$250B PO to TSMC</text>\n    <rect x=\"320\" y=\"55\" width=\"110\" height=\"50\" fill=\"#fef3d8\" stroke=\"#b8651a\" stroke-width=\"1.5\"/>\n    <text x=\"375\" y=\"76\" text-anchor=\"middle\" font-weight=\"700\">TSMC</text>\n    <text x=\"375\" y=\"92\" text-anchor=\"middle\" fill=\"#706659\">builds new fabs</text>\n    <rect x=\"470\" y=\"55\" width=\"110\" height=\"50\" fill=\"#e8f2e0\" stroke=\"#2f7a3e\" stroke-width=\"1.5\"/>\n    <text x=\"525\" y=\"76\" text-anchor=\"middle\" font-weight=\"700\">ASML / HBM</text>\n    <text x=\"525\" y=\"92\" text-anchor=\"middle\" fill=\"#706659\">pre-sold output</text>\n  </g>\n  <g stroke=\"#1a1613\" stroke-width=\"1.2\" fill=\"none\"><path d=\"M 130 80 L 170 80\"/><path d=\"M 280 80 L 320 80\"/><path d=\"M 430 80 L 470 80\"/></g>\n  <g font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">\n    <text x=\"150\" y=\"72\" text-anchor=\"middle\">$</text>\n    <text x=\"300\" y=\"72\" text-anchor=\"middle\">$</text>\n    <text x=\"450\" y=\"72\" text-anchor=\"middle\">$</text>\n  </g>\n  <text x=\"330\" y=\"140\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" fill=\"#706659\">Each commitment de-risks the next. Without Nvidia's PO, TSMC doesn't build the fab.</text>\n  <text x=\"330\" y=\"160\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" fill=\"#706659\">Without TSMC's fab, ASML doesn't build the EUV. Without EUV, no chip.</text>\n  <text x=\"330\" y=\"184\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" font-style=\"italic\" fill=\"#2f7a3e\">Jensen's downstream demand is what makes the whole upstream capex legible.</text>\n</svg>", "section_id": "concepts", "section_num": "08", "section_title": "Business & Strategic Concepts", "section_color": "red", "timestamp_sec": 272, "timestamp_fmt": "4:32", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=272s"}, {"name": "Offtake", "expansion": "", "plain": "Buyer that commits in advance to purchase a supplier's output — a term borrowed from commodities (oil, LNG, lithium). Suppliers take upstream risk only when credible offtakers exist.", "analogy": "A farmer only plants a new crop if someone's agreed to buy the harvest. Nvidia is the supermarket chain that guarantees purchase, enabling TSMC to plant the fab.", "why_matters": "Jensen positions Nvidia as the master offtaker of the entire semiconductor industry. Without Nvidia's commitment credibility, the supply chain wouldn't build the capacity the world is about to need.", "context": "Jensen: 'you better have a large ecosystem of customers to be the offtakers.'", "subvis": null, "section_id": "concepts", "section_num": "08", "section_title": "Business & Strategic Concepts", "section_color": "red", "timestamp_sec": 1120, "timestamp_fmt": "18:40", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1120s"}, {"name": "Capex → Opex conversion", "expansion": "", "plain": "Converting capital expenses (buying GPUs outright) into operating expenses (renting GPU-hours). Core neocloud business model — labs want opex flexibility, not balance-sheet hits.", "analogy": null, "why_matters": "Why Nvidia invests in neoclouds strategically. They handle the capex risk, financing, and datacenter build; labs get per-hour pricing with no 5-year commitment. Bypasses hyperscaler bundling.", "context": "Dwarkesh: 'this whole middleman ecosystem for converting CapEx into OpEx for these labs.'", "subvis": "\n<svg viewBox=\"0 0 680 200\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <defs><marker id=\"co-arr2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1a1613\"/></marker></defs>\n  <text x=\"340\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Labs want GPU-hours. Neoclouds take the capex hit.</text>\n  <rect x=\"40\" y=\"55\" width=\"150\" height=\"70\" fill=\"#fef3d8\" stroke=\"#b8651a\" stroke-width=\"1.5\"/>\n  <text x=\"115\" y=\"85\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\">Nvidia</text>\n  <text x=\"115\" y=\"102\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">sells GPUs</text>\n  <text x=\"115\" y=\"115\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">50-80% gross margin</text>\n  <rect x=\"265\" y=\"55\" width=\"150\" height=\"70\" fill=\"#e8eef5\" stroke=\"#2a5f8f\" stroke-width=\"1.5\"/>\n  <text x=\"340\" y=\"80\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\">Neocloud</text>\n  <text x=\"340\" y=\"96\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">borrows $B, builds DC,</text>\n  <text x=\"340\" y=\"108\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">operates for 5yr, rents</text>\n  <text x=\"340\" y=\"120\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">(CoreWeave, Crusoe)</text>\n  <rect x=\"490\" y=\"55\" width=\"150\" height=\"70\" fill=\"#efe6f2\" stroke=\"#6b4a9e\" stroke-width=\"1.5\"/>\n  <text x=\"565\" y=\"85\" text- forecast demand 2-3 years out, which is exactly what TSMC needs to build fabs.", "context": "Jensen: 'first in, first out. You've got to place a PO.'", "subvis": "\n<svg viewBox=\"0 0 680 200\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Nvidia's allocation: first-in-first-out, not highest bidder</text>\n  <rect x=\"60\" y=\"60\" width=\"560\" height=\"60\" fill=\"#fdfaf1\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <g font-family=\"monospace\" font-size=\"10\">\n    <rect x=\"70\" y=\"70\" width=\"70\" height=\"40\" fill=\"#e8f2e0\" stroke=\"#2f7a3e\"/>\n    <text x=\"105\" y=\"90\" text-anchor=\"middle\" font-weight=\"700\">PO #1</text>\n    <text x=\"105\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" fill=\"#706659\">Q2 2024</text>\n    <rect x=\"145\" y=\"70\" width=\"70\" height=\"40\" fill=\"#e8f2e0\" stroke=\"#2f7a3e\"/>\n    <text x=\"180\" y=\"90\" text-anchor=\"middle\" font-weight=\"700\">PO #2</text>\n    <text x=\"180\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" fill=\"#706659\">Q3 2024</text>\n    <rect x=\"220\" y=\"70\" width=\"70\" height=\"40\" fill=\"#e8f2e0\" stroke=\"#2f7a3e\"/>\n    <text x=\"255\" y=\"90\" text-anchor=\"middle\" font-weight=\"700\">PO #3</text>\n    <text x=\"255\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" fill=\"#706659\">Q4 2024</text>\n    <rect x=\"295\" y=\"70\" width=\"70\" height=\"40\" fill=\"#fef3d8\" stroke=\"#b8651a\"/>\n    <text x=\"330\" y=\"90\" text-anchor=\"middle\" font-weight=\"700\">PO #4</text>\n    <text x=\"330\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" fill=\"#706659\">Q1 2025</text>\n    <rect x=\"370\" y=\"70\" width=\"70\" height=\"40\" fill=\"#fef3d8\" stroke=\"#b8651a\"/>\n    <text x=\"405\" y=\"90\" text-anchor=\"middle\" font-weight=\"700\">PO #5</text>\n    <rect x=\"445\" y=\"70\" width=\"70\" height=\"40\" fill=\"#fef3d8\" stroke=\"#b8651a\"/>\n    <rect x=\"520\" y=\"70\" width=\"70\" height=\"40\" fill=\"#fef3d8\" stroke=\"#b8651a\"/>\n  </g>\n  <text x=\"95\" y=\"140\" font-family=\"monospace\" font-size=\"10\" fill=\"#2f7a3e\">↑ delivered</text>\n  <text x=\"430\" y=\"140\" font-family=\"monospace\" font-size=\"10\" fill=\"#b8651a\">↑ waiting in order</text>\n  <g font-family=\"Georgia\" font-size=\"11\">\n    <text x=\"340\" y=\"168\" text-anchor=\"middle\" fill=\"#706659\" font-style=\"italic\">Elon can't pay more to jump the line.</text>\n    <text x=\"340\" y=\"184\" text-anchor=\"middle\" fill=\"#706659\" font-style=\"italic\">Jensen: \"If I quoted you a price, we quoted you a price.\"</text>\n  </g>\n</svg>", "section_id": "concepts", "section_num": "08", "section_title": "Business & Strategic Concepts", "section_color": "red", "timestamp_sec": 3169, "timestamp_fmt": "52:49", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=3169s"}, {"name": "Mythos", "expansion": "", "plain": "Anthropic's preview-only model, announced April 7, 2026 — a week before this interview. Too powerful to publicly release: in testing, it autonomously found thousands of zero-day vulnerabilities including a 27-year-old bug in OpenBSD, and wrote working exploits. First model Anthropic has withheld from public release.", "analogy": null, "why_matters": "Central to the China export-control debate. Gives Dwarkesh a concrete 'AI is dual-use like nuclear' example Jensen has to reframe. Jensen's counter: compute to train a Mythos-class model is already 'abundantly available' in China.", "context": "Jensen's reply: 'Mythos was trained on fairly mundane capacity... abundantly available in China.'", "subvis": "\n<svg viewBox=\"0 0 680 230\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Anthropic Mythos Preview — announced 7 April 2026</text>\n  <rect x=\"40\" y=\"45\" width=\"600\" height=\"35\" fill=\"#fbeae5\" stroke=\"#a8321f\" stroke-width=\"1.5\"/>\n  <text x=\"340\" y=\"67\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\" fill=\"#a8321f\">Too dangerous to release publicly — first model Anthropic has withheld</text>\n  <g font-family=\"monospace\" font-size=\"10\">\n    <g transform=\"translate(40,100)\">\n      <text x=\"0\" y=\"0\" font-weight=\"700\" fill=\"#1a1613\">What it did in testing:</text>\n      <text x=\"0\" y=\"22\" fill=\"#706659\">• Found 1000s of zero-days autonomously</text>\n      <text x=\"0\" y=\"40\" fill=\"#706659\">• Wrote working exploits, not just bug reports</text>\n      <text x=\"0\" y=\"58\" fill=\"#706659\">• Hit every major OS &amp; web browser</text>\n      <text x=\"0\" y=\"76\" fill=\"#706659\">• 27-year-old OpenBSD TCP bug</text>\n      <text x=\"0\" y=\"94\" fill=\"#706659\">• Escalated to root on Linux kernel</text>\n    </g>\n    <g transform=\"translate(360,100)\">\n      <text x=\"0\" y=\"0\" font-weight=\"700\" fill=\"#1a1613\">Distribution:</text>\n      <text x=\"0\" y=\"22\" fill=\"#706659\">• Project Glasswing consortium</text>\n      <text x=\"0\" y=\"40\" fill=\"#706659\">• AWS, Microsoft, Google, CrowdStrike</text>\n      <text x=\"0\" y=\"58\" fill=\"#706659\">• ~40 orgs, defensive use only</text>\n      <text x=\"0\" y=\"76\" fill=\"#706659\">• $100M Anthropic credits to partners</text>\n      <text x=\"0\" y=\"94\" fill=\"#2f7a3e\" font-weight=\"700\">Jensen: \"compute for it is common in China\"</text>\n    </g>\n  </g>\n  <text x=\"340\" y=\"215\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" font-style=\"italic\" fill=\"#706659\">Dwarkesh's anchor example for dual-use AI restriction. Jensen reframes as post-threshold.</text>\n</svg>", "section_id": "concepts", "section_num": "08", "section_title": "Business & Strategic Concepts", "section_color": "red", "timestamp_sec": 3478, "timestamp_fmt": "57:58", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=3478s"}, {"name": "Zero-day", "expansion": "", "plain": "Software vulnerability unknown to the vendor — no patch exists. Critical currency of offensive cybersecurity. Legitimate bug-bounty markets pay $1M–$10M per zero-day for major products.", "analogy": null, "why_matters": "Dwarkesh's Mythos + OpenBSD example (a 27-year-old bug in software specifically designed to have no bugs) makes cyber-offense visceral, not abstract. The China debate becomes: can the US afford to let adversaries find these first?", "context": "Dwarkesh: 'It found one in OpenBSD... that's existed for 27 years.'", "subvis": "\n<svg viewBox=\"0 0 680 210\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Zero-day lifecycle — Mythos found one 27 years old</text>\n  <line x1=\"60\" y1=\"120\" x2=\"620\" y2=\"120\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <circle cx=\"110\" cy=\"120\" r=\"6\" fill=\"#a8321f\"/>\n  <text x=\"110\" y=\"100\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\" fill=\"#a8321f\">bug introduced</text>\n  <text x=\"110\" y=\"140\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\">(e.g. OpenBSD</text>\n  <text x=\"110\" y=\"153\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\">TCP stack, 1999)</text>\n  <circle cx=\"290\" cy=\"120\" r=\"6\" fill=\"#b8651a\"/>\n  <text x=\"290\" y=\"100\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\" fill=\"#b8651a\">unknown</text>\n  <text x=\"290\" y=\"140\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\">survived every</text>\n  <text x=\"290\" y=\"153\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\">audit &amp; fuzzer</text>\n  <circle cx=\"450\" cy=\"120\" r=\"6\" fill=\"#6b4a9e\"/>\n  <text x=\"450\" y=\"100\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\" fill=\"#6b4a9e\">Mythos finds it</text>\n  <text x=\"450\" y=\"140\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\">April 2026,</text>\n  <text x=\"450\" y=\"153\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\">in one red-team run</text>\n  <circle cx=\"590\" cy=\"120\" r=\"6\" fill=\"#2f7a3e\"/>\n  <text x=\"590\" y=\"100\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\" fill=\"#2f7a3e\">patch</text>\n  <text x=\"590\" y=\"140\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\">coordinated</text>\n  <text x=\"590\" y=\"153\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\">disclosure</text>\n  <path d=\"M 110 120 L 450 120\" stroke=\"#a8321f\" stroke-width=\"2.5\" opacity=\"0.4\"/>\n  <text x=\"280\" y=\"185\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\" fill=\"#a8321f\">→ 27-year exploit window ←</text>\n  <text x=\"340\" y=\"200\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" font-style=\"italic\" fill=\"#706659\">Dwarkesh's argument: this is dual-use tech. Jensen disagrees on restriction mechanics.</text>\n</svg>", "section_id": "concepts", "section_num": "08", "section_title": "Business & Strategic Concepts", "section_color": "red", "timestamp_sec": 3485, "timestamp_fmt": "58:05", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=3485s"}]};

const TERM_COUNT = DATA.terms.length;

const stage = document.getElementById('stage');
const slides = [];
const termIndexMap = {};

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function addSlide(kind, html, extraClass = '') {
  const div = document.createElement('div');
  div.className = 'slide ' + kind + (extraClass ? ' ' + extraClass : '');
  div.innerHTML = '<div class="slide-inner" tabindex="-1">' + html + '</div>';
  stage.appendChild(div);
  slides.push({kind, el: div});
}

// === Title slide: with hook, meta, hint, graffiti credit ===
addSlide('title', `

// === Sections and term slides ===
DATA.sections.forEach(section => {

document.getElementById('total').textContent = slides.length;

// === Navigation ===
let current = 0;
const backToTop = document.getElementById('backToTop');

function updateBackToTop() {
  backToTop.hidden = (slides[current].el.querySelector('.slide-inner')?.scrollTop || 0) <= 300;
}
stage.addEventListener('scroll', updateBackToTop, true);
backToTop.addEventListener('click', () => {
  const inner = slides[current].el.querySelector('.slide-inner');
  inner.scrollTo({ top: 0, behavior: 'instant' });
  inner.focus({ preventScroll: true });
  updateBackToTop();
});

function showSlide(i) {
  if (i < 0 || i >= slides.length) return;
  const moveFocus = slides[current].el.contains(document.activeElement);
  slides[current].el.classList.remove('active');
  current = i;
  slides[current].el.classList.add('active');
  document.getElementById('cur').textContent = i + 1;
  updateProgress();
  // Update URL hash for deep linking (useful for GH Pages)
  history.replaceState(null, '', '#s' + (i + 1));
  const inner = slides[current].el.querySelector('.slide-inner');
  if (inner) {
    inner.scrollTop = 0;
    if (moveFocus) inner.focus({ preventScroll: true });
  }
  updateBackToTop();
}

function next() { if (current < slides.length - 1) showSlide(current + 1); }
function prev() { if (current > 0) showSlide(current - 1); }

function buildProgress() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  slides.forEach((s, i) => {
    const d = document.createElement('span');
    d.className = 'dot';
    p.appendChild(d);
  });
}
function updateProgress() {
  const dots = document.querySelectorAll('#progress .dot');
  dots.forEach((d, i) => d.classList.toggle('active', i === current));
}

document.getElementById('nextBtn').onclick = next;
document.getElementById('prevBtn').onclick = prev;
document.getElementById('idxBtn').onclick = openOverlay;

// === Overlay / search ===
const overlay = document.getElementById('overlay');
const searchInput = document.getElementById('searchInput');
const resultsDiv = document.getElementById('results');
let highlightIdx = 0;
let currentResults = [];
let searchOpener = null;

searchInput.placeholder = `Find any term - type to search, or browse all ${TERM_COUNT}...`;

function openOverlay() {
  if (overlay.open) return;
  searchOpener = document.activeElement;
  searchInput.value = '';
  renderResults('');
  overlay.showModal();
  searchInput.focus({ preventScroll: true });
}
function closeOverlay() {
  if (!overlay.open) return;
  overlay.close();
  if (searchOpener instanceof HTMLElement) searchOpener.focus({ preventScroll: true });
}
overlay.addEventListener('cancel', e => { e.preventDefault(); closeOverlay(); });
overlay.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const controls = [...overlay.querySelectorAll('input, button')];
  const first = controls[0], last = controls[controls.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault(); first.focus();
  }
});
document.getElementById('escBtn').onclick = closeOverlay;
// Click outside panel to close
overlay.addEventListener('click', e => {
  if (e.target === overlay) closeOverlay();
});

function renderResults(query) {
  const q = query.trim().toLowerCase();
  let filtered;
  if (!q) {
    filtered = DATA.terms.slice();
  } else {
    filtered = DATA.terms.filter(t =>
      t.name.toLowerCase().includes(q) ||
      (t.expansion || '').toLowerCase().includes(q) ||
      t.plain.toLowerCase().includes(q) ||
      t.section_title.toLowerCase().includes(q)
    );
  }
  currentResults = filtered;
  highlightIdx = 0;
  document.getElementById('searchStatus').textContent = `${filtered.length} ${filtered.length === 1 ? 'term' : 'terms'} found.`;

  if (filtered.length === 0) {
    resultsDiv.innerHTML = '<div class="no-results">No matches. Try "cuda", "hbm", "moat", "mythos"...</div>';
    return;
  }

  const bySection = {};
  filtered.forEach(t => {
    if (!bySection[t.section_id]) bySection[t.section_id] = [];
    bySection[t.section_id].push(t);
  });

  let html = '';
  let flatIdx = 0;
  DATA.sections.forEach(section => {
    if (!bySection[section.id]) return;
    html += '<div class="result-group-head">' + escapeHtml(section.num + ' · ' + section.title) + '</div>';
    bySection[section.id].forEach(t => {
      const preview = t.plain.substring(0, 80) + (t.plain.length > 80 ? '…' : '');
      html += '<button type="button" class="result" data-term="' + escapeHtml(t.name) + '" data-idx="' + flatIdx + '">' +
        '<span class="result-left">' +
          '<span class="section tag-' + section.color + '">' + section.num + '</span>' +
          '<span class="name">' + highlight(t.name, q) + '</span>' +
          '<span class="preview">' + highlight(preview, q) + '</span>' +
        '</span>' +
        '<span class="ts">▶ ' + t.timestamp_fmt + '</span>' +
      '</button>';
      flatIdx++;
    });
  });

  resultsDiv.innerHTML = html;
  resultsDiv.querySelectorAll('.result').forEach(el => {
    el.addEventListener('click', () => {
      jumpToTerm(el.getAttribute('data-term'));
    });
  });
  updateHighlight();
}

function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const safe = escapeHtml(text);
  try {
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return safe.replace(re, '<mark>$1</mark>');
  } catch (e) { return safe; }
}

function updateHighlight() {
  const items = resultsDiv.querySelectorAll('.result');
  items.forEach((el, i) => el.classList.toggle('highlight', i === highlightIdx));
  if (items[highlightIdx]) items[highlightIdx].scrollIntoView({block: 'nearest'});
}

function jumpToTerm(name) {
  const idx = termIndexMap[name];
  if (idx !== undefined) {
    closeOverlay();
    showSlide(idx);
    slides[current].el.querySelector('.slide-inner').focus({ preventScroll: true });
  }
}

searchInput.addEventListener('input', e => renderResults(e.target.value));
searchInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    highlightIdx = Math.min(highlightIdx + 1, currentResults.length - 1);
    updateHighlight();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    highlightIdx = Math.max(highlightIdx - 1, 0);
    updateHighlight();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (currentResults[highlightIdx]) jumpToTerm(currentResults[highlightIdx].name);
  } else if (e.key === 'Escape') {
    e.preventDefault(); closeOverlay();
  }
});

// === Global keys ===
document.addEventListener('keydown', e => {
  if (overlay.open) {
    if (e.key === 'Escape') closeOverlay();
    return;
  }
  // Preserve native typing, activation and navigation on focused controls.
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.target.closest('input, textarea, select, button, a, [contenteditable="true"]')) return;

  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
    e.preventDefault(); next();
  } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
    e.preventDefault(); prev();
  } else if (e.key === '/' || e.key.toLowerCase() === 'i') {
    e.preventDefault(); openOverlay();
  } else if (e.key === 'Home') {
    e.preventDefault(); showSlide(0);
  } else if (e.key === 'End') {
    e.preventDefault(); showSlide(slides.length - 1);
  }
});

// === Touch gestures (swipe) ===
let touchStartX = null, touchStartY = null, touchStartTime = 0;
const deck = document.getElementById('deck');

deck.addEventListener('touchstart', e => {
  // Don't treat touch as swipe if starting in overlay
  if (overlay.open) return;
  if (e.touches.length !== 1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();
}, {passive: true});

deck.addEventListener('touchend', e => {
  if (touchStartX === null || overlay.open) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  // Require: fast enough, mostly horizontal, significant distance
  if (dt < 600 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0) next(); else prev();
  }
  touchStartX = null;
}, {passive: true});

// === Initial hash-based deep link ===
function initialSlide() {
  const m = /^#s(\d+)$/.exec(location.hash);
  if (m) {
    const n = parseInt(m[1], 10) - 1;
    if (n >= 0 && n < slides.length) return n;
  }
  return 0;
}

// === Init ===
buildProgress();
showSlide(initialSlide());
</script>
