<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

<style>
  :root {
    --bg: #faf6f0;
    --bg-panel: #fffdf8;
    --bg-soft: #f5eedc;
    --bg-dim: #ebe2d2;
    --ink: #1a1613;
    --ink-soft: #433c35;
    --ink-mute: #706659;
    --accent-amber: #b8651a;
    --accent-rose: #a83b5e;
    --accent-teal: #1f6b6b;
    --accent-green: #2f7a3e;
    --accent-purple: #6b4a9e;
    --accent-blue: #2a5f8f;
    --accent-red: #a8321f;
    --accent-dark: #1a1613;
    --rule: #d9cfc0;
    --rule-soft: #ebe2d2;
    --nv-green: #76b900;
    --code-bg: #f2ebdc;
    --yt-red: #cc3333;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    overflow: hidden;
    height: 100%;
    height: 100dvh; /* dynamic viewport - handles mobile browser chrome */
    -webkit-text-size-adjust: 100%;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at top left, rgba(118, 185, 0, 0.08), transparent 28%),
      radial-gradient(circle at top right, rgba(31, 107, 107, 0.08), transparent 26%),
      linear-gradient(180deg, rgba(255,255,255,0.28), rgba(250,246,240,0));
    pointer-events: none;
  }

  /* ===== Deck frame ===== */
  .deck {
    width: 100vw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    touch-action: pan-y;
  }
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(20px, 4vw, 48px) clamp(16px, 4vw, 56px) 12px;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }
  .slide {
    width: 100%;
    max-width: 1024px;
    max-height: 100%;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .slide.active { display: flex; }
  .slide-inner {
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--rule) transparent;
    -webkit-overflow-scrolling: touch;
  }
  .slide-inner::-webkit-scrollbar { width: 6px; }
  .slide-inner::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }

  .slide.term .slide-inner,
  .slide.method .slide-inner {
    background:
      linear-gradient(180deg, rgba(255, 253, 248, 0.96), rgba(255, 250, 241, 0.92));
    border: 1px solid rgba(217, 207, 192, 0.85);
    border-radius: 18px;
    box-shadow: 0 22px 50px rgba(55, 43, 28, 0.08);
    padding: clamp(18px, 2.2vw, 26px);
  }

  /* ===== Title slide ===== */
  .slide.title { text-align: center; justify-content: center; align-items: center; }
  .slide.title .slide-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
  }
  .slide.title .kicker {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: clamp(11px, 2vw, 13px);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-green);
    margin-bottom: 14px;
  }
  .slide.title h1 {
    font-size: clamp(28px, 5.5vw, 52px);
    line-height: 1.1;
    margin: 0 0 18px;
    font-weight: 700;
    letter-spacing: -0.015em;
    max-width: 900px;
  }
  .slide.title .hook {
    font-size: clamp(16px, 2.4vw, 20px);
    line-height: 1.5;
    color: var(--ink-soft);
    max-width: 720px;
    margin: 0 auto 16px;
    font-style: italic;
  }
  .slide.title .hook strong {
    font-style: normal;
    color: var(--ink);
    background: linear-gradient(transparent 60%, #fef3d8 60%);
    padding: 0 2px;
  }
  .slide.title .pitch {
    font-size: clamp(14px, 2vw, 16px);
    color: var(--ink-mute);
    max-width: 680px;
    margin: 0 auto 32px;
    line-height: 1.55;
  }
  .slide.title .meta-grid {
    display: grid;
    grid-template-columns: repeat(3, auto);
    gap: clamp(20px, 4vw, 48px);
    margin-top: 12px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: 0.06em;
  }
  .slide.title .meta-grid strong {
    display: block;
    color: var(--ink);
    font-size: clamp(18px, 3vw, 24px);
    letter-spacing: 0;
    margin-bottom: 3px;
    font-family: Georgia, serif;
    font-weight: 700;
  }
  .slide.title .verify-note {
    margin-top: 18px;
    max-width: 720px;
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(10px, 1.5vw, 11.5px);
    letter-spacing: 0.06em;
    line-height: 1.7;
    color: var(--ink-mute);
    padding: 10px 14px;
    border: 1px solid var(--rule);
    background: rgba(255, 253, 248, 0.92);
    border-radius: 6px;
  }
  .slide.title .hint {
    margin-top: clamp(28px, 4vh, 48px);
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(10px, 1.4vw, 11.5px);
    letter-spacing: 0.1em;
    color: var(--ink-mute);
    max-width: 640px;
    line-height: 1.6;
  }
  .slide.title .hint kbd {
    display: inline-block;
    padding: 2px 8px;
    border: 1px solid var(--rule);
    background: var(--bg-panel);
    border-radius: 3px;
    font-family: inherit;
    font-size: 10px;
    margin: 0 2px;
    color: var(--ink);
  }

  /* Terminal-prompt credit byline — matches deck's editorial + cyberpunk tone */
  .credit-tag {
    margin-top: clamp(24px, 5vh, 44px);
    display: inline-flex;
    align-items: center;
    gap: 0.4em;
    font-family: "IBM Plex Mono", "SF Mono", ui-monospace, monospace;
    font-size: clamp(12px, 1.7vw, 14px);
    letter-spacing: 0.04em;
    color: var(--ink-mute);
    text-decoration: none;
    padding: 8px 14px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: var(--bg-panel);
    transition: all 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
    white-space: nowrap;
  }
  .credit-tag .prompt {
    color: var(--accent-green);
    font-weight: 700;
  }
  .credit-tag .label {
    color: var(--ink-mute);
  }
  .credit-tag .handle {
    color: var(--ink);
    font-weight: 700;
    border-bottom: 1px dotted transparent;
    transition: border-color 0.18s;
  }
  .credit-tag .arrow {
    display: inline-block;
    color: var(--ink-mute);
    font-size: 0.85em;
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.2s;
    margin-left: 0.1em;
  }
  .credit-tag:hover,
  .credit-tag:focus-visible {
    border-color: var(--accent-green);
    background: #f4f9ee;
    color: var(--ink);
    outline: none;
  }
  .credit-tag:hover .handle,
  .credit-tag:focus-visible .handle {
    border-bottom-color: var(--ink);
  }
  .credit-tag:hover .arrow,
  .credit-tag:focus-visible .arrow {
    transform: translate(2px, -2px);
    color: var(--accent-green);
  }

  /* ===== Verification slide ===== */
  .slide.method { justify-content: center; }
  .slide.method .method-kicker {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-green);
    margin-bottom: 14px;
  }
  .slide.method h2 {
    font-size: clamp(28px, 5vw, 44px);
    line-height: 1.08;
    margin: 0 0 18px;
    letter-spacing: -0.02em;
  }
  .slide.method .method-lede {
    font-size: clamp(15px, 2vw, 18px);
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 760px;
    margin: 0 0 24px;
  }
  .slide.method .method-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    width: 100%;
  }
  .slide.method .method-block {
    padding-top: 14px;
    border-top: 2px solid var(--rule);
  }
  .slide.method .method-head {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-bottom: 10px;
  }
  .slide.method .method-copy {
    font-size: clamp(14px, 1.9vw, 16px);
    line-height: 1.65;
    color: var(--ink);
  }
  .slide.method .method-copy strong {
    color: var(--accent-green);
  }

  /* ===== Outro slide ===== */
  .slide.outro { text-align: center; justify-content: center; align-items: center; }
  .slide.outro .slide-inner {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; padding: 20px;
  }
  .slide.outro .outro-kicker {
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(11px, 1.6vw, 12px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent-green);
    margin-bottom: 28px;
  }
  .slide.outro .outro-quote {
    font-family: "Iowan Old Style", Georgia, serif;
    font-size: clamp(22px, 3.8vw, 34px);
    line-height: 1.25;
    color: var(--ink);
    margin: 0 auto 18px;
    max-width: 820px;
    font-style: italic;
    font-weight: 500;
    padding: 0 10px;
  }
  .slide.outro .outro-mark,
  .slide.outro .outro-mark-close {
    font-family: Georgia, serif;
    color: var(--accent-amber);
    font-size: 1.15em;
    font-style: normal;
    font-weight: 700;
    vertical-align: -0.1em;
    opacity: 0.75;
  }
  .slide.outro .outro-cite {
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(11px, 1.8vw, 13px);
    letter-spacing: 0.1em;
    color: var(--ink-mute);
    margin-bottom: 36px;
  }
  .slide.outro .outro-divider {
    width: 60px; height: 2px; background: var(--accent-amber); margin: 0 auto 30px;
    opacity: 0.6;
  }
  .slide.outro .outro-cta {
    font-size: clamp(14px, 2vw, 16px);
    color: var(--ink-soft);
    line-height: 1.7;
    max-width: 560px;
    margin: 0 auto 32px;
  }
  .slide.outro .outro-cta kbd {
    display: inline-block;
    padding: 2px 8px;
    border: 1px solid var(--rule);
    background: var(--bg-panel);
    border-radius: 3px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    margin: 0 2px;
    color: var(--ink);
  }
  .slide.outro .outro-cta strong {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.92em;
    background: var(--bg-panel);
    border: 1px solid var(--rule);
    padding: 2px 8px;
    border-radius: 3px;
    color: var(--ink);
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .slide.outro .outro-loop {
    font-size: 0.9em;
    color: var(--ink-mute);
    font-style: italic;
  }
  .slide.outro .credit-tag-large {
    font-size: clamp(14px, 2vw, 16px);
    padding: 10px 20px;
    margin: 4px 0 22px;
  }
  .slide.outro .credit-tag-large .arrow { font-size: 0.9em; }
  .slide.outro .outro-sig {
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(10px, 1.4vw, 11px);
    letter-spacing: 0.06em;
    color: var(--ink-mute);
    margin-top: 4px;
  }

  /* Landscape phone tightening for outro */
  @media (max-height: 500px) and (orientation: landscape) {
    .slide.outro .outro-kicker { margin-bottom: 10px; }
    .slide.outro .outro-quote { font-size: 18px; margin-bottom: 8px; }
    .slide.outro .outro-cite { margin-bottom: 12px; }
    .slide.outro .outro-divider { margin-bottom: 12px; }
    .slide.outro .outro-cta { margin-bottom: 14px; }
    .slide.outro .credit-tag-large { margin: 0 0 6px; }
  }

  /* ===== Section divider ===== */
  .slide.divider { justify-content: center; align-items: center; text-align: center; }
  .slide.divider .slide-inner {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
    padding: 20px;
  }
  .slide.divider .sect-num {
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(11px, 2vw, 14px);
    letter-spacing: 0.2em;
    color: var(--ink-mute);
    margin-bottom: 12px;
  }
  .slide.divider h2 {
    font-size: clamp(30px, 6vw, 54px);
    line-height: 1.1;
    margin: 0 0 18px;
    letter-spacing: -0.01em;
  }
  .slide.divider .sub {
    font-size: clamp(15px, 2.2vw, 19px);
    font-style: italic;
    color: var(--ink-soft);
    max-width: 700px;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .slide.divider .term-count {
    display: inline-block;
    padding: 8px 18px;
    background: var(--bg-panel);
    border: 1px solid var(--rule);
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    border-radius: 3px;
    color: var(--ink-soft);
  }

  /* ===== Term slide ===== */
  .slide.term .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .slide.term .title-col {
    flex: 1;
    min-width: 0;
  }
  .slide.term .sect-tag {
    display: inline-block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 3px;
    color: #fff;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .slide.term h2 {
    font-family: "IBM Plex Mono", "SF Mono", monospace;
    font-size: clamp(22px, 3.6vw, 36px);
    letter-spacing: -0.01em;
    margin: 4px 0 2px;
    font-weight: 700;
    color: var(--ink);
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .slide.term .expansion {
    font-size: clamp(13px, 1.8vw, 15px);
    color: var(--ink-mute);
    font-style: italic;
    margin-top: 2px;
  }
  .slide.term .plain {
    font-size: clamp(15px, 2.2vw, 18px);
    line-height: 1.55;
    color: var(--ink);
    margin: 0 0 16px;
  }
  .slide.term .analogy {
    background: #fef7e4;
    border-left: 3px solid var(--accent-amber);
    padding: 10px 14px;
    font-size: clamp(13px, 1.9vw, 15px);
    font-style: italic;
    color: var(--ink-soft);
    margin: 12px 0;
    border-radius: 0 2px 2px 0;
    line-height: 1.5;
  }
  .slide.term .analogy::before {
    content: "Analogy — ";
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    font-style: normal;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-amber);
    font-weight: 700;
    margin-right: 3px;
  }
  .slide.term .matters {
    font-size: clamp(13px, 1.9vw, 15px);
    padding: 10px 14px;
    margin: 12px 0;
    background: #eef4ee;
    border-left: 3px solid var(--accent-green);
    border-radius: 0 2px 2px 0;
    line-height: 1.5;
  }
  .slide.term .matters::before {
    content: "Why it matters — ";
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-green);
    font-weight: 700;
    margin-right: 3px;
  }
  .slide.term .context {
    font-size: clamp(13px, 1.8vw, 14.5px);
    background: var(--code-bg);
    padding: 10px 14px;
    border-left: 2px solid var(--rule);
    border-radius: 0 2px 2px 0;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-top: 12px;
  }
  .slide.term .context::before {
    content: "In the interview — ";
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-amber);
    font-weight: 700;
    margin-right: 3px;
  }
  .slide.term .subvis {
    margin: 14px 0;
    padding: 12px;
    background: #fdfaf1;
    border: 1px solid var(--rule-soft);
    border-radius: 3px;
    text-align: center;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .slide.term .subvis svg {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 0 auto;
  }
  .slide.term.dense .header {
    margin-bottom: 14px;
    padding-bottom: 10px;
  }
  .slide.term.dense h2 {
    font-size: clamp(20px, 3.2vw, 32px);
  }
  .slide.term.dense .plain {
    font-size: clamp(14px, 2vw, 16px);
    line-height: 1.48;
    margin-bottom: 12px;
  }
  .slide.term.dense .analogy,
  .slide.term.dense .matters,
  .slide.term.dense .context {
    font-size: clamp(12px, 1.8vw, 14px);
    line-height: 1.45;
    padding: 9px 12px;
    margin: 10px 0;
  }
  .slide.term.dense .subvis {
    margin: 12px 0;
    padding: 10px;
  }

  /* YouTube chip */
  .yt-chip {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 12px;
    background: #fff;
    border: 1.5px solid var(--yt-red);
    border-radius: 4px;
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(11px, 1.6vw, 12.5px);
    font-weight: 700;
    color: var(--yt-red);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    align-self: flex-start;
  }
  .yt-chip:hover, .yt-chip:active {
    background: var(--yt-red);
    color: #fff;
    transform: translateY(-1px);
  }
  .yt-chip svg { width: 13px; height: 13px; flex-shrink: 0; }
  .yt-chip .chip-label {
    font-size: 9.5px;
    color: var(--ink-mute);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .yt-chip:hover .chip-label, .yt-chip:active .chip-label {
    color: #fff; opacity: 0.9;
  }

  /* Section tag colors */
  .tag-amber  { background: var(--accent-amber); }
  .tag-rose   { background: var(--accent-rose); }
  .tag-teal   { background: var(--accent-teal); }
  .tag-green  { background: var(--accent-green); }
  .tag-purple { background: var(--accent-purple); }
  .tag-blue   { background: var(--accent-blue); }
  .tag-dark   { background: var(--accent-dark); }
  .tag-red    { background: var(--accent-red); }

  /* ===== Bottom bar ===== */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px clamp(10px, 2vw, 20px);
    background: var(--bg-panel);
    border-top: 1px solid var(--rule);
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(10px, 1.4vw, 11px);
    color: var(--ink-mute);
    letter-spacing: 0.05em;
    gap: 10px;
    min-height: 44px;
    flex-shrink: 0;
  }
  .bar .counter {
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .bar .center {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-shrink: 0;
  }
  .bar button {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink);
    font-family: inherit;
    font-size: clamp(10px, 1.3vw, 11px);
    letter-spacing: 0.06em;
    padding: 6px clamp(8px, 1.5vw, 14px);
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.12s;
    min-height: 32px; /* tap target */
    white-space: nowrap;
  }
  .bar button:hover, .bar button:active {
    background: var(--ink);

billion transistors.", "analogy": "If the chip package were a city, the logic die is the factory district. Memory dies are warehouses. Interconnects are roads.", "why_matters": "When Jensen talks about co-design, this is literally the piece being co-designed with HBM, NVLink, and CUDA — all four layers redesigned together each generation.", "context": "Jensen: 'TSMC builds the logic dies, it builds the switches, then it packages them with the HBM.'", "subvis": null, "section_id": "silicon", "section_num": "01", "section_title": "Silicon & Process Nodes", "section_color": "amber", "timestamp_sec": 14, "timestamp_fmt": "0:14", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=14s"}, {"name": "Process node", "expansion": "(N3, N2, 7nm, 5nm, 1.6nm)", "plain": "Generation of chip manufacturing — denser transistors per square millimeter. Each generation packs ~1.7× the transistors of the last. But 'nm' is a marketing label — a '3nm' chip's actual feature size is closer to 20nm.", "analogy": "Like camera 'megapixels' in the 2010s — the number stopped meaning one specific physical thing and became a generation label. N3 is newer than N5, but neither is literally those dimensions.", "why_matters": "Understanding that 'nm' is marketing is required to follow two arguments: Jensen's Moore's-Law-is-dead case, and the China export-controls debate — China is stuck at 7nm equivalent because they can't make newer without EUV.", "context": "Dwarkesh: Nvidia is ~60% of TSMC N3, projected to be 86% of N2 next year. China stuck at 7nm.", "subvis": "\n<svg viewBox=\"0 0 720 240\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"360\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Transistor density: each node ~1.7× the previous</text>\n  <line x1=\"40\" y1=\"195\" x2=\"680\" y2=\"195\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <g font-family=\"monospace\" font-size=\"10\" fill=\"#1a1613\">\n    <g transform=\"translate(90,195)\">\n      <circle cx=\"0\" cy=\"0\" r=\"5\" fill=\"#a8321f\"/>\n      <text text-anchor=\"middle\" y=\"18\" font-weight=\"700\">7nm</text>\n      <text text-anchor=\"middle\" y=\"32\" font-size=\"9\" fill=\"#706659\">~95M tr/mm²</text>\n      <text text-anchor=\"middle\" y=\"-100\" font-size=\"10\" font-weight=\"700\" fill=\"#a8321f\">China</text>\n      <text text-anchor=\"middle\" y=\"-86\" font-size=\"9\" fill=\"#706659\">ceiling</text>\n      <text text-anchor=\"middle\" y=\"-72\" font-size=\"9\" fill=\"#706659\">(SMIC DUV)</text>\n      <line x1=\"0\" y1=\"-60\" x2=\"0\" y2=\"-6\" stroke=\"#a8321f\" stroke-dasharray=\"2,2\"/>\n    </g>\n    <g transform=\"translate(220,195)\">\n      <circle cx=\"0\" cy=\"0\" r=\"5\" fill=\"#b8651a\"/>\n      <text text-anchor=\"middle\" y=\"18\" font-weight=\"700\">5nm</text>\n      <text text-anchor=\"middle\" y=\"32\" font-size=\"9\" fill=\"#706659\">~135M tr/mm²</text>\n    </g>\n    <g transform=\"translate(350,195)\">\n      <circle cx=\"0\" cy=\"0\" r=\"7\" fill=\"#2a5f8f\"/>\n      <text text-anchor=\"middle\" y=\"18\" font-weight=\"700\">N4/N3</text>\n      <text text-anchor=\"middle\" y=\"32\" font-size=\"9\" fill=\"#706659\">~220M tr/mm²</text>\n      <text text-anchor=\"middle\" y=\"-100\" font-size=\"10\" font-weight=\"700\" fill=\"#2a5f8f\">Blackwell</text>\n      <text text-anchor=\"middle\" y=\"-86\" font-size=\"9\" fill=\"#706659\">Nvidia ~60%</text>\n      <text text-anchor=\"middle\" y=\"-72\" font-size=\"9\" fill=\"#706659\">of TSMC N3</text>\n      <line x1=\"0\" y1=\"-60\" x2=\"0\" y2=\"-8\" stroke=\"#2a5f8f\" stroke-dasharray=\"2,2\"/>\n    </g>\n    <g transform=\"translate(490,195)\">\n      <circle cx=\"0\" cy=\"0\" r=\"7\" fill=\"#2f7a3e\"/>\n      <text text-anchor=\"middle\" y=\"18\" font-weight=\"700\">N2</text>\n      <text text-anchor=\"middle\" y=\"32\" font-size=\"9\" fill=\"#706659\">~320M tr/mm²</text>\n      <text text-anchor=\"middle\" y=\"-100\" font-size=\"10\" font-weight=\"700\" fill=\"#2f7a3e\">Rubin</text>\n      <text text-anchor=\"middle\" y=\"-86\" font-size=\"9\" fill=\"#706659\">CES 2026</text>\n      <line x1=\"0\" y1=\"-60\" x2=\"0\" y2=\"-8\" stroke=\"#2f7a3e\" stroke-dasharray=\"2,2\"/>\n    </g>\n    <g transform=\"translate(620,195)\">\n      <circle cx=\"0\" cy=\"0\" r=\"5\" fill=\"#6b4a9e\"/>\n      <text text-anchor=\"middle\" y=\"18\" font-weight=\"700\">1.6nm</text>\n      <text text-anchor=\"middle\" y=\"32\" font-size=\"9\" fill=\"#706659\">~420M tr/mm²</text>\n    </g>\n  </g>\n  <text x=\"360\" y=\"230\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-style=\"italic\" fill=\"#706659\">\"nm\" is a marketing label now — actual feature size is ~10× larger</text>\n</svg>", "section_id": "silicon", "section_num": "01", "section_title": "Silicon & Process Nodes", "section_color": "amber", "timestamp_sec": 529, "timestamp_fmt": "8:49", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=529s"}, {"name": "EUV", "expansion": "(Extreme Ultraviolet Lithography)", "plain": "Only way to print sub-7nm chips. Uses 13.5nm ultraviolet light generated by firing a CO₂ laser at tin droplets 50,000 times per second — the tin vaporizes into plasma that emits EUV. Each machine: ~$200M, weighs 180 tons, takes a year to ship. Only ASML makes them. China is banned from buying them.", "analogy": "Trying to draw fine detail on a grain of rice using a spotlight bounced through a stencil — where the spotlight, stencil, mirrors, and room all have to be precise to within a few atoms.", "why_matters": "Export control on EUV is the single most consequential tech policy lever in existence. Without EUV, no leading-edge chips. China's entire AI hardware strategy is shaped by this one constraint.", "context": "Central chokepoint of the chip war. Dwarkesh asks how to keep doubling compute if EUV is constrained.", "subvis": "\n<svg viewBox=\"0 0 680 220\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"20\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">EUV: how you print at atomic scale</text>\n  <circle cx=\"80\" cy=\"110\" r=\"24\" fill=\"#fef3d8\" stroke=\"#b8651a\" stroke-width=\"1.5\"/>\n  <text x=\"80\" y=\"114\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\">CO₂ laser</text>\n  <text x=\"80\" y=\"150\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">fires 50,000×/sec</text>\n  <text x=\"80\" y=\"164\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">at tin droplet</text>\n  <circle cx=\"210\" cy=\"110\" r=\"20\" fill=\"#1a1613\"/>\n  <circle cx=\"210\" cy=\"110\" r=\"8\" fill=\"#f5a623\"/>\n  <text x=\"210\" y=\"150\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">tin vaporizes</text>\n  <text x=\"210\" y=\"164\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">into plasma</text>\n  <text x=\"210\" y=\"178\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">→ 13.5nm UV</text>\n  <path d=\"M 232 110 Q 280 85 320 110\" fill=\"none\" stroke=\"#a8321f\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\"/>\n  <rect x=\"320\" y=\"88\" width=\"14\" height=\"44\" fill=\"#706659\" rx=\"2\"/>\n  <text x=\"327\" y=\"150\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">multilayer</text>\n  <text x=\"327\" y=\"164\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">mirrors</text>\n  <path d=\"M 334 110 L 390 110\" stroke=\"#a8321f\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\"/>\n  <rect x=\"400\" y=\"78\" width=\"70\" height=\"64\" fill=\"#fffdf8\" stroke=\"#1a1613\" stroke-width=\"1.5\" rx=\"1\"/>\n  <text x=\"435\" y=\"100\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" font-weight=\"700\">mask</text>\n  <line x1=\"410\" y1=\"108\" x2=\"460\" y2=\"108\" stroke=\"#1a1613\" stroke-width=\"0.5\"/>\n  <line x1=\"410\" y1=\"116\" x2=\"460\" y2=\"116\" stroke=\"#1a1613\" stroke-width=\"0.5\"/>\n  <line x1=\"410\" y1=\"124\" x2=\"460\" y2=\"124\" stroke=\"#1a1613\" stroke-width=\"0.5\"/>\n  <text x=\"435\" y=\"150\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">pattern</text>\n  <text x=\"435\" y=\"164\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">stencil</text>\n  <path d=\"M 470 110 L 535 110\" stroke=\"#a8321f\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\"/>\n  <rect x=\"545\" y=\"70\" width=\"90\" height=\"80\" rx=\"3\" fill=\"#e8f2e0\" stroke=\"#2f7a3e\" stroke-width=\"1.5\"/>\n  <text x=\"590\" y=\"100\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\">wafer</text>\n  <text x=\"590\" y=\"118\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">photoresist</text>\n  <text x=\"590\" y=\"132\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">exposed</text>\n  <text x=\"590\" y=\"150\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">$200M/machine,</text>\n  <text x=\"590\" y=\"164\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">180 tons, ASML-only</text>\n  <text x=\"340\" y=\"206\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-style=\"italic\" fill=\"#706659\">Every leading-edge chip in the world passes through a machine like this</text>\n</svg>", "section_id": "silicon", "section_num": "01", "section_title": "Silicon & Process Nodes", "section_color": "amber", "timestamp_sec": 843, "timestamp_fmt": "14:03", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=843s"}, {"name": "Moore's Law", "expansion": "", "plain": "1965 observation: transistor count doubles every ~2 years. Today's rate is ~25%/year and slowing. Gains now come from architecture, not transistor scaling.", "analogy": "Like saying 'cars will keep getting 2× faster every 2 years.' True for decades; physics eventually pushes back.", "why_matters": "Jensen's central technical argument against ASICs: if Moore's Law gives only 25%/yr, you need flexibility to compound gains through algorithm changes.", "context": "Jensen: 'The only way to get 10x or 100x leaps is to fundamentally change the algorithm and how it's computed every single year.'", "subvis": "\n<svg viewBox=\"0 0 680 240\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Transistor scaling slowed. Architecture gains sped up.</text>\n  <line x1=\"60\" y1=\"200\" x2=\"640\" y2=\"200\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <line x1=\"60\" y1=\"50\" x2=\"60\" y2=\"200\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <text x=\"350\" y=\"228\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\">YEAR</text>\n  <text x=\"25\" y=\"130\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\" transform=\"rotate(-90 25 130)\">PERF (log)</text>\n  <path d=\"M 70 185 Q 180 140 340 70 T 620 35\" fill=\"none\" stroke=\"#b8651a\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/>\n  <text x=\"160\" y=\"135\" font-family=\"Georgia\" font-size=\"11\" fill=\"#b8651a\" font-style=\"italic\">\"classic\" Moore's Law</text>\n  <text x=\"160\" y=\"150\" font-family=\"Georgia\" font-size=\"10\" fill=\"#b8651a\" font-style=\"italic\">(2× every 2yr, Dennard-era)</text>\n  <path d=\"M 70 185 Q 180 155 340 115\" fill=\"none\" stroke=\"#706659\" stroke-width=\"1.5\"/>\n  <text x=\"200\" y=\"178\" font-family=\"Georgia\" font-size=\"10\" fill=\"#706659\" font-style=\"italic\">actual silicon: ~25%/yr since ~2015</text>\n  <path d=\"M 340 115 Q 440 90 560 50\" fill=\"none\" stroke=\"#2f7a3e\" stroke-width=\"2.5\"/>\n  <circle cx=\"510\" cy=\"63\" r=\"5\" fill=\"#76b900\"/>\n  <text x=\"500\" y=\"45\" text-anchor=\"end\" font-family=\"Georgia\" font-size=\"10\" font-weight=\"700\" fill=\"#2f7a3e\">Hopper → Blackwell</text>\n  <text x=\"500\" y=\"57\" text-anchor=\"end\" font-family=\"Georgia\" font-size=\"9\" fill=\"#706659\">30-50× in one gen</text>\n  <text x=\"420\" y=\"90\" font-family=\"Georgia\" font-size=\"10\" fill=\"#2f7a3e\" font-style=\"italic\">+ co-design across all layers</text>\n  <g font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">\n    <text x=\"70\" y=\"216\">2005</text><text x=\"200\" y=\"216\">2012</text><text x=\"340\" y=\"216\">2018</text><text x=\"480\" y=\"216\">2024</text><text x=\"610\" y=\"216\">2030</text>\n  </g>\n  <text x=\"350\" y=\"62\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-style=\"italic\" fill=\"#706659\">Jensen's bet: if scaling is dead, win by re-architecting every year</text>\n</svg>", "section_id": "silicon", "section_num": "01", "section_title": "Silicon & Process Nodes", "section_color": "amber", "timestamp_sec": 1320, "timestamp_fmt": "22:00", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1320s"}, {"name": "ASIC", "expansion": "(Application-Specific Integrated Circuit)", "plain": "Chip hard-wired for one specific workload. Better at that workload than any general chip. Useless for anything else. Changing workloads = new silicon = 2-3 year cycle. TPU, Trainium, AWS Inferentia, Tesla's old Dojo D1, Groq's LPU — all ASICs.", "analogy": "A wood-chipper is an ASIC — unbelievable at chipping wood, terrible at anything else. A GPU is more like a heavy-duty kitchen blender — pesto, smoothies, soup, ice cream. Neither chips wood as well, but the blender is useful 50 weeks a year.", "why_matters": "Jensen's claim hinges on pace of change. If your algorithm is stable 3+ years, ASIC wins. If it changes annually (MoE, hybrid SSMs, new attention), the ASIC you designed in 2023 is obsolete by the time it ships in 2026.", "context": "Jensen: 'Look at the number of ASICs that have been cancelled. You still have to build something better than Nvidia.'", "subvis": "\n<svg viewBox=\"0 0 680 230\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"20\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">ASIC vs GPU: specialization trade-off</text>\n  <rect x=\"30\" y=\"40\" width=\"300\" height=\"170\" rx=\"4\" fill=\"#fffdf8\" stroke=\"#2a5f8f\" stroke-width=\"1.5\"/>\n  <text x=\"180\" y=\"64\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\" fill=\"#2a5f8f\" letter-spacing=\"2\">ASIC (TPU, Trainium, LPU)</text>\n  <line x1=\"50\" y1=\"74\" x2=\"310\" y2=\"74\" stroke=\"#d9cfc0\"/>\n  <text x=\"50\" y=\"96\" font-family=\"Georgia\" font-size=\"12\">✓ 2-3× perf/watt at target workload</text>\n  <text x=\"50\" y=\"116\" font-family=\"Georgia\" font-size=\"12\">✓ More die → raw matmul compute</text>\n  <text x=\"50\" y=\"136\" font-family=\"Georgia\" font-size=\"12\">✓ Deterministic timing (LPU)</text>\n  <text x=\"50\" y=\"162\" font-family=\"Georgia\" font-size=\"12\" fill=\"#a8321f\">✗ Rigid: new algo = re-silicon</text>\n  <text x=\"50\" y=\"182\" font-family=\"Georgia\" font-size=\"12\" fill=\"#a8321f\">✗ 2-3 yr design → launch lag</text>\n  <text x=\"50\" y=\"202\" font-family=\"Georgia\" font-size=\"12\" fill=\"#a8321f\">✗ ~1 operator, ~0 dev ecosystem</text>\n  <rect x=\"350\" y=\"40\" width=\"300\" height=\"170\" rx=\"4\" fill=\"#fffdf8\" stroke=\"#76b900\" stroke-width=\"1.5\"/>\n  <text x=\"500\" y=\"64\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\" fill=\"#76b900\" letter-spacing=\"2\">GPU + CUDA (Nvidia)</text>\n  <line x1=\"370\" y1=\"74\" x2=\"630\" y2=\"74\" stroke=\"#d9cfc0\"/>\n  <text x=\"370\" y=\"96\" font-family=\"Georgia\" font-size=\"12\">✓ Any parallel algorithm runs</text>\n  <text x=\"370\" y=\"116\" font-family=\"Georgia\" font-size=\"12\">✓ New algo → new kernel, same week</text>\n  <text x=\"370\" y=\"136\" font-family=\"Georgia\" font-size=\"12\">✓ 200M+ device install base</text>\n  <text x=\"370\" y=\"156\" font-family=\"Georgia\" font-size=\"12\">✓ Co-design chip ↔ rack ↔ net</text>\n  <text x=\"370\" y=\"182\" font-family=\"Georgia\" font-size=\"12\" fill=\"#b8651a\">△ Premium priced (50-80% GM)</text>\n  <text x=\"370\" y=\"202\" font-family=\"Georgia\" font-size=\"12\" fill=\"#b8651a\">△ Cancelled-ASIC \"graveyard\" exists</text>\n</svg>", "section_id": "silicon", "section_num": "01", "section_title": "Silicon & Process Nodes", "section_color": "amber", "timestamp_sec": 1054, "timestamp_fmt": "17:34", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1054s"}, {"name": "GPU", "expansion": "(Graphics Processing Unit)", "plain": "Massively parallel processor — ~16,000-20,000 small cores per chip vs a CPU's 8-64 big ones. Designed for graphics rendering (which is embarrassingly parallel). Turned out AI training is also embarrassingly parallel, so the chip built for Doom ended up perfect for ChatGPT.", "analogy": "A CPU is a Formula 1 car — one driver, unbelievable top speed, handles the whole road. A GPU is 10,000 delivery scooters — each slow, but can cover a city in an hour. AI training is a 10,000-address delivery run.", "why_matters": "The GPU's accidental fit for AI is the deepest bit of luck in modern tech history. A company founded to make video-game cards accidentally built the computing substrate of the AI era.", "context": "Jensen: 'What Nvidia built is accelerated computing, not a tensor processing unit.'", "subvis": null, "section_id": "silicon", "section_num": "01", "section_title": "Silicon & Process Nodes", "section_color": "amber", "timestamp_sec": 1227, "timestamp_fmt": "20:27", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1227s"}, {"name": "TPU", "expansion": "(Tensor Processing Unit)", "plain": "Google's custom AI ASIC, in-house since 2015. Built around a systolic array for matrix multiplication. Seven generations deployed. Used to train Gemini and (via the AWS-Anthropic deal) Claude. Not sold externally — Google's competitive moat.", "analogy": "A TPU is a championship pasta machine — unbeatable at its one dish. Great if your menu is pasta. A problem if next year's hit dish is ramen.", "why_matters": "Dwarkesh's opening TPU challenge is rhetorically strong because two of the world's top 3 models were trained on them. Jensen's reframe: that's one customer (Google + Anthropic-via-Google), not a trend.", "context": "Dwarkesh: 'Two of the top three models in the world, Claude and Gemini, were trained on TPU.' Jensen reframes Anthropic as 'a unique instance, not a trend.'", "subvis": null, "section_id": "silicon", "section_num": "01", "section_title": "Silicon & Process Nodes", "section_color": "amber", "timestamp_sec": 980, "timestamp_fmt": "16:20", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=980s"}, {"name": "Systolic array", "expansion": "", "plain": "Grid of simple multiply-and-accumulate cells arranged so data pulses through neighbor-to-neighbor in lockstep ('systole' = contraction). Invented by H.T. Kung, 1978. Each cell: receive A from left, B from above, multiply-add to running sum, pass A right and B down. Zero memory fetches during compute.", "analogy": "A bucket brigade at a fire — each person passes the bucket to the next. Fast, efficient, nobody has to run back to the water source. But useless if the task isn't 'pass a bucket in a straight line.'", "why_matters": "Exactly why TPUs beat GPUs at pure matmul (matmul IS what a systolic array does natively) and lose everywhere else (anything that isn't matmul doesn't fit the rigid grid).", "context": "Dwarkesh: 'A TPU is this big systolic array perfect for matrix multiplies, whereas a GPU is very flexible.'", "subvis": "\n<svg viewBox=\"0 0 700 240\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"350\" y=\"20\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Systolic array: data pulses through the grid</text>\n  <g font-family=\"monospace\" font-size=\"10\">\n    <g transform=\"translate(120,55)\">\n      <text x=\"-50\" y=\"28\" fill=\"#2a5f8f\" font-weight=\"700\" font-size=\"12\">A[0]→</text>\n      <text x=\"-50\" y=\"68\" fill=\"#2a5f8f\" font-weight=\"700\" font-size=\"12\">A[1]→</text>\n      <text x=\"-50\" y=\"108\" fill=\"#2a5f8f\" font-weight=\"700\" font-size=\"12\">A[2]→</text>\n      <text x=\"-50\" y=\"148\" fill=\"#2a5f8f\" font-weight=\"700\" font-size=\"12\">A[3]→</text>\n      <text x=\"25\" y=\"-12\" text-anchor=\"middle\" fill=\"#2f7a3e\" font-weight=\"700\" font-size=\"12\">B[0]↓</text>\n      <text x=\"75\" y=\"-12\" text-anchor=\"middle\" fill=\"#2f7a3e\" font-weight=\"700\" font-size=\"12\">B[1]↓</text>\n      <text x=\"125\" y=\"-12\" text-anchor=\"middle\" fill=\"#2f7a3e\" font-weight=\"700\" font-size=\"12\">B[2]↓</text>\n      <text x=\"175\" y=\"-12\" text-anchor=\"middle\" fill=\"#2f7a3e\" font-weight=\"700\" font-size=\"12\">B[3]↓</text>\n      <g stroke=\"#b8651a\" fill=\"#fef3d8\">\n        <rect x=\"0\" y=\"10\" width=\"36\" height=\"36\"/><rect x=\"50\" y=\"10\" width=\"36\" height=\"36\"/><rect x=\"100\" y=\"10\" width=\"36\" height=\"36\"/><rect x=\"150\" y=\"10\" width=\"36\" height=\"36\"/>\n        <rect x=\"0\" y=\"50\" width=\"36\" height=\"36\"/><rect x=\"50\" y=\"50\" width=\"36\" height=\"36\"/><rect x=\"100\" y=\"50\" width=\"36\" height=\"36\"/><rect x=\"150\" y=\"50\" width=\"36\" height=\"36\"/>\n        <rect x=\"0\" y=\"90\" width=\"36\" height=\"36\"/><rect x=\"50\" y=\"90\" width=\"36\" height=\"36\"/><rect x=\"100\" y=\"90\" width=\"36\" height=\"36\"/><rect x=\"150\" y=\"90\" width=\"36\" height=\"36\"/>\n        <rect x=\"0\" y=\"130\" width=\"36\" height=\"36\"/><rect x=\"50\" y=\"130\" width=\"36\" height=\"36\"/><rect x=\"100\" y=\"130\" width=\"36\" height=\"36\"/><rect x=\"150\" y=\"130\" width=\"36\" height=\"36\"/>\n      </g>\n      <g font-family=\"monospace\" font-size=\"8\" fill=\"#706659\">\n        <text x=\"18\" y=\"33\" text-anchor=\"middle\">×+</text><text x=\"68\" y=\"33\" text-anchor=\"middle\">×+</text><text x=\"118\" y=\"33\" text-anchor=\"middle\">×+</text><text x=\"168\" y=\"33\" text-anchor=\"middle\">×+</text>\n        <text x=\"18\" y=\"73\" text-anchor=\"middle\">×+</text><text x=\"68\" y=\"73\" text-anchor=\"middle\">×+</text><text x=\"118\" y=\"73\" text-anchor=\"middle\">×+</text><text x=\"168\" y=\"73\" text-anchor=\"middle\">×+</text>\n        <text x=\"18\" y=\"113\" text-anchor=\"middle\">×+</text><text x=\"68\" y=\"113\" text-anchor=\"middle\">×+</text><text x=\"118\" y=\"113\" text-anchor=\"middle\">×+</text><text x=\"168\" y=\"113\" text-anchor=\"middle\">×+</text>\n        <text x=\"18\" y=\"153\" text-anchor=\"middle\">×+</text><text x=\"68\" y=\"153\" text-anchor=\"middle\">×+</text><text x=\"118\" y=\"153\" text-anchor=\"middle\">×+</text><text x=\"168\" y=\"153\" text-anchor=\"middle\">×+</text>\n      </g>\n      <g stroke=\"#2a5f8f\" stroke-width=\"1\" marker-end=\"url(#sa-arr)\">\n        <line x1=\"36\" y1=\"28\" x2=\"50\" y2=\"28\"/><line x1=\"86\" y1=\"28\" x2=\"100\" y2=\"28\"/><line x1=\"136\" y1=\"28\" x2=\"150\" y2=\"28\"/>\n      </g>\n    </g>\n    <text x=\"380\" y=\"68\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\">Each cell:</text>\n    <text x=\"380\" y=\"86\" font-family=\"Georgia\" font-size=\"11\" fill=\"#706659\">1. Receive A from left</text>\n    <text x=\"380\" y=\"104\" font-family=\"Georgia\" font-size=\"11\" fill=\"#706659\">2. Receive B from above</text>\n    <text x=\"380\" y=\"122\" font-family=\"Georgia\" font-size=\"11\" fill=\"#706659\">3. Multiply, add to running sum</text>\n    <text x=\"380\" y=\"140\" font-family=\"Georgia\" font-size=\"11\" fill=\"#706659\">4. Pass A right, B down</text>\n    <text x=\"380\" y=\"166\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\" fill=\"#2f7a3e\">Result: C = A × B matmul</text>\n    <text x=\"380\" y=\"184\" font-family=\"Georgia\" font-size=\"10\" fill=\"#706659\" font-style=\"italic\">Zero memory fetches during compute.</text>\n    <text x=\"380\" y=\"198\" font-family=\"Georgia\" font-size=\"10\" fill=\"#706659\" font-style=\"italic\">Data moves neighbor-to-neighbor only.</text>\n    <text x=\"380\" y=\"220\" font-family=\"Georgia\" font-size=\"10\" fill=\"#a8321f\" font-style=\"italic\">→ Great for matmul. Useless for anything else.</text>\n  </g>\n</svg>", "section_id": "silicon", "section_num": "01", "section_title": "Silicon & Process Nodes", "section_color": "amber", "timestamp_sec": 1222, "timestamp_fmt": "20:22", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1222s"}, {"name": "CoWoS", "expansion": "(Chip-on-Wafer-on-Substrate)", "plain": "TSMC's advanced packaging method. Logic die and HBM stacks sit side-by-side on a silicon interposer — a thin slab with thousands of micro-wires etched into silicon. Signals travel millimeters instead of centimeters, giving ~1000× the bandwidth of a regular motherboard.", "analogy": "A motherboard is a city's road network — wide, slow, lots of traffic lights. CoWoS is moving every business inside the same building with internal hallways. Everything moves faster because it doesn't have to leave the building.", "why_matters": "For two years (2023-2024), CoWoS was the single tightest bottleneck in the global AI supply chain. Nvidia/TSMC response: 'we doubled, doubled, doubled.' This is the literal shape of Jensen's supply-chain-flywheel argument.", "context": "Jensen: 'CoWoS and HBM were specialty. They're not anymore. We doubled, doubled, doubled on several doubles.'", "subvis": "\n<svg viewBox=\"0 0 680 260\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">CoWoS: why all Blackwell GPUs look like this</text>\n  <rect x=\"40\" y=\"200\" width=\"600\" height=\"30\" fill=\"#d4c190\" stroke=\"#1a1613\" stroke-width=\"1\"/>\n  <text x=\"340\" y=\"220\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" fill=\"#706659\">package substrate (ordinary PCB)</text>\n  <rect x=\"80\" y=\"165\" width=\"520\" height=\"35\" fill=\"#b89a68\" stroke=\"#1a1613\" stroke-width=\"1\"/>\n  <text x=\"340\" y=\"188\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\">SILICON INTERPOSER — thousands of micro-wires etched into silicon</text>\n  <g transform=\"translate(100,75)\">\n    <rect x=\"0\" y=\"0\" width=\"90\" height=\"12\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"0\" y=\"13\" width=\"90\" height=\"12\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"0\" y=\"26\" width=\"90\" height=\"12\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"0\" y=\"39\" width=\"90\" height=\"12\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"0\" y=\"52\" width=\"90\" height=\"12\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"0\" y=\"65\" width=\"90\" height=\"12\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"0\" y=\"78\" width=\"90\" height=\"12\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"0\" y=\"91\" width=\"90\" height=\"15\" fill=\"#6b4a9e\"/>\n    <text x=\"45\" y=\"103\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"8\" fill=\"#fff\">base</text>\n    <text x=\"45\" y=\"-10\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" font-weight=\"700\" fill=\"#6b4a9e\">HBM stack</text>\n  </g>\n  <g transform=\"translate(490,75)\">\n    <rect x=\"0\" y=\"0\" width=\"90\" height=\"12\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"0\" y=\"13\" width=\"90\" height=\"12\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"0\" y=\"26\" width=\"90\" height=\"12\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"0\" y=\"39\" width=\"90\" height=\"12\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"0\" y=\"52\" width=\"90\" height=\"12\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"0\" y=\"65\" width=\"90\" height=\"12\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"0\" y=\"78\" width=\"90\" height=\"12\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"0\" y=\"91\" width=\"90\" height=\"15\" fill=\"#6b4a9e\"/>\n    <text x=\"45\" y=\"103\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"8\" fill=\"#fff\">base</text>\n    <text x=\"45\" y=\"-10\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" font-weight=\"700\" fill=\"#6b4a9e\">HBM stack</text>\n  </g>\n  <rect x=\"230\" y=\"85\" width=\"220\" height=\"80\" fill=\"#fef3d8\" stroke=\"#b8651a\" stroke-width=\"1.5\"/>\n  <text x=\"340\" y=\"112\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">GPU LOGIC DIE</text>\n  <text x=\"340\" y=\"130\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">(208B transistors)</text>\n  <text x=\"340\" y=\"148\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">TSMC N4P custom</text>\n  <text x=\"340\" y=\"48\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-style=\"italic\" fill=\"#706659\">Side-by-side on silicon → signals travel mm, not cm → 1,000× the bandwidth of regular PCB</text>\n</svg>", "section_id": "package", "section_num": "02", "section_title": "Packaging & Memory", "section_color": "rose", "timestamp_sec": 615, "timestamp_fmt": "10:15", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=615s"}, {"name": "COUPE", "expansion": "(Compact Universal Photonic Engine)", "plain": "TSMC's co-packaged optics tech — putting optical transceivers right next to compute die instead of at the server edge. Cuts the power needed to push data across a rack.", "analogy": null, "why_matters": "Nvidia quietly preparing for power-walled futures. Light is cheaper to move than electricity over distance.", "context": "Jensen: 'We partnered on COUPE and licensed those patents to the supply chain to keep it nice and open.'", "subvis": null, "section_id": "package", "section_num": "02", "section_title": "Packaging & Memory", "section_color": "rose", "timestamp_sec": 743, "timestamp_fmt": "12:23", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=743s"}, {"name": "HBM", "expansion": "(High Bandwidth Memory)", "plain": "DRAM dies stacked vertically (8-12 high), connected to processor through ~1,024 wires in parallel — Through-Silicon Vias or TSVs. Blackwell has 8 stacks = 8+ TB/s memory bandwidth. Only three companies make it: SK Hynix, Micron, Samsung.", "analogy": "Regular DDR5 memory is a two-lane country road. HBM is a 1,024-lane highway stacked 12 bridges high. Same silicon, completely different geometry.", "why_matters": "HBM bandwidth — not compute — is the actual bottleneck for most LLM workloads. Why export restrictions on HBM are as strategically important as those on the GPUs themselves.", "context": "Jensen credits Micron's Sanjay for early HBM belief: 'They really doubled down on it.'", "subvis": "\n<svg viewBox=\"0 0 680 240\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Why HBM exists: match GPU's appetite</text>\n  <text x=\"120\" y=\"52\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\">Regular DDR5</text>\n  <rect x=\"40\" y=\"62\" width=\"160\" height=\"45\" fill=\"#d4c190\" stroke=\"#1a1613\"/>\n  <text x=\"120\" y=\"88\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" fill=\"#fff\">DRAM module</text>\n  <rect x=\"40\" y=\"112\" width=\"160\" height=\"18\" fill=\"#b89a68\" stroke=\"#1a1613\"/>\n  <text x=\"120\" y=\"126\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"8\" fill=\"#fff\">PCB (long traces)</text>\n  <g font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">\n    <text x=\"120\" y=\"148\" text-anchor=\"middle\">~64 wires, cm-long</text>\n    <text x=\"120\" y=\"162\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#1a1613\">~50 GB/s</text>\n    <text x=\"120\" y=\"176\" text-anchor=\"middle\">per module</text>\n    <text x=\"120\" y=\"198\" text-anchor=\"middle\">CPU-era memory</text>\n  </g>\n  <line x1=\"320\" y1=\"40\" x2=\"320\" y2=\"210\" stroke=\"#d9cfc0\" stroke-dasharray=\"3,3\"/>\n  <text x=\"520\" y=\"52\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\">HBM3e (stacked)</text>\n  <g>\n    <rect x=\"460\" y=\"62\" width=\"120\" height=\"6\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"460\" y=\"68\" width=\"120\" height=\"6\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"460\" y=\"74\" width=\"120\" height=\"6\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"460\" y=\"80\" width=\"120\" height=\"6\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"460\" y=\"86\" width=\"120\" height=\"6\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"460\" y=\"92\" width=\"120\" height=\"6\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"460\" y=\"98\" width=\"120\" height=\"6\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n    <rect x=\"460\" y=\"104\" width=\"120\" height=\"6\" fill=\"#efe6f2\" stroke=\"#6b4a9e\"/>\n  </g>\n  <rect x=\"460\" y=\"112\" width=\"120\" height=\"14\" fill=\"#6b4a9e\"/>\n  <text x=\"520\" y=\"122\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"8\" fill=\"#fff\">base die (PHY)</text>\n  <g font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">\n    <text x=\"520\" y=\"148\" text-anchor=\"middle\">~1,024 wires (TSVs)</text>\n    <text x=\"520\" y=\"162\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#1a1613\">~1,000 GB/s per stack</text>\n    <text x=\"520\" y=\"176\" text-anchor=\"middle\">× 8 stacks = 8 TB/s total</text>\n    <text x=\"520\" y=\"198\" text-anchor=\"middle\">GPU-era memory</text>\n  </g>\n  <text x=\"340\" y=\"225\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-style=\"italic\" fill=\"#706659\">Same silicon, rethought as a vertical stack with massive parallel wiring</text>\n</svg>", "section_id": "package", "section_num": "02", "section_title": "Packaging & Memory", "section_color": "rose", "timestamp_sec": 14, "timestamp_fmt": "0:14", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=14s"}, {"name": "HBM2", "expansion": "", "plain": "Second-generation HBM from 2016. ~256 GB/s per stack — about 1/4 of HBM3e's 1,000+ GB/s. Chinese chipmakers (CXMT) can produce HBM2 but not newer generations because HBM base dies require EUV, which China can't import.", "analogy": null, "why_matters": "Dwarkesh's China argument: 'there could be almost an order of magnitude difference in memory bandwidth.' Jensen's counter: you can gang-wire older HBM to compensate. Both are correct — the disagreement is quantitative, not binary.", "context": "Dwarkesh: 'there could be almost an order of magnitude difference in memory bandwidth.' Jensen: 'Not true. You could gang them together.'", "subvis": null, "section_id": "package", "section_num": "02", "section_title": "Packaging & Memory", "section_color": "rose", "timestamp_sec": 4122, "timestamp_fmt": "1:08:42", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=4122s"}, {"name": "DRAM", "expansion": "(Dynamic Random-Access Memory)", "plain": "Main working memory in every computer. 'Dynamic' because each bit is stored as electrical charge on a tiny capacitor that leaks away within milliseconds — the chip must refresh every cell thousands of times per second just to retain data. Commodity product. HBM is specialized DRAM; LPDDR is low-power DRAM.", "analogy": "A bucket brigade where every bucket has a tiny hole. Water keeps running out, and thousands of workers constantly top up every bucket. Enormous overhead, but fast and dense — the deal most computers make.", "why_matters": null, "context": "Jensen uses DRAM in his export-control analogy: we ship DRAM/CPUs to China as dual-use products.", "subvis": null, "section_id": "package", "section_num": "02", "section_title": "Packaging & Memory", "section_color": "rose", "timestamp_sec": 4951, "timestamp_fmt": "1:22:31", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=4951s"}, {"name": "LPDDR", "expansion": "(Low-Power DDR)", "plain": "DRAM optimized for energy: lower voltage (~0.5V vs DDR5's ~1.1V), soldered directly to package instead of socketed. Born in smartphones. Nvidia's Grace CPU uses LPDDR — phone memory in a datacenter.", "analogy": null, "why_matters": "In a 1 GW datacenter, memory power is ~20% of total. Cutting that by 3× via LPDDR frees ~100 MW — room for thousands more GPUs under the same utility cap. Illustrates how every watt matters at scale.", "context": "Jensen: 'We partnered with Micron across LPDDR and HBM memories, and they really invested in it.'", "subvis": "\n<svg viewBox=\"0 0 660 180\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"330\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">LPDDR vs DDR in AI servers — the Grace CPU choice</text>\n  <g font-family=\"monospace\" font-size=\"10\">\n    <g transform=\"translate(40,50)\">\n      <rect x=\"0\" y=\"0\" width=\"260\" height=\"100\" fill=\"#fef3d8\" stroke=\"#b8651a\" stroke-width=\"1.5\"/>\n      <text x=\"130\" y=\"22\" text-anchor=\"middle\" font-weight=\"700\">DDR5 (normal server)</text>\n      <text x=\"20\" y=\"44\" fill=\"#706659\">power: ~1.1V</text>\n      <text x=\"20\" y=\"60\" fill=\"#706659\">watts/GB: ~0.3 W</text>\n      <text x=\"20\" y=\"76\" fill=\"#706659\">socketed modules</text>\n      <text x=\"20\" y=\"92\" fill=\"#1a1613\" font-weight=\"700\">the default since 1990s</text>\n    </g>\n    <g transform=\"translate(360,50)\">\n      <rect x=\"0\" y=\"0\" width=\"260\" height=\"100\" fill=\"#e8f2e0\" stroke=\"#2f7a3e\" stroke-width=\"1.5\"/>\n      <text x=\"130\" y=\"22\" text-anchor=\"middle\" font-weight=\"700\">LPDDR (Grace CPU)</text>\n      <text x=\"20\" y=\"44\" fill=\"#706659\">power: ~0.5V</text>\n      <text x=\"20\" y=\"60\" fill=\"#706659\">watts/GB: ~0.1 W</text>\n      <text x=\"20\" y=\"76\" fill=\"#706659\">soldered on package</text>\n      <text x=\"20\" y=\"92\" fill=\"#1a1613\" font-weight=\"700\">phone memory in a DC</text>\n    </g>\n  </g>\n  <text x=\"330\" y=\"170\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" font-style=\"italic\" fill=\"#706659\">3× lower memory power = more room for compute under the same rack watt-cap</text>\n</svg>", "section_id": "package", "section_num": "02", "section_title": "Packaging & Memory", "section_color": "rose", "timestamp_sec": 698, "timestamp_fmt": "11:38", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=698s"}, {"name": "Silicon photonics", "expansion": "", "plain": "Integrated circuits that use light (photons) instead of electricity (electrons) to move data. At distances past ~5cm, light is ~10× cheaper per bit than copper. The only known way to wire up million-GPU AI factories without drowning in heat.", "analogy": "Copper is an extension cord — fine for a lamp, useless for powering a whole building. Light is fiber-optic internet — quiet, cool, handles any distance for the same energy cost.", "why_matters": "The whole hyperscale AI thesis past ~2027 rests on photonics working. Without it, interconnect power eats the budget that should go to compute.", "context": "Jensen: 'Investments with Lumentum, Coherent, and silicon photonics reshaped the supply chain.'", "subvis": "\n<svg viewBox=\"0 0 680 210\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Moving data: copper vs light, energy per bit</text>\n  <g transform=\"translate(40,50)\">\n    <rect x=\"0\" y=\"10\" width=\"56\" height=\"36\" fill=\"#fef3d8\" stroke=\"#b8651a\"/>\n    <text x=\"28\" y=\"32\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\">GPU</text>\n    <g stroke=\"#a8321f\" stroke-width=\"2.5\"><line x1=\"58\" y1=\"18\" x2=\"248\" y2=\"18\"/><line x1=\"58\" y1=\"28\" x2=\"248\" y2=\"28\"/><line x1=\"58\" y1=\"38\" x2=\"248\" y2=\"38\"/></g>\n    <rect x=\"250\" y=\"10\" width=\"56\" height=\"36\" fill=\"#fef3d8\" stroke=\"#b8651a\"/>\n    <text x=\"278\" y=\"32\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\">GPU</text>\n    <text x=\"155\" y=\"72\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\" fill=\"#a8321f\">Copper</text>\n    <text x=\"155\" y=\"87\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">thick, hot, breaks over distance</text>\n    <text x=\"155\" y=\"102\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" font-weight=\"700\">~10 pJ/bit</text>\n  </g>\n  <g transform=\"translate(40,135)\">\n    <rect x=\"0\" y=\"10\" width=\"56\" height=\"36\" fill=\"#e8f2e0\" stroke=\"#2f7a3e\"/>\n    <text x=\"28\" y=\"32\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\">GPU</text>\n    <line x1=\"58\" y1=\"28\" x2=\"248\" y2=\"28\" stroke=\"#2f7a3e\" stroke-width=\"1.2\" stroke-dasharray=\"1,1\"/>\n    <circle cx=\"155\" cy=\"28\" r=\"3\" fill=\"#76b900\"/>\n    <rect x=\"250\" y=\"10\" width=\"56\" height=\"36\" fill=\"#e8f2e0\" stroke=\"#2f7a3e\"/>\n    <text x=\"278\" y=\"32\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\">GPU</text>\n  </g>\n  <g transform=\"translate(380,55)\">\n    <text x=\"0\" y=\"0\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\">Why it matters at gigawatt scale:</text>\n    <text x=\"0\" y=\"24\" font-family=\"Georgia\" font-size=\"11\" fill=\"#706659\">A 1 GW AI factory has ~1M GPU-to-GPU links.</text>\n    <text x=\"0\" y=\"42\" font-family=\"Georgia\" font-size=\"11\" fill=\"#706659\">Copper burns tens of MW just moving bits.</text>\n    <text x=\"0\" y=\"66\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\" fill=\"#2f7a3e\">Light is 10× cheaper per bit at meter scale.</text>\n    <text x=\"0\" y=\"86\" font-family=\"Georgia\" font-size=\"11\" fill=\"#706659\">At rack scale, that's ~100 MW saved =</text>\n    <text x=\"0\" y=\"100\" font-family=\"Georgia\" font-size=\"11\" fill=\"#706659\">10% more GPUs inside the same power cap.</text>\n    <text x=\"0\" y=\"130\" font-family=\"Georgia\" font-size=\"10\" fill=\"#b8651a\" font-style=\"italic\">Jensen's power-constrained world needs this.</text>\n  </g>\n  <text x=\"195\" y=\"195\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\" fill=\"#2f7a3e\">Light</text>\n  <text x=\"195\" y=\"200\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\" text-anchor=\"middle\" y=\"210\">thin fiber, cool, any distance   ~1 pJ/bit</text>\n</svg>", "section_id": "package", "section_num": "02", "section_title": "Packaging & Memory", "section_color": "rose", "timestamp_sec": 733, "timestamp_fmt": "12:13", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=733s"}, {"name": "Memory bandwidth", "expansion": "", "plain": "Rate at which data moves from memory into compute — measured in TB/s. Modern LLMs spend most of their time waiting for weights to arrive from memory, not doing math. Flops rise faster than bandwidth every generation, making the gap wider.", "analogy": "A Ferrari engine with a coffee-straw fuel line. Doesn't matter how powerful the engine is — it only goes as fast as the fuel arrives.", "why_matters": "Why the HBM-making cartel (SK Hynix, Micron, Samsung) is as strategically important as TSMC. Why export controls on HBM matter almost as much as those on the GPU itself.", "context": "Dwarkesh's China argument hinges on this; Jensen counters with networking.", "subvis": null, "section_id": "package", "section_num": "02", "section_title": "Packaging & Memory", "section_color": "rose", "timestamp_sec": 4131, "timestamp_fmt": "1:08:51", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=4131s"}, {"name": "Double-sided probing", "expansion": "", "plain": "Chip-testing equipment that electrically contacts a die from both sides at once. Required to test advanced 3D-stacked packages where top and bottom both carry signals. If you can't test it, you can't ship it.", "analogy": null, "why_matters": "Example of Nvidia seeding the supply chain. Investing in test equipment is something only the eventual buyer-of-volume can justify. Reveals how far upstream Nvidia's capex reach extends.", "context": "Jensen's example of Nvidia's supply-chain prep: 'new testing equipment like double-sided probing, investing in companies, scaling up capacity.'", "subvis": null, "section_id": "package", "section_num": "02", "section_title": "Packaging & Memory", "section_color": "rose", "timestamp_sec": 762, "timestamp_fmt": "12:42", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=762s"}, {"name": "ODM", "expansion": "(Original Design Manufacturer)", "plain": "Mostly-Taiwanese companies — Foxconn, Wistron, Quanta, Inventec — that physically build servers and racks to Nvidia's reference designs, then sell them branded as Dell, HPE, or directly to hyperscalers.", "analogy": null, "why_matters": "The ODM layer is why Nvidia can ship a new rack architecture globally within weeks of launch. No competitor has this kind of manufacturing depth wired into their design process.", "context": "Dwarkesh's opening frame: 'then it sends it to an ODM in Taiwan where they assemble the racks.'", "subvis": null, "section_id": "package", "section_num": "02", "section_title": "Packaging & Memory", "section_color": "rose", "timestamp_sec": 19, "timestamp_fmt": "0:19", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=19s"}, {"name": "NVLink", "expansion": "", "plain": "Nvidia's proprietary GPU-to-GPU interconnect. 1.8 TB/s per GPU in Blackwell — about 14× faster than standard PCIe 5. Every GPU can read every other GPU's memory as if it were local. No other chip maker has anything comparable at rack scale.", "analogy": "PCIe is yelling across a cubicle farm — you can communicate, but it's slow. NVLink is direct thought-to-thought telepathy between every GPU in a room.", "why_matters": "When Jensen calls Nvidia a 'co-design' company, NVLink is Exhibit A. You can't build it without simultaneously designing the chip, the rack, the power delivery, and the software to take advantage of it.", "context": "Jensen: 'if we didn't build NVLink the way we built it, nobody else would have done it.'", "subvis": "\n<svg viewBox=\"0 0 680 260\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"20\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">NVLink: every GPU can read every other GPU's memory</text>\n  <circle cx=\"340\" cy=\"140\" r=\"20\" fill=\"#76b900\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <text x=\"340\" y=\"145\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" font-weight=\"700\" fill=\"#fff\">GPU</text>\n  <g font-family=\"monospace\" font-size=\"9\" font-weight=\"700\" fill=\"#fff\">\n    <circle cx=\"490\" cy=\"140\" r=\"18\" fill=\"#76b900\" stroke=\"#1a1613\"/><text x=\"490\" y=\"145\" text-anchor=\"middle\">GPU</text>\n    <circle cx=\"450\" cy=\"55\" r=\"18\" fill=\"#76b900\" stroke=\"#1a1613\"/><text x=\"450\" y=\"60\" text-anchor=\"middle\">GPU</text>\n    <circle cx=\"230\" cy=\"55\" r=\"18\" fill=\"#76b900\" stroke=\"#1a1613\"/><text x=\"230\" y=\"60\" text-anchor=\"middle\">GPU</text>\n    <circle cx=\"190\" cy=\"140\" r=\"18\" fill=\"#76b900\" stroke=\"#1a1613\"/><text x=\"190\" y=\"145\" text-anchor=\"middle\">GPU</text>\n    <circle cx=\"230\" cy=\"225\" r=\"18\" fill=\"#76b900\" stroke=\"#1a1613\"/><text x=\"230\" y=\"230\" text-anchor=\"middle\">GPU</text>\n    <circle cx=\"450\" cy=\"225\" r=\"18\" fill=\"#76b900\" stroke=\"#1a1613\"/><text x=\"450\" y=\"230\" text-anchor=\"middle\">GPU</text>\n  </g>\n  <g stroke=\"#76b900\" stroke-width=\"1\" opacity=\"0.6\">\n    <line x1=\"340\" y1=\"140\" x2=\"490\" y2=\"140\"/><line x1=\"340\" y1=\"140\" x2=\"450\" y2=\"55\"/><line x1=\"340\" y1=\"140\" x2=\"230\" y2=\"55\"/><line x1=\"340\" y1=\"140\" x2=\"190\" y2=\"140\"/><line x1=\"340\" y1=\"140\" x2=\"230\" y2=\"225\"/><line x1=\"340\" y1=\"140\" x2=\"450\" y2=\"225\"/>\n    <line x1=\"490\" y1=\"140\" x2=\"450\" y2=\"55\"/><line x1=\"490\" y1=\"140\" x2=\"450\" y2=\"225\"/><line x1=\"450\" y1=\"55\" x2=\"230\" y2=\"55\"/><line x1=\"230\" y1=\"55\" x2=\"190\" y2=\"140\"/><line x1=\"190\" y1=\"140\" x2=\"230\" y2=\"225\"/><line x1=\"230\" y1=\"225\" x2=\"450\" y2=\"225\"/>\n    <line x1=\"450\" y1=\"55\" x2=\"190\" y2=\"140\"/><line x1=\"450\" y1=\"55\" x2=\"230\" y2=\"225\"/><line x1=\"450\" y1=\"55\" x2=\"450\" y2=\"225\"/><line x1=\"230\" y1=\"55\" x2=\"450\" y2=\"225\"/><line x1=\"230\" y1=\"55\" x2=\"230\" y2=\"225\"/>\n    <line x1=\"190\" y1=\"140\" x2=\"450\" y2=\"225\"/><line x1=\"190\" y1=\"140\" x2=\"450\" y2=\"55\"/><line x1=\"490\" y1=\"140\" x2=\"230\" y2=\"55\"/><line x1=\"490\" y1=\"140\" x2=\"230\" y2=\"225\"/>\n  </g>\n  <text x=\"110\" y=\"100\" font-family=\"monospace\" font-size=\"10\" font-weight=\"700\" fill=\"#2a5f8f\">1.8 TB/s</text>\n  <text x=\"110\" y=\"114\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">per GPU</text>\n  <text x=\"110\" y=\"128\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">(Blackwell gen)</text>\n  <text x=\"560\" y=\"100\" font-family=\"monospace\" font-size=\"10\" font-weight=\"700\" fill=\"#2a5f8f\">vs PCIe 5:</text>\n  <text x=\"560\" y=\"114\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">128 GB/s</text>\n  <text x=\"560\" y=\"128\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">(~14× faster)</text>\n</svg>", "section_id": "network", "section_num": "03", "section_title": "Networking & Systems", "section_color": "teal", "timestamp_sec": 1408, "timestamp_fmt": "23:28", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1408s"}, {"name": "NVL72", "expansion": "", "plain": "Nvidia's rack-scale system: 72 Blackwell GPUs + 36 Grace CPUs, wired together by 9 NVLink switches into what is logically one giant GPU with 130 TB/s of aggregated memory bandwidth. Liquid-cooled, ~120 kW, about $3M per rack. The unit of sale for frontier AI is now the rack, not the chip.", "analogy": "NVL72 is a datacenter version of Apple's iPhone — a fully integrated product that ships as a complete system, every component designed against every other. Compare to earlier servers where you bought chips and figured out the rest.", "why_matters": "Why hyperscalers can't easily replace Nvidia: switching means replacing not one chip but a whole rack-scale system including power, cooling, networking, and software. A 3-year re-architecture, not a swap.", "context": "Jensen uses NVL72 as the example of system-level co-design: 'just like we gang them together with NVL72.'", "subvis": "\n<svg viewBox=\"0 0 680 260\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"20\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">NVL72 rack: 72 GPUs act as one giant GPU</text>\n  <rect x=\"200\" y=\"40\" width=\"280\" height=\"210\" rx=\"4\" fill=\"#fdfaf1\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <g fill=\"#76b900\" stroke=\"#1a1613\" stroke-width=\"0.5\">\n    <g font-family=\"monospace\" font-size=\"7\" fill=\"#fff\"><rect x=\"210\" y=\"48\" width=\"60\" height=\"8\"/>\n      <text x=\"240\" y=\"54\" text-anchor=\"middle\">GPU 1</text><rect x=\"275\" y=\"48\" width=\"60\" height=\"8\"/>\n      <text x=\"305\" y=\"54\" text-anchor=\"middle\">GPU 2</text><rect x=\"340\" y=\"48\" width=\"60\" height=\"8\"/>\n      <text x=\"370\" y=\"54\" text-anchor=\"middle\">GPU 3</text><rect x=\"405\" y=\"48\" width=\"60\" height=\"8\"/>\n      <text x=\"435\" y=\"54\" text-anchor=\"middle\">GPU 4</text><rect x=\"210\" y=\"58\" width=\"60\" height=\"8\"/>\n      <text x=\"240\" y=\"64\" text-anchor=\"middle\">GPU 5</text><rect x=\"275\" y=\"58\" width=\"60\" height=\"8\"/>\n      <text x=\"305\" y=\"64\" text-anchor=\"middle\">GPU 6</text><rect x=\"340\" y=\"58\" width=\"60\" height=\"8\"/>\n      <text x=\"370\" y=\"64\" text-anchor=\"middle\">GPU 7</text><rect x=\"405\" y=\"58\" width=\"60\" height=\"8\"/>\n      <text x=\"435\" y=\"64\" text-anchor=\"middle\">GPU 8</text><rect x=\"210\" y=\"68\" width=\"60\" height=\"8\"/>\n      <text x=\"240\" y=\"74\" text-anchor=\"middle\">GPU 9</text><rect x=\"275\" y=\"68\" width=\"60\" height=\"8\"/>\n      <text x=\"305\" y=\"74\" text-anchor=\"middle\">GPU 10</text><rect x=\"340\" y=\"68\" width=\"60\" height=\"8\"/>\n      <text x=\"370\" y=\"74\" text-anchor=\"middle\">GPU 11</text><rect x=\"405\" y=\"68\" width=\"60\" height=\"8\"/>\n      <text x=\"435\" y=\"74\" text-anchor=\"middle\">GPU 12</text><rect x=\"210\" y=\"78\" width=\"60\" height=\"8\"/>\n      <text x=\"240\" y=\"84\" text-anchor=\"middle\">GPU 13</text><rect x=\"275\" y=\"78\" width=\"60\" height=\"8\"/>\n      <text x=\"305\" y=\"84\" text-anchor=\"middle\">GPU 14</text><rect x=\"340\" y=\"78\" width=\"60\" height=\"8\"/>\n      <text x=\"370\" y=\"84\" text-anchor=\"middle\">GPU 15</text><rect x=\"405\" y=\"78\" width=\"60\" height=\"8\"/>\n      <text x=\"435\" y=\"84\" text-anchor=\"middle\">GPU 16</text><rect x=\"210\" y=\"88\" width=\"60\" height=\"8\"/>\n      <text x=\"240\" y=\"94\" text-anchor=\"middle\">GPU 17</text><rect x=\"275\" y=\"88\" width=\"60\" height=\"8\"/>\n      <text x=\"305\" y=\"94\" text-anchor=\"middle\">GPU 18</text>\n    </g>\n  </g>\n  <rect x=\"210\" y=\"238\" width=\"260\" height=\"6\" fill=\"#a8321f\"/>\n  <text x=\"340\" y=\"256\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#a8321f\">power/water in ~120 kW</text>\n  <g font-family=\"monospace\" font-size=\"10\">\n    <text x=\"55\" y=\"75\" font-weight=\"700\">Physical</text>\n    <text x=\"55\" y=\"94\" fill=\"#706659\">72 Blackwell GPUs</text>\n    <text x=\"55\" y=\"108\" fill=\"#706659\">36 Grace CPUs</text>\n    <text x=\"55\" y=\"122\" fill=\"#706659\">9 NVLink switches</text>\n    <text x=\"55\" y=\"136\" fill=\"#706659\">120 kW, liquid-cooled</text>\n    <text x=\"55\" y=\"160\" font-weight=\"700\">Price</text>\n    <text x=\"55\" y=\"179\" fill=\"#706659\">~$3M per rack</text>\n  </g>\n  <g font-family=\"monospace\" font-size=\"10\">\n    <text x=\"505\" y=\"75\" font-weight=\"700\">Logically</text>\n    <text x=\"505\" y=\"94\" fill=\"#706659\">1 unified memory pool</text>\n    <text x=\"505\" y=\"108\" fill=\"#706659\">1.4 exaFLOPS (FP4)</text>\n    <text x=\"505\" y=\"122\" fill=\"#706659\">130 TB/s mem BW total</text>\n    <text x=\"505\" y=\"136\" fill=\"#706659\">one logical GPU</text>\n    <text x=\"505\" y=\"160\" font-weight=\"700\" fill=\"#2f7a3e\">Shift</text>\n    <text x=\"505\" y=\"179\" fill=\"#706659\">Unit of sale = rack,</text>\n    <text x=\"505\" y=\"193\" fill=\"#706659\">not chip</text>\n  </g>\n</svg>", "section_id": "network", "section_num": "03", "section_title": "Networking & Systems", "section_color": "teal", "timestamp_sec": 4150, "timestamp_fmt": "1:09:10", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=4150s"}, {"name": "Spectrum-X", "expansion": "", "plain": "Nvidia's Ethernet-based networking platform for AI datacenters — competes with its own InfiniBand. Can offload certain computations (reductions, broadcasts) into the switch fabric itself. Announced 2023, now the preferred fabric for many hyperscalers.", "analogy": null, "why_matters": "Hyperscalers prefer Ethernet — they've run it for decades. Spectrum-X gives them InfiniBand-class performance on Ethernet syntax. Removes a key objection to going full-Nvidia.", "context": "Jensen: 'We can even offload computation into the fabric, like NVLink, or into the network with Spectrum-X.'", "subvis": null, "section_id": "network", "section_num": "03", "section_title": "Networking & Systems", "section_color": "teal", "timestamp_sec": 1408, "timestamp_fmt": "23:28", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1408s"}, {"name": "Mellanox", "expansion": "", "plain": "Israeli networking company Nvidia acquired in 2020 for $6.9 billion — its largest deal until the December 2025 Groq licensing deal. Maker of InfiniBand switches and high-speed Ethernet NICs (ConnectX). Without Mellanox, Nvidia has no rack-scale story.", "analogy": null, "why_matters": "One of the most important but under-discussed tech acquisitions ever. Nvidia becomes a networking company overnight, turning what was a chipmaker into a full-stack system provider.", "context": "Jensen: 'Networking matters. That's why Nvidia bought Mellanox.'", "subvis": null, "section_id": "network", "section_num": "03", "section_title": "Networking & Systems", "section_color": "teal", "timestamp_sec": 5697, "timestamp_fmt": "1:34:57", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=5697s"}, {"name": "Fabric", "expansion": "", "plain": "The interconnect mesh that wires chips together inside a rack or cluster. A fabric has no central hub — every node can reach every other directly. NVLink and Spectrum-X are both fabrics.", "analogy": "Chain mail armor, not a jacket with a zipper. Every ring connects to several neighbors — cut one, the mesh still works; information can flow around any failure.", "why_matters": null, "context": "Jensen: 'across the processors, the system, the fabric, the libraries, and the algorithm simultaneously.'", "subvis": "\n<svg viewBox=\"0 0 640 200\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"320\" y=\"20\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">A \"fabric\" is any all-to-all interconnect mesh</text>\n  <g transform=\"translate(80,50)\">\n    <text x=\"50\" y=\"-12\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" font-weight=\"700\">Bus (old)</text>\n    <line x1=\"0\" y1=\"60\" x2=\"100\" y2=\"60\" stroke=\"#706659\" stroke-width=\"3\"/>\n    <circle cx=\"15\" cy=\"60\" r=\"8\" fill=\"#fef3d8\" stroke=\"#b8651a\"/>\n    <circle cx=\"40\" cy=\"60\" r=\"8\" fill=\"#fef3d8\" stroke=\"#b8651a\"/>\n    <circle cx=\"65\" cy=\"60\" r=\"8\" fill=\"#fef3d8\" stroke=\"#b8651a\"/>\n    <circle cx=\"90\" cy=\"60\" r=\"8\" fill=\"#fef3d8\" stroke=\"#b8651a\"/>\n    <text x=\"50\" y=\"95\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">one shared wire</text>\n    <text x=\"50\" y=\"108\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">contention bottleneck</text>\n  </g>\n  <g transform=\"translate(260,50)\">\n    <text x=\"60\" y=\"-12\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" font-weight=\"700\">Star (hub)</text>\n    <circle cx=\"60\" cy=\"60\" r=\"10\" fill=\"#fffdf8\" stroke=\"#1a1613\"/>\n    <circle cx=\"15\" cy=\"35\" r=\"8\" fill=\"#fef3d8\" stroke=\"#b8651a\"/>\n    <circle cx=\"105\" cy=\"35\" r=\"8\" fill=\"#fef3d8\" stroke=\"#b8651a\"/>\n    <circle cx=\"15\" cy=\"85\" r=\"8\" fill=\"#fef3d8\" stroke=\"#b8651a\"/>\n    <circle cx=\"105\" cy=\"85\" r=\"8\" fill=\"#fef3d8\" stroke=\"#b8651a\"/>\n    <line x1=\"60\" y1=\"60\" x2=\"15\" y2=\"35\" stroke=\"#706659\"/><line x1=\"60\" y1=\"60\" x2=\"105\" y2=\"35\" stroke=\"#706659\"/>\n    <line x1=\"60\" y1=\"60\" x2=\"15\" y2=\"85\" stroke=\"#706659\"/><line x1=\"60\" y1=\"60\" x2=\"105\" y2=\"85\" stroke=\"#706659\"/>\n    <text x=\"60\" y=\"65\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"8\">hub</text>\n    <text x=\"60\" y=\"116\" text-anchor=\"middle\" font-family=\"monospace\" font-s
