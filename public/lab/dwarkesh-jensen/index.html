ize=\"9\" fill=\"#706659\">hub bottleneck</text>\n  </g>\n  <g transform=\"translate(460,50)\">\n    <text x=\"60\" y=\"-12\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" font-weight=\"700\" fill=\"#2f7a3e\">Fabric (NVLink)</text>\n    <circle cx=\"15\" cy=\"35\" r=\"8\" fill=\"#76b900\" stroke=\"#1a1613\"/>\n    <circle cx=\"105\" cy=\"35\" r=\"8\" fill=\"#76b900\" stroke=\"#1a1613\"/>\n    <circle cx=\"15\" cy=\"85\" r=\"8\" fill=\"#76b900\" stroke=\"#1a1613\"/>\n    <circle cx=\"105\" cy=\"85\" r=\"8\" fill=\"#76b900\" stroke=\"#1a1613\"/>\n    <g stroke=\"#2f7a3e\" stroke-width=\"1.2\">\n      <line x1=\"15\" y1=\"35\" x2=\"105\" y2=\"35\"/><line x1=\"15\" y1=\"35\" x2=\"15\" y2=\"85\"/><line x1=\"15\" y1=\"35\" x2=\"105\" y2=\"85\"/>\n      <line x1=\"105\" y1=\"35\" x2=\"15\" y2=\"85\"/><line x1=\"105\" y1=\"35\" x2=\"105\" y2=\"85\"/><line x1=\"15\" y1=\"85\" x2=\"105\" y2=\"85\"/>\n    </g>\n    <text x=\"60\" y=\"108\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#2f7a3e\">every link parallel</text>\n  </g>\n  <text x=\"320\" y=\"190\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-style=\"italic\" fill=\"#706659\">No central bottleneck. Bandwidth scales with the square of nodes.</text>\n</svg>", "section_id": "network", "section_num": "03", "section_title": "Networking & Systems", "section_color": "teal", "timestamp_sec": 1408, "timestamp_fmt": "23:28", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1408s"}, {"name": "Rack", "expansion": "", "plain": "Six-foot-tall datacenter cabinet. Historically held a few dozen independent servers. In modern AI, a rack holds 72 tightly-coupled GPUs acting as one system — the smallest useful unit of AI compute is now the rack, not the chip.", "analogy": null, "why_matters": "A subtle but seismic industry shift. For 40 years the 'server' was the unit. Now the server is too small to matter. Why AI datacenter construction timelines are longer — you're building for racks, not machines.", "context": "Jensen: 'You'd like to buy $10 million, or just one rack, not a problem. If you would like to place $100 billion of AI factory, no problem.'", "subvis": null, "section_id": "network", "section_num": "03", "section_title": "Networking & Systems", "section_color": "teal", "timestamp_sec": 3400, "timestamp_fmt": "56:40", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=3400s"}, {"name": "AI factory", "expansion": "", "plain": "Nvidia's branding for datacenters purpose-built to convert electricity into tokens at industrial scale. Input: electrons. Output: tokens sold by the million. Not 'IT infrastructure' — manufacturing plant.", "analogy": null, "why_matters": "Strategic reframing. By calling it a factory, Jensen turns AI into a capex-heavy industrial business (hard to commoditize) rather than a software-distribution business (easy to commoditize). Investor narrative matters here.", "context": "Jensen: 'If you would like to place an order for $100 billion of AI factory, no problem.'", "subvis": null, "section_id": "network", "section_num": "03", "section_title": "Networking & Systems", "section_color": "teal", "timestamp_sec": 958, "timestamp_fmt": "15:58", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=958s"}, {"name": "Gigawatt datacenter", "expansion": "", "plain": "One billion watts of power draw — mid-sized nuclear reactor territory, enough to power ~750,000 homes. The reference unit for frontier AI infrastructure in 2026. Anthropic's deal with Amazon/Google: multi-gigawatt. OpenAI's partnership with SoftBank/Oracle: 10+ GW announced.", "analogy": null, "why_matters": "The constraint is no longer chips — it's siting 1-10 GW of power in one place. Grid interconnect queues are 5+ years in the US. Why Nvidia's perf/watt matters: same power cap, more tokens.", "context": "Jensen: 'if a partner built a one gigawatt datacenter, that datacenter better deliver the maximum tokens.'", "subvis": "\n<svg viewBox=\"0 0 660 200\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"330\" y=\"20\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Power scales — at gigawatts, the grid is the constraint</text>\n  <g font-family=\"monospace\" font-size=\"10\">\n    <rect x=\"40\" y=\"135\" width=\"70\" height=\"30\" fill=\"#b8651a\"/>\n    <text x=\"75\" y=\"152\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\">1 MW</text>\n    <text x=\"75\" y=\"180\" text-anchor=\"middle\" fill=\"#706659\" font-size=\"9\">small office</text>\n    <text x=\"75\" y=\"192\" text-anchor=\"middle\" fill=\"#706659\" font-size=\"9\">~1 rack</text>\n    <rect x=\"135\" y=\"115\" width=\"70\" height=\"50\" fill=\"#b8651a\"/>\n    <text x=\"170\" y=\"142\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\">100 MW</text>\n    <text x=\"170\" y=\"180\" text-anchor=\"middle\" fill=\"#706659\" font-size=\"9\">Hopper-era</text>\n    <text x=\"170\" y=\"192\" text-anchor=\"middle\" fill=\"#706659\" font-size=\"9\">~70k GPUs</text>\n    <rect x=\"230\" y=\"85\" width=\"70\" height=\"80\" fill=\"#a8321f\"/>\n    <text x=\"265\" y=\"127\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\">1 GW</text>\n    <text x=\"265\" y=\"180\" text-anchor=\"middle\" fill=\"#706659\" font-size=\"9\">Blackwell frontier</text>\n    <text x=\"265\" y=\"192\" text-anchor=\"middle\" fill=\"#706659\" font-size=\"9\">~700k GPUs</text>\n    <rect x=\"325\" y=\"50\" width=\"70\" height=\"115\" fill=\"#6b4a9e\"/>\n    <text x=\"360\" y=\"110\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"11\" font-weight=\"700\">5 GW</text>\n    <text x=\"360\" y=\"180\" text-anchor=\"middle\" fill=\"#706659\" font-size=\"9\">Rubin/Anthropic</text>\n    <text x=\"360\" y=\"192\" text-anchor=\"middle\" fill=\"#706659\" font-size=\"9\">\"AI factory\"</text>\n    <rect x=\"420\" y=\"40\" width=\"70\" height=\"125\" fill=\"#1a1613\"/>\n    <text x=\"455\" y=\"107\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"11\" font-weight=\"700\">~10 GW</text>\n    <text x=\"455\" y=\"180\" text-anchor=\"middle\" fill=\"#706659\" font-size=\"9\">OpenAI/SoftBank</text>\n    <text x=\"455\" y=\"192\" text-anchor=\"middle\" fill=\"#706659\" font-size=\"9\">announced ceiling</text>\n    <line x1=\"520\" y1=\"60\" x2=\"620\" y2=\"60\" stroke=\"#706659\" stroke-dasharray=\"3,2\"/>\n    <text x=\"570\" y=\"55\" text-anchor=\"middle\" fill=\"#a8321f\" font-size=\"10\" font-weight=\"700\">typical nuke</text>\n    <text x=\"570\" y=\"73\" text-anchor=\"middle\" fill=\"#706659\" font-size=\"9\">plant output</text>\n    <line x1=\"520\" y1=\"95\" x2=\"620\" y2=\"95\" stroke=\"#706659\" stroke-dasharray=\"3,2\"/>\n    <text x=\"570\" y=\"90\" text-anchor=\"middle\" fill=\"#a8321f\" font-size=\"10\" font-weight=\"700\">NYC peak</text>\n    <text x=\"570\" y=\"108\" text-anchor=\"middle\" fill=\"#706659\" font-size=\"9\">~11 GW summer</text>\n  </g>\n</svg>", "section_id": "network", "section_num": "03", "section_title": "Networking & Systems", "section_color": "teal", "timestamp_sec": 2089, "timestamp_fmt": "34:49", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=2089s"}, {"name": "Performance per watt", "expansion": "", "plain": "Compute output per joule of energy. When grid power is capped (every gigawatt is a political fight), this is the only lever left for more throughput. 2× perf/watt at gigawatt scale = 2× the revenue from the same power bill.", "analogy": null, "why_matters": "Jensen's #1 engineering optimization target. Why he keeps saying 'our perf per watt is the highest in the world.' Rubin's 10× inference-cost reduction = hundreds of billions of revenue capacity across Nvidia customers.", "context": "Jensen: 'our perf per watt is the highest in the world... the US is scarce on energy.'", "subvis": "\n<svg viewBox=\"0 0 660 190\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"330\" y=\"20\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">When power is capped, perf/watt IS the revenue ceiling</text>\n  <rect x=\"60\" y=\"60\" width=\"540\" height=\"40\" fill=\"#fbeae5\" stroke=\"#a8321f\" stroke-width=\"1.5\"/>\n  <text x=\"330\" y=\"85\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\" fill=\"#a8321f\">1 GIGAWATT — fixed by utility, land, substation</text>\n  <g font-family=\"monospace\" font-size=\"10\">\n    <g transform=\"translate(80,120)\">\n      <text x=\"0\" y=\"0\" font-weight=\"700\" fill=\"#b8651a\">Chip A</text>\n      <text x=\"0\" y=\"15\" fill=\"#706659\">10 tok/s/watt</text>\n      <text x=\"0\" y=\"30\" fill=\"#1a1613\" font-weight=\"700\">10 billion tok/s</text>\n    </g>\n    <g transform=\"translate(300,120)\">\n      <text x=\"0\" y=\"0\" font-weight=\"700\" fill=\"#2f7a3e\">Chip B (2× eff)</text>\n      <text x=\"0\" y=\"15\" fill=\"#706659\">20 tok/s/watt</text>\n      <text x=\"0\" y=\"30\" fill=\"#1a1613\" font-weight=\"700\">20 billion tok/s</text>\n    </g>\n    <g transform=\"translate(500,120)\">\n      <text x=\"0\" y=\"0\" font-weight=\"700\" fill=\"#6b4a9e\">= 2× revenue</text>\n      <text x=\"0\" y=\"15\" fill=\"#706659\">same box,</text>\n      <text x=\"0\" y=\"30\" fill=\"#706659\">same power bill</text>\n    </g>\n  </g>\n  <text x=\"330\" y=\"175\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" font-style=\"italic\" fill=\"#706659\">Why Nvidia's #1 architectural target is tokens/joule, not raw flops</text>\n</svg>", "section_id": "network", "section_num": "03", "section_title": "Networking & Systems", "section_color": "teal", "timestamp_sec": 2089, "timestamp_fmt": "34:49", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=2089s"}, {"name": "Co-design", "expansion": "", "plain": "Designing the chip + package + rack + network + compiler + libraries + algorithms TOGETHER, as one system, instead of optimizing each layer separately. Compounds gains across layers in ways no single-layer optimization can match. 30-50× perf/watt gains come from this, not from silicon alone.", "analogy": "A Formula 1 car isn't just a fast engine — chassis, aerodynamics, tires, fuel, and driver are all tuned to each other. A racing team that only optimized the engine would lose to one that optimizes the whole car.", "why_matters": "The fundamental structural reason ASIC competitors struggle. They can beat Nvidia on one layer — cheaper silicon, faster matmul — but can't co-design all 7 layers on an annual cadence. An organizational moat, not a technical one.", "context": "Jensen: 'We could affect change across the processors, system, fabric, libraries, and algorithm simultaneously.'", "subvis": "\n<svg viewBox=\"0 0 660 250\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"330\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Co-design: 5 layers optimized as one system</text>\n  <g font-family=\"monospace\" font-size=\"10\">\n    <rect x=\"40\" y=\"50\" width=\"140\" height=\"34\" fill=\"#efe6f2\" stroke=\"#6b4a9e\" stroke-width=\"1.5\"/>\n    <text x=\"110\" y=\"72\" text-anchor=\"middle\" font-weight=\"700\">algorithm</text>\n    <rect x=\"40\" y=\"90\" width=\"140\" height=\"34\" fill=\"#e8f2e0\" stroke=\"#2f7a3e\" stroke-width=\"1.5\"/>\n    <text x=\"110\" y=\"112\" text-anchor=\"middle\" font-weight=\"700\">libraries</text>\n    <rect x=\"40\" y=\"130\" width=\"140\" height=\"34\" fill=\"#fef3d8\" stroke=\"#b8651a\" stroke-width=\"1.5\"/>\n    <text x=\"110\" y=\"152\" text-anchor=\"middle\" font-weight=\"700\">network (NVLink)</text>\n    <rect x=\"40\" y=\"170\" width=\"140\" height=\"34\" fill=\"#e8eef5\" stroke=\"#2a5f8f\" stroke-width=\"1.5\"/>\n    <text x=\"110\" y=\"192\" text-anchor=\"middle\" font-weight=\"700\">chip architecture</text>\n  </g>\n  <g stroke=\"#1a1613\" stroke-width=\"1.2\" fill=\"none\" stroke-dasharray=\"3,2\">\n    <line x1=\"182\" y1=\"67\" x2=\"240\" y2=\"67\"/>\n    <line x1=\"182\" y1=\"107\" x2=\"240\" y2=\"107\"/>\n    <line x1=\"182\" y1=\"147\" x2=\"240\" y2=\"147\"/>\n    <line x1=\"182\" y1=\"187\" x2=\"240\" y2=\"187\"/>\n    <rect x=\"240\" y=\"57\" width=\"180\" height=\"140\" rx=\"3\"/>\n  </g>\n  <text x=\"330\" y=\"80\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\">compound gains</text>\n  <text x=\"330\" y=\"102\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" fill=\"#706659\">each layer</text>\n  <text x=\"330\" y=\"116\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" fill=\"#706659\">knows the next</text>\n  <text x=\"330\" y=\"138\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" fill=\"#706659\">30-50× perf/watt</text>\n  <text x=\"330\" y=\"152\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" fill=\"#706659\">in one generation</text>\n  <text x=\"330\" y=\"180\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" font-style=\"italic\" fill=\"#2f7a3e\">not achievable by</text>\n  <text x=\"330\" y=\"192\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" font-style=\"italic\" fill=\"#2f7a3e\">optimizing layers alone</text>\n  <g font-family=\"monospace\" font-size=\"10\">\n    <rect x=\"440\" y=\"50\" width=\"180\" height=\"160\" fill=\"#fdfaf1\" stroke=\"#706659\" stroke-width=\"1\"/>\n    <text x=\"530\" y=\"70\" text-anchor=\"middle\" font-weight=\"700\">Attack one layer?</text>\n    <line x1=\"450\" y1=\"78\" x2=\"610\" y2=\"78\" stroke=\"#d9cfc0\"/>\n    <text x=\"450\" y=\"95\" fill=\"#706659\">TPU — faster matmul</text>\n    <text x=\"450\" y=\"108\" fill=\"#706659\">Trainium — cheaper</text>\n    <text x=\"450\" y=\"121\" fill=\"#706659\">Cerebras — wafer-scale</text>\n    <text x=\"450\" y=\"134\" fill=\"#706659\">Dojo — tiled package</text>\n    <text x=\"530\" y=\"160\" text-anchor=\"middle\" fill=\"#1a1613\" font-weight=\"700\">Result:</text>\n    <text x=\"530\" y=\"178\" text-anchor=\"middle\" fill=\"#a8321f\" font-style=\"italic\">single-layer wins,</text>\n    <text x=\"530\" y=\"192\" text-anchor=\"middle\" fill=\"#a8321f\" font-style=\"italic\">system-level loses</text>\n  </g>\n</svg>", "section_id": "network", "section_num": "03", "section_title": "Networking & Systems", "section_color": "teal", "timestamp_sec": 1403, "timestamp_fmt": "23:23", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1403s"}, {"name": "CUDA", "expansion": "(Compute Unified Device Architecture)", "plain": "Nvidia's GPU programming platform, launched 2006. A C-like language, a compiler (nvcc), drivers, and a runtime. Every major AI framework compiles to CUDA when running on Nvidia. For 15+ years it was a money-losing investment — Jensen's recurring 'nobody else would have done it.'", "analogy": "CUDA is Windows for AI. Microsoft lost money on Windows for years, then dominated PCs for two decades because all apps targeted it. Nvidia lost money on CUDA for two decades and now every AI app targets it.", "why_matters": "The deepest moat, hardest to see from outside. A competitor can copy the GPU. Copying ~200M devices running CUDA, plus the 4M developers who know it, plus 20 years of tuned libraries — takes a decade, if ever.", "context": "Jensen: '20 years of CUDA while losing money. If we didn't do it, nobody else would have.'", "subvis": "\n<svg viewBox=\"0 0 680 230\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"20\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">The CUDA stack — ~20 years of layered investment</text>\n  <rect x=\"40\" y=\"35\" width=\"600\" height=\"26\" fill=\"#efe6f2\" stroke=\"#6b4a9e\" stroke-width=\"1\"/>\n  <text x=\"340\" y=\"53\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\">Applications — ChatGPT, Midjourney, Copilot, Cursor, Gemini</text>\n  <rect x=\"40\" y=\"65\" width=\"600\" height=\"26\" fill=\"#e8f2e0\" stroke=\"#2f7a3e\" stroke-width=\"1\"/>\n  <text x=\"340\" y=\"83\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\">Frameworks — PyTorch, JAX, vLLM, Triton, SGLang, TensorRT</text>\n  <rect x=\"40\" y=\"95\" width=\"600\" height=\"26\" fill=\"#fef3d8\" stroke=\"#b8651a\" stroke-width=\"1\"/>\n  <text x=\"340\" y=\"113\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\">CUDA-X libraries — cuBLAS, cuDNN, NCCL, cuLitho, cuQuantum</text>\n  <rect x=\"40\" y=\"125\" width=\"600\" height=\"32\" fill=\"#d4c190\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <text x=\"340\" y=\"146\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">CUDA — compiler (nvcc) + driver + runtime API</text>\n  <rect x=\"40\" y=\"161\" width=\"600\" height=\"26\" fill=\"#fffdf8\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <text x=\"340\" y=\"179\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\" fill=\"#76b900\">Nvidia GPU hardware — Hopper, Blackwell, Rubin</text>\n  <text x=\"340\" y=\"214\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" font-style=\"italic\" fill=\"#706659\">Each layer is a lock-in. Switch GPUs, lose all 5 layers. This is the moat.</text>\n</svg>", "section_id": "software", "section_num": "04", "section_title": "Software Stack & Frameworks", "section_color": "green", "timestamp_sec": 919, "timestamp_fmt": "15:19", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=919s"}, {"name": "CUDA-X", "expansion": "", "plain": "Family of domain-specific libraries layered on CUDA — cuDNN (neural nets), cuBLAS (linear algebra), cuLitho (chip lithography), RAPIDS (data science), cuQuantum (quantum simulation), Isaac (robotics), Parabricks (genomics).", "analogy": null, "why_matters": "Each library is a per-domain moat. A quantum chemist using cuQuantum isn't locked into Nvidia by CUDA — they're locked in by five years of domain-specific optimization no competitor has.", "context": "Jensen: 'We pushed into domain-specific libraries because if we didn't create these, nobody would.'", "subvis": null, "section_id": "software", "section_num": "04", "section_title": "Software Stack & Frameworks", "section_color": "green", "timestamp_sec": 2692, "timestamp_fmt": "44:52", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=2692s"}, {"name": "Kernel", "expansion": "", "plain": "A small GPU program that does one specific computation — attention, matmul, layer normalization, softmax. Modern AI models orchestrate hundreds of kernels per forward pass. Hand-tuning a kernel often yields 2-3× speedups over the general-purpose library version.", "analogy": "A kernel is a single cooking step in a recipe. 'Sauté the onions for 4 minutes.' A 10-minute step becomes a 3-minute step with better equipment — each step matters, and across 50 steps, the dinner either arrives on time or late.", "why_matters": "Why Nvidia's relationship with top AI labs matters: Nvidia engineers co-write kernels with them. A custom attention kernel can be the difference between model-training-works and model-training-times-out.", "context": "Jensen: 'Our expertise helps our AI lab partners get another 2x out of their stack easily.'", "subvis": null, "section_id": "software", "section_num": "04", "section_title": "Software Stack & Frameworks", "section_color": "green", "timestamp_sec": 1391, "timestamp_fmt": "23:11", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1391s"}, {"name": "Triton", "expansion": "", "plain": "Higher-level kernel-writing language from OpenAI. Compiles to CUDA PTX (and in principle to other backends). Lets ML engineers write fast GPU code without the pain of raw CUDA C++. Widely used across frontier labs.", "analogy": null, "why_matters": "Triton threatens CUDA's lock-in in theory (kernels portable to other hardware) but reinforces it in practice (Triton's Nvidia backend is where it works best). Jensen's comment about Triton's back-end using Nvidia tech is making exactly this point.", "context": "Dwarkesh: 'OpenAI has Triton.' Jensen: 'the back end of Triton has huge amounts of Nvidia technology.'", "subvis": null, "section_id": "software", "section_num": "04", "section_title": "Software Stack & Frameworks", "section_color": "green", "timestamp_sec": 1530, "timestamp_fmt": "25:30", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1530s"}, {"name": "cuBLAS", "expansion": "(CUDA Basic Linear Algebra Subroutines)", "plain": "Nvidia's hand-optimized library for matrix and vector math. For 95% of programs, calling cuBLAS is faster than any kernel you'd write yourself. The top 5% of labs bypass it with custom kernels to squeeze the last bit of performance.", "analogy": null, "why_matters": "Part of the CUDA-X moat — a competitor could write an equivalent library, but matching 15+ years of tuning across every GPU generation is brutal.", "context": "Dwarkesh notes OpenAI goes 'down to CUDA C++, instead of using cuBLAS and NCCL' to squeeze the last 5%.", "subvis": null, "section_id": "software", "section_num": "04", "section_title": "Software Stack & Frameworks", "section_color": "green", "timestamp_sec": 1538, "timestamp_fmt": "25:38", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1538s"}, {"name": "NCCL", "expansion": "(Nvidia Collective Communications Library)", "plain": "Coordinates thousands of GPUs sharing gradients, broadcasts, and synchronizations during training. Implements operations like all-reduce and all-gather efficiently over NVLink and Spectrum-X.", "analogy": "If NVLink is the phone system between GPUs, NCCL is the conference-call software — lets thousands of GPUs speak at once without talking over each other.", "why_matters": null, "context": "Part of the stack OpenAI replaces with its own for the last 5% of performance.", "subvis": null, "section_id": "software", "section_num": "04", "section_title": "Software Stack & Frameworks", "section_color": "green", "timestamp_sec": 1538, "timestamp_fmt": "25:38", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1538s"}, {"name": "PyTorch", "expansion": "", "plain": "Dominant deep-learning framework. Open-source, Meta-originated, now governed by the PyTorch Foundation (Linux Foundation). ~80-90% of AI research code is PyTorch. Runs on CUDA by default; also supports XLA (TPUs), MPS (Apple), ROCm (AMD).", "analogy": null, "why_matters": "Quiet reinforcement of the Nvidia moat: every ML student learns PyTorch, which implicitly teaches them CUDA. Nvidia gets the next generation of AI engineers for free.", "context": "Dwarkesh's era contrast: professors 'needed to run PyTorch with CUDA and have everything optimized.'", "subvis": null, "section_id": "software", "section_num": "04", "section_title": "Software Stack & Frameworks", "section_color": "green", "timestamp_sec": 1508, "timestamp_fmt": "25:08", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1508s"}, {"name": "cuLitho", "expansion": "", "plain": "Nvidia's library for computational lithography — the math that converts a chip design into photomask patterns that EUV machines print. Accelerates this ~40× over CPU baseline. Used by TSMC, Samsung, and chip designers like Nvidia itself.", "analogy": null, "why_matters": "Example Jensen uses to illustrate 'if we didn't build it, nobody would.' Total addressable market is maybe 5 companies in the world. No purely commercial company would spend on this.", "context": "Jensen: 'If we didn't create [cuLitho], nobody would have.'", "subvis": null, "section_id": "software", "section_num": "04", "section_title": "Software Stack & Frameworks", "section_color": "green", "timestamp_sec": 2724, "timestamp_fmt": "45:24", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=2724s"}, {"name": "vLLM", "expansion": "", "plain": "Open-source LLM inference server from UC Berkeley. Introduced PagedAttention — manages KV cache the way an OS manages memory pages, eliminating internal fragmentation that previously wasted 60-80% of GPU memory.", "analogy": "A parking garage that always reserved a bus-sized spot for every car. vLLM lets compact cars park in compact spots. Suddenly 3-5× more cars fit in the same garage.", "why_matters": "Before vLLM, serving an LLM at scale was brutally expensive. After vLLM, same hardware serves 3-5× more users. Most startups use it out of the box.", "context": "Crusoe sponsor read: 'up to 10x faster time-to-first token and up to 5x better throughput than vLLM.'", "subvis": null, "section_id": "software", "section_num": "04", "section_title": "Software Stack & Frameworks", "section_color": "green", "timestamp_sec": 1472, "timestamp_fmt": "24:32", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1472s"}, {"name": "SGLang", "expansion": "", "plain": "LLM serving engine focused on structured generation and complex inference flows — tool use, multi-step prompts, constrained output. Often faster than vLLM for agentic workloads because it can share KV cache across related requests.", "analogy": null, "why_matters": "Emblematic of the 2025-26 inference infra explosion. Inference stack went from 'vLLM or bust' to a rich per-workload ecosystem in 18 months.", "context": "Jensen: 'There's Triton, vLLM, SGLang, and more.'", "subvis": null, "section_id": "software", "section_num": "04", "section_title": "Software Stack & Frameworks", "section_color": "green", "timestamp_sec": 1593, "timestamp_fmt": "26:33", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1593s"}, {"name": "verl", "expansion": "(Volcano Engine Reinforcement Learning)", "plain": "Open-source RL framework from ByteDance, released mid-2024. Widely adopted for post-training LLMs — fine-tuning with reward signals. Particularly suited for RL with verifiable rewards (code, math).", "analogy": null, "why_matters": "Illustrates a subtle shift: major OSS AI infrastructure increasingly comes from China. verl, DeepSpeed-MoE, Qwen's chat templates — all foundational pieces of the global stack.", "context": "Jensen: 'a whole bunch of new reinforcement learning frameworks coming out, like verl and NeMo RL.'", "subvis": null, "section_id": "software", "section_num": "04", "section_title": "Software Stack & Frameworks", "section_color": "green", "timestamp_sec": 1598, "timestamp_fmt": "26:38", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1598s"}, {"name": "NeMo RL", "expansion": "", "plain": "Nvidia's own RL framework, part of the NeMo toolkit for building generative AI. Tight integration with Nvidia hardware and DGX Cloud. Competitive response to open frameworks like verl.", "analogy": null, "why_matters": "Shows Nvidia moving into the application-framework layer — not content to own chips + CUDA, now reaching up into the tools model teams use directly.", "context": "Paired with verl in Jensen's list of tools that are 'exploding.'", "subvis": null, "section_id": "software", "section_num": "04", "section_title": "Software Stack & Frameworks", "section_color": "green", "timestamp_sec": 1598, "timestamp_fmt": "26:38", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1598s"}, {"name": "x86", "expansion": "", "plain": "The Intel/AMD CPU instruction set. Born 1978 as the Intel 8086. After 48 years and the failure of Intel's own replacement (Itanium), still ~70% of datacenter CPUs. The archetype of a sticky ecosystem.", "analogy": null, "why_matters": "Jensen invokes x86 as proof-by-analogy: if the market can't dislodge x86 after three decades of trying, CUDA — 20 years deep, with a comparable moat structure — will be even harder.", "context": "Jensen: 'There's a reason why the x86 deal exists. These ecosystems are hard to replace.'", "subvis": "\n<svg viewBox=\"0 0 660 200\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"330\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Why Jensen invokes x86 — to show how sticky CUDA will be</text>\n  <line x1=\"60\" y1=\"130\" x2=\"620\" y2=\"130\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <g font-family=\"monospace\" font-size=\"10\">\n    <g transform=\"translate(100,130)\">\n      <circle cx=\"0\" cy=\"0\" r=\"5\" fill=\"#706659\"/>\n      <text text-anchor=\"middle\" y=\"-12\" font-weight=\"700\">1978</text>\n      <text text-anchor=\"middle\" y=\"22\" fill=\"#706659\">Intel 8086</text>\n      <text text-anchor=\"middle\" y=\"36\" fill=\"#706659\" font-size=\"9\">first x86</text>\n    </g>\n    <g transform=\"translate(250,130)\">\n      <circle cx=\"0\" cy=\"0\" r=\"5\" fill=\"#706659\"/>\n      <text text-anchor=\"middle\" y=\"-12\" font-weight=\"700\">1990s</text>\n      <text text-anchor=\"middle\" y=\"22\" fill=\"#706659\">Windows wins</text>\n      <text text-anchor=\"middle\" y=\"36\" fill=\"#706659\" font-size=\"9\">x86-only apps</text>\n    </g>\n    <g transform=\"translate(400,130)\">\n      <circle cx=\"0\" cy=\"0\" r=\"5\" fill=\"#b8651a\"/>\n      <text text-anchor=\"middle\" y=\"-12\" font-weight=\"700\">2008</text>\n      <text text-anchor=\"middle\" y=\"22\" fill=\"#706659\">Itanium dies</text>\n      <text text-anchor=\"middle\" y=\"36\" fill=\"#706659\" font-size=\"9\">Intel's own alt fails</text>\n    </g>\n    <g transform=\"translate(550,130)\">\n      <circle cx=\"0\" cy=\"0\" r=\"5\" fill=\"#2f7a3e\"/>\n      <text text-anchor=\"middle\" y=\"-12\" font-weight=\"700\">2026</text>\n      <text text-anchor=\"middle\" y=\"22\" fill=\"#706659\">still 70% of DC</text>\n      <text text-anchor=\"middle\" y=\"36\" fill=\"#706659\" font-size=\"9\">after 48 yrs</text>\n    </g>\n  </g>\n  <text x=\"330\" y=\"182\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-style=\"italic\" fill=\"#706659\">Billions of lines of x86 code outlasted 3 challenger architectures. CUDA is 20 years in.</text>\n</svg>", "section_id": "software", "section_num": "04", "section_title": "Software Stack & Frameworks", "section_color": "green", "timestamp_sec": 4849, "timestamp_fmt": "1:20:49", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=4849s"}, {"name": "ARM", "expansion": "", "plain": "Competing CPU instruction set. British-origin, now Japanese-owned by SoftBank. Dominant in mobile, growing fast in datacenters (AWS Graviton, Apple M-series). Licensed to many chipmakers rather than made by one.", "analogy": null, "why_matters": "Nvidia's Grace CPU is ARM-based. Strategic move: sidestep Intel/AMD's x86 monopoly by adopting a chip architecture Nvidia can design itself. Grace + Blackwell = the first true Nvidia-only server.", "context": "Jensen: 'There's a reason why ARM is so sticky.'", "subvis": null, "section_id": "software", "section_num": "04", "section_title": "Software Stack & Frameworks", "section_color": "green", "timestamp_sec": 4849, "timestamp_fmt": "1:20:49", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=4849s"}, {"name": "Transformer", "expansion": "", "plain": "Neural network architecture introduced by Google in 2017 (paper: 'Attention Is All You Need'). Replaced earlier RNN/LSTM architectures. Processes all tokens in parallel rather than one at a time, which happens to map perfectly onto GPU hardware. Every major LLM today is a transformer variant.", "analogy": "Pre-transformer models read a book word-by-word, forgetting earlier words as they went. The transformer glances at the whole page and decides which words matter for each other — in parallel.", "why_matters": "The transformer's parallelism is why modern LLMs became possible on GPUs specifically. An AI architecture that didn't fit GPUs would have stalled the last 7 years.", "context": "Jensen discusses inventing new attention mechanisms — all transformer variants.", "subvis": null, "section_id": "models", "section_num": "05", "section_title": "AI Models & Algorithms", "section_color": "purple", "timestamp_sec": 1267, "timestamp_fmt": "21:07", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1267s"}, {"name": "Attention mechanism", "expansion": "", "plain": "Core operation inside a transformer. For each token, computes a weighted score against every other token to decide which ones matter. Many variants: multi-head, flash, grouped-query, sliding-window. The mechanism is quadratic — cost grows with the square of context length.", "analogy": null, "why_matters": "Every major LLM performance win of the past 3 years involved a new attention variant. Flash Attention (memory-efficient), GQA (fewer KV cache heads), sliding window (linear in practice). Why programmability wins.", "context": "Jensen: 'If you want to come up with a new attention mechanism, you want an architecture that's generally programmable.'", "subvis": "\n<svg viewBox=\"0 0 680 220\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">When predicting \"sat\", attention weighs every prior word</text>\n  <g font-family=\"monospace\" font-size=\"12\">\n    <rect x=\"60\" y=\"70\" width=\"60\" height=\"32\" fill=\"#fffdf8\" stroke=\"#1a1613\"/><text x=\"90\" y=\"90\" text-anchor=\"middle\">The</text>\n    <rect x=\"130\" y=\"70\" width=\"60\" height=\"32\" fill=\"#fef3d8\" stroke=\"#b8651a\" stroke-width=\"2\"/><text x=\"160\" y=\"90\" text-anchor=\"middle\" font-weight=\"700\">dog</text>\n    <rect x=\"200\" y=\"70\" width=\"60\" height=\"32\" fill=\"#fffdf8\" stroke=\"#1a1613\"/><text x=\"230\" y=\"90\" text-anchor=\"middle\">in</text>\n    <rect x=\"270\" y=\"70\" width=\"60\" height=\"32\" fill=\"#fffdf8\" stroke=\"#1a1613\"/><text x=\"300\" y=\"90\" text-anchor=\"middle\">the</text>\n    <rect x=\"340\" y=\"70\" width=\"60\" height=\"32\" fill=\"#fef7e4\" stroke=\"#b8651a\"/><text x=\"370\" y=\"90\" text-anchor=\"middle\">park</text>\n    <rect x=\"410\" y=\"70\" width=\"60\" height=\"32\" fill=\"#efe6f2\" stroke=\"#6b4a9e\" stroke-width=\"2.5\"/><text x=\"440\" y=\"90\" text-anchor=\"middle\" font-weight=\"700\">sat</text>\n    <rect x=\"480\" y=\"70\" width=\"60\" height=\"32\" fill=\"#e8f2e0\" stroke=\"#2f7a3e\" stroke-width=\"2\" stroke-dasharray=\"3,2\"/><text x=\"510\" y=\"90\" text-anchor=\"middle\" font-style=\"italic\" fill=\"#2f7a3e\">?</text>\n  </g>\n  <g fill=\"none\" stroke=\"#6b4a9e\" opacity=\"0.75\">\n    <path d=\"M 510 70 Q 450 25 160 70\" stroke-width=\"4\"/>\n    <path d=\"M 510 70 Q 470 35 90 70\" stroke-width=\"0.8\"/>\n    <path d=\"M 510 70 Q 490 40 230 70\" stroke-width=\"0.8\"/>\n    <path d=\"M 510 70 Q 480 35 300 70\" stroke-width=\"1\"/>\n    <path d=\"M 510 70 Q 470 30 370 70\" stroke-width=\"2\"/>\n    <path d=\"M 510 70 Q 480 30 440 70\" stroke-width=\"3\"/>\n  </g>\n  <g font-family=\"monospace\" font-size=\"9\" fill=\"#6b4a9e\">\n    <text x=\"90\" y=\"125\" text-anchor=\"middle\">0.02</text>\n    <text x=\"160\" y=\"125\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"11\">0.47</text>\n    <text x=\"230\" y=\"125\" text-anchor=\"middle\">0.03</text>\n    <text x=\"300\" y=\"125\" text-anchor=\"middle\">0.05</text>\n    <text x=\"370\" y=\"125\" text-anchor=\"middle\" font-weight=\"700\">0.19</text>\n    <text x=\"440\" y=\"125\" text-anchor=\"middle\" font-weight=\"700\">0.24</text>\n  </g>\n  <text x=\"340\" y=\"158\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-style=\"italic\" fill=\"#706659\">Each link's thickness = attention weight. \"dog\" dominates.</text>\n  <text x=\"340\" y=\"184\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" fill=\"#706659\">Every token computes this against every other token.</text>\n  <text x=\"340\" y=\"200\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" fill=\"#a8321f\" font-weight=\"700\">→ Quadratic cost. This is why context length is expensive.</text>\n</svg>", "section_id": "models", "section_num": "05", "section_title": "AI Models & Algorithms", "section_color": "purple", "timestamp_sec": 716, "timestamp_fmt": "11:56", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=716s"}, {"name": "MoE", "expansion": "(Mixture of Experts)", "plain": "Many 'expert' sub-networks; a router picks 2 of N to activate per input token. A model can have 700B total parameters but activate only ~70B per token — knowledge of a huge model at the compute cost of a small one. Used by DeepSeek, Mixtral, GPT-4 and Gemini (reportedly).", "analogy": "A consulting firm with 100 specialists. For each question, the receptionist routes you to the 2 most relevant experts. You get specialist-quality answers without paying 100 specialists' salaries per question.", "why_matters": "MoE decouples parameter count (knowledge capacity) from compute cost (latency). Why a 1T-parameter model can cost the same to run as a 200B-parameter dense model.", "context": "Jensen: 'MoE is a great invention — parallelized, disaggregated, distributed.'", "subvis": "\n<svg viewBox=\"0 0 680 240\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"20\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">MoE: 700B params on disk, 70B active per token</text>\n  <rect x=\"30\" y=\"100\" width=\"90\" height=\"40\" fill=\"#fef3d8\" stroke=\"#b8651a\"/>\n  <text x=\"75\" y=\"125\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\">input token</text>\n  <circle cx=\"200\" cy=\"120\" r=\"26\" fill=\"#fffdf8\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <text x=\"200\" y=\"116\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\">router</text>\n  <text x=\"200\" y=\"130\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\">pick top-2</text>\n  <line x1=\"120\" y1=\"120\" x2=\"174\" y2=\"120\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <g font-family=\"monospace\" font-size=\"9\">\n    <rect x=\"310\" y=\"38\" width=\"90\" height=\"22\" fill=\"#f5eedc\" stroke=\"#d9cfc0\"/><text x=\"355\" y=\"54\" text-anchor=\"middle\" fill=\"#706659\">expert 1</text>\n    <rect x=\"310\" y=\"62\" width=\"90\" height=\"22\" fill=\"#f5eedc\" stroke=\"#d9cfc0\"/><text x=\"355\" y=\"78\" text-anchor=\"middle\" fill=\"#706659\">expert 2</text>\n    <rect x=\"310\" y=\"86\" width=\"90\" height=\"22\" fill=\"#efe6f2\" stroke=\"#6b4a9e\" stroke-width=\"2.5\"/><text x=\"355\" y=\"102\" text-anchor=\"middle\" font-weight=\"700\">expert 3 ✓</text>\n    <rect x=\"310\" y=\"110\" width=\"90\" height=\"22\" fill=\"#f5eedc\" stroke=\"#d9cfc0\"/><text x=\"355\" y=\"126\" text-anchor=\"middle\" fill=\"#706659\">expert 4</text>\n    <rect x=\"310\" y=\"134\" width=\"90\" height=\"22\" fill=\"#f5eedc\" stroke=\"#d9cfc0\"/><text x=\"355\" y=\"150\" text-anchor=\"middle\" fill=\"#706659\">expert 5</text>\n    <rect x=\"310\" y=\"158\" width=\"90\" height=\"22\" fill=\"#f5eedc\" stroke=\"#d9cfc0\"/><text x=\"355\" y=\"174\" text-anchor=\"middle\" fill=\"#706659\">expert 6</text>\n    <rect x=\"310\" y=\"182\" width=\"90\" height=\"22\" fill=\"#efe6f2\" stroke=\"#6b4a9e\" stroke-width=\"2.5\"/><text x=\"355\" y=\"198\" text-anchor=\"middle\" font-weight=\"700\">expert 7 ✓</text>\n    <rect x=\"310\" y=\"206\" width=\"90\" height=\"22\" fill=\"#f5eedc\" stroke=\"#d9cfc0\"/><text x=\"355\" y=\"222\" text-anchor=\"middle\" fill=\"#706659\">expert 8</text>\n  </g>\n  <line x1=\"225\" y1=\"120\" x2=\"308\" y2=\"97\" stroke=\"#6b4a9e\" stroke-width=\"2\"/>\n  <line x1=\"225\" y1=\"120\" x2=\"308\" y2=\"193\" stroke=\"#6b4a9e\" stroke-width=\"2\"/>\n  <circle cx=\"480\" cy=\"120\" r=\"18\" fill=\"#fffdf8\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <text x=\"480\" y=\"125\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\">⊕</text>\n  <line x1=\"402\" y1=\"97\" x2=\"464\" y2=\"116\" stroke=\"#6b4a9e\" stroke-width=\"1.5\"/>\n  <line x1=\"402\" y1=\"193\" x2=\"464\" y2=\"124\" stroke=\"#6b4a9e\" stroke-width=\"1.5\"/>\n  <rect x=\"520\" y=\"100\" width=\"110\" height=\"40\" fill=\"#e8f2e0\" stroke=\"#2f7a3e\"/>\n  <text x=\"575\" y=\"125\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\">output token</text>\n  <line x1=\"498\" y1=\"120\" x2=\"518\" y2=\"120\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <g font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">\n    <text x=\"340\" y=\"228\" text-anchor=\"end\">Total params:</text>\n    <text x=\"345\" y=\"228\" font-weight=\"700\" fill=\"#6b4a9e\">huge (all experts stored)</text>\n  </g>\n  <text x=\"30\" y=\"205\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">Compute per token:</text>\n  <text x=\"30\" y=\"218\" font-family=\"monospace\" font-size=\"9\" fill=\"#2f7a3e\" font-weight=\"700\">small (only 2 experts run)</text>\n</svg>", "section_id": "models", "section_num": "05", "section_title": "AI Models & Algorithms", "section_color": "purple", "timestamp_sec": 4198, "timestamp_fmt": "1:09:58", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=4198s"}, {"name": "SSM", "expansion": "(State Space Model)", "plain": "Alternative to attention. Inspired by control theory. Maintains a compact 'hidden state' summarizing everything seen so far. Scales linearly with context length vs transformer's quadratic. Mamba, Jamba, RWKV. Hybrid SSM-transformer models are active research.", "analogy": "Transformer attention is keeping every email you've ever received in your inbox and re-reading them all before replying. SSM is taking notes as you go and throwing emails away — less complete, but you don't drown.", "why_matters": "If hybrid SSMs become dominant, the hardware requirements change completely (linear memory instead of quadratic). An ASIC designed for attention is suddenly over-specified.", "context": "Jensen names 'hybrid SSM' as an experiment CUDA enables and ASICs make hard.", "subvis": null, "section_id": "models", "section_num": "05", "section_title": "AI Models & Algorithms", "section_color": "purple", "timestamp_sec": 1273, "timestamp_fmt": "21:13", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1273s"}, {"name": "Diffusion model", "expansion": "", "plain": "Generates by progressively denoising random noise into coherent output. Dominant for images (Stable Diffusion, Flux, Midjourney). Training: given a noisy image, predict the noise.", "analogy": "Sculpting vs writing. Autoregressive text writes word-by-word. Diffusion starts with a rough block of marble and chips away until a statue emerges.", "why_matters": "Jensen mentions 'models that fuse diffusion and autoregressive' — a live research frontier. If that fusion wins, it changes which hardware architectures fit.", "context": "Jensen: 'a model that fuses diffusion and autoregressive techniques' — a live research frontier.", "subvis": null, "section_id": "models", "section_num": "05", "section_title": "AI Models & Algorithms", "section_color": "purple", "timestamp_sec": 1283, "timestamp_fmt": "21:23", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1283s"}, {"name": "Autoregressive", "expansion": "", "plain": "Generating one token at a time, each conditioned on everything generated so far. GPT, Claude, Gemini — all autoregressive. Simple in principle, expensive in practice because each token needs all prior tokens.", "analogy": null, "why_matters": "Can't parallelize generation — token N+1 needs token N. This is why KV cache, speculative decoding, and flash attention all exist. The entire inference-optimization industry is working around autoregressive sequential dependency.", "context": "Contrasted with diffusion in Jensen's fusion example.", "subvis": "\n<svg viewBox=\"0 0 680 170\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Autoregressive: each token depends on every prior token</text>\n  <g font-family=\"monospace\" font-size=\"11\">\n    <rect x=\"40\" y=\"60\" width=\"56\" height=\"30\" fill=\"#fffdf8\" stroke=\"#1a1613\"/><text x=\"68\" y=\"80\" text-anchor=\"middle\">\"The\"</text>\n    <rect x=\"110\" y=\"60\" width=\"56\" height=\"30\" fill=\"#fffdf8\" stroke=\"#1a1613\"/><text x=\"138\" y=\"80\" text-anchor=\"middle\">\"dog\"</text>\n    <rect x=\"180\" y=\"60\" width=\"56\" height=\"30\" fill=\"#fffdf8\" stroke=\"#1a1613\"/><text x=\"208\" y=\"80\" text-anchor=\"middle\">\"is\"</text>\n    <rect x=\"250\" y=\"60\" width=\"56\" height=\"30\" fill=\"#fffdf8\" stroke=\"#1a1613\"/><text x=\"278\" y=\"80\" text-anchor=\"middle\">\"very\"</text>\n    <rect x=\"320\" y=\"60\" width=\"56\" height=\"30\" fill=\"#efe6f2\" stroke=\"#6b4a9e\" stroke-width=\"2\"/><text x=\"348\" y=\"80\" text-anchor=\"middle\" font-weight=\"700\">?</text>\n    <rect x=\"390\" y=\"60\" width=\"240\" height=\"30\" fill=\"#f5eedc\" stroke=\"#d9cfc0\" stroke-dasharray=\"2,2\"/><text x=\"510\" y=\"80\" text-anchor=\"middle\" fill=\"#706659\">future tokens, not yet decided</text>\n  </g>\n  <g fill=\"none\" stroke=\"#6b4a9e\" opacity=\"0.6\" stroke-width=\"1.2\">\n    <path d=\"M 68 60 Q 200 30 340 60\"/>\n    <path d=\"M 138 60 Q 230 35 340 60\"/>\n    <path d=\"M 208 60 Q 270 40 340 60\"/>\n    <path d=\"M 278 60 Q 310 48 340 60\"/>\n  </g>\n  <text x=\"340\" y=\"130\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-style=\"italic\" fill=\"#706659\">Can't parallelize generation. Token N+1 needs token N. This is why latency is hard.</text>\n  <text x=\"340\" y=\"150\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" fill=\"#2f7a3e\">(diffusion generates in parallel — why the \"fusion\" idea matters)</text>\n</svg>", "section_id": "models", "section_num": "05", "section_title": "AI Models & Algorithms", "section_color": "purple", "timestamp_sec": 1289, "timestamp_fmt": "21:29", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1289s"}, {"name": "Disaggregated", "expansion": "", "plain": "Splitting a model's computation across different hardware pools. Modern LLM inference disaggregates 'prefill' (compute-heavy) onto one GPU pool and 'decode' (memory-bandwidth-heavy) onto another — very different optimization profiles.", "analogy": "A restaurant splitting the kitchen into a prep station (dicing vegetables for the night) and a line (cooking to order). Same meal, different tools, better throughput.", "why_matters": "Disaggregated inference is one of the key reasons flexible GPUs beat rigid ASICs in 2025-26 serving. You can't disaggregate on hardware that only does one thing.", "context": "Jensen: 'disaggregate in a different way' — what programmability enables.", "subvis": null, "section_id": "models", "section_num": "05", "section_title": "AI Models & Algorithms", "section_color": "purple", "timestamp_sec": 1267, "timestamp_fmt": "21:07", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1267s"}, {"name": "Token", "expansion": "", "plain": "Basic unit an LLM reads/writes. Typically a word fragment. English averages ~0.75 words per token. Pricing varies from $0.55/M (DeepSeek) to $75/M (Claude Opus output) — a ~5,000× range. The economic unit of the entire AI industry.", "analogy": null, "why_matters": "Jensen's mental model is 'electrons in, tokens out.' Everything downstream of infrastructure — model selection, product UX, margins — is denominated in tokens.", "context": "Jensen: 'making one token more valuable than another.'", "subvis": "\n<svg viewBox=\"0 0 660 200\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"330\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">How text becomes tokens — the unit of AI economics</text>\n  <text x=\"60\" y=\"65\" font-family=\"Georgia\" font-size=\"14\" fill=\"#1a1613\">\"</text>\n  <text x=\"70\" y=\"65\" font-family=\"Georgia\" font-size=\"14\" fill=\"#1a1613\">Tokenization</text>\n  <text x=\"195\" y=\"65\" font-family=\"Georgia\" font-size=\"14\" fill=\"#1a1613\">is</text>\n  <text x=\"225\" y=\"65\" font-family=\"Georgia\" font-size=\"14\" fill=\"#1a1613\">surprisingly</text>\n  <text x=\"350\" y=\"65\" font-family=\"Georgia\" font-size=\"14\" fill=\"#1a1613\">complex.</text>\n  <text x=\"438\" y=\"65\" font-family=\"Georgia\" font-size=\"14\" fill=\"#1a1613\">\"</text>\n  <g font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">\n    <text x=\"105\" y=\"82\" text-anchor=\"middle\">↓</text>\n    <text x=\"215\" y=\"82\" text-anchor=\"middle\">↓</text>\n    <text x=\"290\" y=\"82\" text-anchor=\"middle\">↓</text>\n    <text x=\"395\" y=\"82\" text-anchor=\"middle\">↓</text>\n  </g>\n  <g font-family=\"monospace\" font-size=\"11\">\n    <rect x=\"60\" y=\"90\" width=\"40\" height=\"22\" fill=\"#fef3d8\" stroke=\"#b8651a\"/><text x=\"80\" y=\"105\" text-anchor=\"middle\">Token</text>\n    <rect x=\"102\" y=\"90\" width=\"40\" height=\"22\" fill=\"#fef3d8\" stroke=\"#b8651a\"/><text x=\"122\" y=\"105\" text-anchor=\"middle\">ization</text>\n    <rect x=\"144\" y=\"90\" width=\"20\" height=\"22\" fill=\"#fef3d8\" stroke=\"#b8651a\"/><text x=\"154\" y=\"105\" text-anchor=\"middle\">is</text>\n    <rect x=\"166\" y=\"90\" width=\"100\" height=\"22\" fill=\"#fef3d8\" stroke=\"#b8651a\"/><text x=\"216\" y=\"105\" text-anchor=\"middle\">surprisingly</text>\n    <rect x=\"268\" y=\"90\" width=\"60\" height=\"22\" fill=\"#fef3d8\" stroke=\"#b8651a\"/><text x=\"298\" y=\"105\" text-anchor=\"middle\">complex</text>\n    <rect x=\"330\" y=\"90\" width=\"16\" height=\"22\" fill=\"#fef3d8\" stroke=\"#b8651a\"/><text x=\"338\" y=\"105\" text-anchor=\"middle\">.</text>\n  </g>\n  <text x=\"200\" y=\"135\" font-family=\"Georgia\" font-size=\"11\" fill=\"#706659\">6 tokens for 4 words</text>\n  <g font-family=\"monospace\" font-size=\"10\">\n    <rect x=\"470\" y=\"50\" width=\"170\" height=\"130\" fill=\"#fdfaf1\" stroke=\"#706659\" stroke-width=\"1\"/>\n    <text x=\"555\" y=\"68\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-weight=\"700\">Pricing (2026)</text>\n    <line x1=\"485\" y1=\"74\" x2=\"625\" y2=\"74\" stroke=\"#d9cfc0\"/>\n    <text x=\"485\" y=\"90\" fill=\"#706659\">Claude Opus</text>\n    <text x=\"625\" y=\"90\" text-anchor=\"end\">$15/$75</text>\n    <text x=\"485\" y=\"105\" fill=\"#706659\">GPT-5</text>\n    <text x=\"625\" y=\"105\" text-anchor=\"end\">$10/$40</text>\n    <text x=\"485\" y=\"120\" fill=\"#706659\">Gemini 3 Pro</text>\n    <text x=\"625\" y=\"120\" text-anchor=\"end\">$12.50/$75</text>\n    <text x=\"485\" y=\"135\" fill=\"#706659\">DeepSeek-R1</text>\n    <text x=\"625\" y=\"135\" text-anchor=\"end\">$0.55/$2.19</text>\n    <text x=\"555\" y=\"155\" text-anchor=\"middle\" font-size=\"9\" fill=\"#706659\">per M input/output</text>\n    <text x=\"555\" y=\"172\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" font-style=\"italic\" fill=\"#1a1613\">~5,000× price range</text>\n  </g>\n</svg>", "section_id": "models", "section_num": "05", "section_title": "AI Models & Algorithms", "section_color": "purple", "timestamp_sec": 32, "timestamp_fmt": "0:32", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=32s"}, {"name": "Training vs Inference", "expansion": "", "plain": "Training: expensive one-time burn (weeks-months on 10k+ GPUs, $100M-$1B per run). Inference: running the trained model (billions of times/day, ms each, fractional cents per query). Industry spend is shifting rapidly from training to inference.", "analogy": null, "why_matters": "Dwarkesh's cyber argument: 'much more dangerous if they have a million instances of Mythos vs a thousand.' Inference scale = real-world deployment scale. Which is also why the Nvidia-Groq deal happened — inference is the bigger prize long-term.", "context": "Dwarkesh's cyber argument: 'much more dangerous if they have a million instances versus a thousand.'", "subvis": "\n<svg viewBox=\"0 0 680 220\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Two workloads, two operating models</text>\n  <rect x=\"40\" y=\"45\" width=\"300\" height=\"160\" fill=\"#fef3d8\" stroke=\"#b8651a\" stroke-width=\"1.5\"/>\n  <text x=\"190\" y=\"70\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"14\" font-weight=\"700\">TRAINING</text>\n  <text x=\"190\" y=\"86\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">one heroic burn per model</text>\n  <line x1=\"60\" y1=\"96\" x2=\"320\" y2=\"96\" stroke=\"#d9cfc0\"/>\n  <g font-family=\"Georgia\" font-size=\"11\">\n    <text x=\"60\" y=\"116\">Duration · weeks to months</text>\n    <text x=\"60\" y=\"134\">Scale · 10,000–100,000 GPUs</text>\n    <text x=\"60\" y=\"152\">Cost · $100M – $1B+</text>\n    <text x=\"60\" y=\"170\">Output · one model checkpoint</text>\n  </g>\n  <text x=\"190\" y=\"195\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#b8651a\" font-style=\"italic\">compute-bound, bursty, capex-intensive</text>\n  <rect x=\"360\" y=\"45\" width=\"300\" height=\"160\" fill=\"#e8eef5\" stroke=\"#2a5f8f\" stroke-width=\"1.5\"/>\n  <text x=\"510\" y=\"70\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"14\" font-weight=\"700\">INFERENCE</text>\n  <text x=\"510\" y=\"86\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">forever, for every user, every request</text>\n  <line x1=\"380\" y1=\"96\" x2=\"640\" y2=\"96\" stroke=\"#d9cfc0\"/>\n  <g font-family=\"Georgia\" font-size=\"11\">\n    <text x=\"380\" y=\"116\">Duration · milliseconds per query</text>\n    <text x=\"380\" y=\"134\">Scale · 1–8 GPUs per instance</text>\n    <text x=\"380\" y=\"152\">Cost · fractions of a cent per query</text>\n    <text x=\"380\" y=\"170\">Output · billions of tokens/day</text>\n  </g>\n  <text x=\"510\" y=\"195\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#2a5f8f\" font-style=\"italic\">memory-bound, always-on, opex-intensive</text>\n</svg>", "section_id": "models", "section_num": "05", "section_title": "AI Models & Algorithms", "section_color": "purple", "timestamp_sec": 1472, "timestamp_fmt": "24:32", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1472s"}, {"name": "Post-training", "expansion": "", "plain": "Everything after initial pretraining — fine-tuning, RLHF (Reinforcement Learning from Human Feedback), RLVR (RL with Verifiable Rewards), distillation, alignment, safety tuning. Where most current capability gains come from in 2025-26.", "analogy": null, "why_matters": "Post-training is compute-intensive AND highly iterative — lots of small experiments. Maps poorly to static ASICs (each iteration is different), perfectly to programmable GPUs (change the kernel, rerun). Tailwind for Nvidia.", "context": "Jensen: 'With post-training and reinforcement learning, that entire area is just exploding.'", "subvis": null, "section_id": "models", "section_num": "05", "section_title": "AI Models & Algorithms", "section_color": "purple", "timestamp_sec": 1598, "timestamp_fmt": "26:38", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1598s"}, {"name": "Reinforcement Learning", "expansion": "(RL)", "plain": "Training via rewards/penalties, not direct correct answers. Core to reasoning models (o1, o3, DeepSeek-R1). The 2025 breakthrough was RLVR — RL with Verifiable Rewards, where correctness can be auto-checked (math, code, browser tasks) instead of requiring human raters.", "analogy": "Teaching a dog tricks with treats vs giving it a textbook. RL is the treats approach — the dog tries things, some work, it learns from the reward signal over thousands of tries.", "why_matters": "The RLVR breakthrough in 2024-25 unlocked reasoning models without expensive human feedback. Dwarkesh refers to 'tight verification loops' — this is why coding and math are the areas where AI progressed fastest.", "context": "Dwarkesh: 'things which have tight verification loops where you can RL on them.'", "subvis": "\n<svg viewBox=\"0 0 680 220\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"20\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">RL loop: model tries, gets scored, updates</text>\n  <defs><marker id=\"rl-arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#6b4a9e\"/></marker></defs>\n  <circle cx=\"170\" cy=\"110\" r=\"45\" fill=\"#efe6f2\" stroke=\"#6b4a9e\" stroke-width=\"1.5\"/>\n  <text x=\"170\" y=\"108\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\">Model</text>\n  <text x=\"170\" y=\"124\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">generates attempt</text>\n  <circle cx=\"510\" cy=\"110\" r=\"45\" fill=\"#e8f2e0\" stroke=\"#2f7a3e\" stroke-width=\"1.5\"/>\n  <text x=\"510\" y=\"108\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\">Verifier</text>\n  <text x=\"510\" y=\"124\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">checks / scores</text>\n  <path d=\"M 215 95 Q 340 50 465 95\" fill=\"none\" stroke=\"#6b4a9e\" stroke-width=\"2\" marker-end=\"url(#rl-arr)\"/>\n  <text x=\"340\" y=\"55\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" font-weight=\"700\" fill=\"#6b4a9e\">attempt</text>\n  <path d=\"M 465 125 Q 340 170 215 125\" fill=\"none\" stroke=\"#6b4a9e\" stroke-width=\"2\" marker-end=\"url(#rl-arr)\"/>\n  <text x=\"340\" y=\"175\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"10\" font-weight=\"700\" fill=\"#6b4a9e\">reward signal</text>\n  <g font-family=\"monospace\" font-size=\"10\">\n    <text x=\"340\" y=\"200\" text-anchor=\"middle\" font-weight=\"700\">Works great when verification is automatic:</text>\n    <text x=\"340\" y=\"215\" text-anchor=\"middle\" fill=\"#706659\">math (prove it) · code (run tests) · chess (win/loss) · browser (task done)</text>\n  </g>\n</svg>", "section_id": "models", "section_num": "05", "section_title": "AI Models & Algorithms", "section_color": "purple", "timestamp_sec": 1598, "timestamp_fmt": "26:38", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1598s"}, {"name": "KV cache", "expansion": "(Key-Value cache)", "plain": "Stored intermediate results (keys and values from attention) that let a model skip recomputing earlier parts of a prompt for each new token. Without it, LLM generation would be quadratic — every new token recomputes everything before it. With it, linear.", "analogy": "Writing a 1000-word email. Without KV cache, every time you add a word, you re-read and re-think the entire email from the start. With it, you just remember your train of thought and add the next word.", "why_matters": "KV cache is why modern LLMs work at interactive speeds at all. Managing it is the single central challenge of LLM serving — PagedAttention (vLLM), prefix sharing (SGLang), prompt caching (Anthropic/OpenAI) are all KV-cache optimizations.", "context": "Crusoe sponsor: 'if a thousand agents run on the same system prompt, Crusoe only has to compute the KV cache once.'", "subvis": "\n<svg viewBox=\"0 0 700 230\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"350\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Without KV cache: re-process everything. With: reuse.</text>\n  <text x=\"170\" y=\"50\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\">Naive — every new token, redo all</text>\n  <g font-family=\"monospace\" font-size=\"9\">\n    <g transform=\"translate(40,60)\">\n      <text x=\"0\" y=\"14\" fill=\"#706659\">t=1</text>\n      <rect x=\"30\" y=\"5\" width=\"14\" height=\"12\" fill=\"#fbeae5\" stroke=\"#a8321f\"/>\n      <text x=\"60\" y=\"14\" fill=\"#a8321f\">1 op</text>\n    </g>\n    <g transform=\"translate(40,82)\">\n      <text x=\"0\" y=\"14\" fill=\"#706659\">t=2</text>\n      <rect x=\"30\" y=\"5\" width=\"14\" height=\"12\" fill=\"#fbeae5\" stroke=\"#a8321f\"/>\n      <rect x=\"46\" y=\"5\" width=\"14\" height=\"12\" fill=\"#fbeae5\" stroke=\"#a8321f\"/>\n      <text x=\"76\" y=\"14\" fill=\"#a8321f\">2 ops</text>\n    </g>\n    <g transform=\"translate(40,104)\">\n      <text x=\"0\" y=\"14\" fill=\"#706659\">t=3</text>\n      <rect x=\"30\" y=\"5\" width=\"14\" height=\"12\" fill=\"#fbeae5\" stroke=\"#a8321f\"/>\n      <rect x=\"46\" y=\"5\" width=\"14\" height=\"12\" fill=\"#fbeae5\" stroke=\"#a8321f\"/>\n      <rect x=\"62\" y=\"5\" width=\"14\" height=\"12\" fill=\"#fbeae5\" stroke=\"#a8321f\"/>\n      <text x=\"92\" y=\"14\" fill=\"#a8321f\">3 ops</text>\n    </g>\n    <g transform=\"translate(40,126)\">\n      <text x=\"0\" y=\"14\" fill=\"#706659\">t=4</text>\n      <rect x=\"30\" y=\"5\" width=\"14\" height=\"12\" fill=\"#fbeae5\" stroke=\"#a8321f\"/>\n      <rect x=\"46\" y=\"5\" width=\"14\" height=\"12\" fill=\"#fbeae5\" stroke=\"#a8321f\"/>\n      <rect x=\"62\" y=\"5\" width=\"14\" height=\"12\" fill=\"#fbeae5\" stroke=\"#a8321f\"/>\n      <rect x=\"78\" y=\"5\" width=\"14\" height=\"12\" fill=\"#fbeae5\" stroke=\"#a8321f\"/>\n      <text x=\"108\" y=\"14\" fill=\"#a8321f\">4 ops</text>\n    </g>\n    <g transform=\"translate(40,148)\">\n      <text x=\"0\" y=\"14\" fill=\"#706659\">t=5</text>\n      <rect x=\"30\" y=\"5\" width=\"14\" height=\"12\" fill=\"#fbeae5\" stroke=\"#a8321f\"/>\n      <rect x=\"46\" y=\"5\" width=\"14\" height=\"12\" fill=\"#fbeae5\" stroke=\"#a8321f\"/>\n      <rect x=\"62\" y=\"5\" width=\"14\" height=\"12\" fill=\"#fbeae5\" stroke=\"#a8321f\"/>\n      <rect x=\"78\" y=\"5\" width=\"14\" height=\"12\" fill=\"#fbeae5\" stroke=\"#a8321f\"/>\n      <rect x=\"94\" y=\"5\" width=\"14\" height=\"12\" fill=\"#fbeae5\" stroke=\"#a8321f\"/>\n      <text x=\"124\" y=\"14\" fill=\"#a8321f\">5 ops</text>\n    </g>\n  </g>\n  <text x=\"170\" y=\"188\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\" fill=\"#a8321f\">O(N²) total: 15 ops for 5 tokens</text>\n  <line x1=\"370\" y1=\"40\" x2=\"370\" y2=\"195\" stroke=\"#d9cfc0\" stroke-dasharray=\"3,3\"/>\n  <text x=\"530\" y=\"50\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"12\" font-weight=\"700\">With KV cache — only new work each step</text>\n  <g font-family=\"monospace\" font-size=\"9\">\n    <g transform=\"translate(400,60)\">\n      <text x=\"0\" y=\"14\" fill=\"#706659\">t=1</text>\n      <rect x=\"30\" y=\"5\" width=\"14\" height=\"12\" fill=\"#eef4ee\" stroke=\"#2f7a3e\"/>\n      <text x=\"60\" y=\"14\" fill=\"#2f7a3e\">1 new</text>\n    </g>\n    <g transform=\"translate(400,82)\">\n      <text x=\"0\" y=\"14\" fill=\"#706659\">t=2</text>\n      <rect x=\"30\" y=\"5\" width=\"14\" height=\"12\" fill=\"#d9cfc0\" stroke=\"#1a1613\"/>\n      <rect x=\"46\" y=\"5\" width=\"14\" height=\"12\" fill=\"#eef4ee\" stroke=\"#2f7a3e\"/>\n      <text x=\"76\" y=\"14\" fill=\"#2f7a3e\">1 new</text>\n    </g>\n    <g transform=\"translate(400,104)\">\n      <text x=\"0\" y=\"14\" fill=\"#706659\">t=3</text>\n      <rect x=\"30\" y=\"5\" width=\"14\" height=\"12\" fill=\"#d9cfc0\" stroke=\"#1a1613\"/>\n      <rect x=\"46\" y=\"5\" width=\"14\" height=\"12\" fill=\"#d9cfc0\" stroke=\"#1a1613\"/>\n      <rect x=\"62\" y=\"5\" width=\"14\" height=\"12\" fill=\"#eef4ee\" stroke=\"#2f7a3e\"/>\n      <text x=\"92\" y=\"14\" fill=\"#2f7a3e\">1 new</text>\n    </g>\n    <g transform=\"translate(400,126)\">\n      <text x=\"0\" y=\"14\" fill=\"#706659\">t=4</text>\n      <rect x=\"30\" y=\"5\" width=\"14\" height=\"12\" fill=\"#d9cfc0\" stroke=\"#1a1613\"/>\n      <rect x=\"46\" y=\"5\" width=\"14\" height=\"12\" fill=\"#d9cfc0\" stroke=\"#1a1613\"/>\n      <rect x=\"62\" y=\"5\" width=\"14\" height=\"12\" fill=\"#d9cfc0\" stroke=\"#1a1613\"/>\n      <rect x=\"78\" y=\"5\" width=\"14\" height=\"12\" fill=\"#eef4ee\" stroke=\"#2f7a3e\"/>\n      <text x=\"108\" y=\"14\" fill=\"#2f7a3e\">1 new</text>\n    </g>\n    <g transform=\"translate(400,148)\">\n      <text x=\"0\" y=\"14\" fill=\"#706659\">t=5</text>\n      <rect x=\"30\" y=\"5\" width=\"14\" height=\"12\" fill=\"#d9cfc0\" stroke=\"#1a1613\"/>\n      <rect x=\"46\" y=\"5\" width=\"14\" height=\"12\" fill=\"#d9cfc0\" stroke=\"#1a1613\"/>\n      <rect x=\"62\" y=\"5\" width=\"14\" height=\"12\" fill=\"#d9cfc0\" stroke=\"#1a1613\"/>\n      <rect x=\"78\" y=\"5\" width=\"14\" height=\"12\" fill=\"#d9cfc0\" stroke=\"#1a1613\"/>\n      <rect x=\"94\" y=\"5\" width=\"14\" height=\"12\" fill=\"#eef4ee\" stroke=\"#2f7a3e\"/>\n      <text x=\"124\" y=\"14\" fill=\"#2f7a3e\">1 new</text>\n    </g>\n  </g>\n  <text x=\"530\" y=\"188\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\" fill=\"#2f7a3e\">O(N) total: 5 ops for 5 tokens</text>\n  <text x=\"350\" y=\"215\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"11\" font-style=\"italic\" fill=\"#706659\">Grey = cached (done before). Green = new. The memory cost is the trade.</text>\n</svg>", "section_id": "inference", "section_num": "06", "section_title": "Inference & Serving", "section_color": "blue", "timestamp_sec": 1453, "timestamp_fmt": "24:13", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1453s"}, {"name": "Time to first token", "expansion": "(TTFT)", "plain": "How long the user waits before seeing any output. Dominated by the prefill phase. A model generating 200 tok/s but taking 5s to first token feels worse than 100 tok/s starting in 200ms.", "analogy": "Pizza delivery. Would you rather have the whole pie arrive in 30 min, or slices arrive every 5 min starting in 10 min? UX-wise, the second wins, even if the first finishes earlier.", "why_matters": "TTFT is the main UX lever for chat and coding agents. A big reason Groq's hardware exists — their LPU architecture optimizes specifically for this metric.", "context": "Crusoe claim: 'up to 10x faster time-to-first token and up to 5x better throughput than vLLM.'", "subvis": null, "section_id": "inference", "section_num": "06", "section_title": "Inference & Serving", "section_color": "blue", "timestamp_sec": 1467, "timestamp_fmt": "24:27", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1467s"}, {"name": "Throughput", "expansion": "", "plain": "Tokens/sec/GPU aggregated across users. High throughput = cheap tokens. Trades off against latency — batching more users gives better throughput but slower time-to-first-token for each.", "analogy": null, "why_matters": "The throughput-vs-latency tradeoff is the heart of Jensen's 'expanding the Pareto frontier' argument for Groq. Different applications want different points on this curve; the market is finally willing to pay for that variety.", "context": "Jensen: 'even though the throughput is lower in the factory, the ASPs make up for it.'", "subvis": null, "section_id": "inference", "section_num": "06", "section_title": "Inference & Serving", "section_color": "blue", "timestamp_sec": 1472, "timestamp_fmt": "24:32", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1472s"}, {"name": "Prefix / Prefill", "expansion": "", "plain": "Initial processing of the input prompt before generation begins. Agentic workloads have massive prefills — often 10× longer than the output. Compute-heavy, very different from decode which is memory-bandwidth-heavy.", "analogy": null, "why_matters": "Modern agentic systems (coding assistants, deep-research agents) are prefix-dominated — a single query can involve 100k-1M input tokens of tool results and context. This is reshaping inference hardware design.", "context": "Crusoe sponsor: 'systems get more agentic and require much longer prefixes to use tools and access files.'", "subvis": null, "section_id": "inference", "section_num": "06", "section_title": "Inference & Serving", "section_color": "blue", "timestamp_sec": 1461, "timestamp_fmt": "24:21", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1461s"}, {"name": "Pareto frontier", "expansion": "", "plain": "Curve of best-possible tradeoffs between two goals. A point ON the frontier is optimal for its mix of goals; a point BEHIND it is strictly worse. 'Expanding the Pareto frontier' means enabling previously-impossible tradeoffs.", "analogy": "In running, there's a frontier between sprint speed and marathon endurance. A runner exactly on the frontier can't get better at one without getting worse at the other. Training methods that let someone improve both = expanding the frontier.", "why_matters": null, "context": "Jensen: 'we decided to expand the Pareto frontier and create a segment of inference that is faster response time.'", "subvis": "\n<svg viewBox=\"0 0 660 250\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"330\" y=\"20\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Groq added a new operating point the frontier didn't have</text>\n  <line x1=\"70\" y1=\"210\" x2=\"620\" y2=\"210\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <line x1=\"70\" y1=\"40\" x2=\"70\" y2=\"210\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <text x=\"345\" y=\"238\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\">throughput →</text>\n  <text x=\"30\" y=\"125\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\" transform=\"rotate(-90 30 125)\">tokens/sec per user</text>\n  <path d=\"M 95 62 Q 200 115 350 170 T 595 200\" fill=\"none\" stroke=\"#b8651a\" stroke-width=\"2\"/>\n  <text x=\"430\" y=\"155\" font-family=\"Georgia\" font-size=\"10\" fill=\"#b8651a\" font-style=\"italic\">Pareto frontier (GPU)</text>\n  <circle cx=\"105\" cy=\"75\" r=\"5\" fill=\"#2a5f8f\"/>\n  <text x=\"118\" y=\"72\" font-family=\"monospace\" font-size=\"9\" font-weight=\"700\">single user</text>\n  <text x=\"118\" y=\"84\" font-family=\"monospace\" font-size=\"8\" fill=\"#706659\">fast, low throughput</text>\n  <circle cx=\"300\" cy=\"138\" r=\"5\" fill=\"#2a5f8f\"/>\n  <text x=\"313\" y=\"135\" font-family=\"monospace\" font-size=\"9\" font-weight=\"700\">small batch</text>\n  <circle cx=\"470\" cy=\"185\" r=\"5\" fill=\"#2a5f8f\"/>\n  <text x=\"483\" y=\"182\" font-family=\"monospace\" font-size=\"9\" font-weight=\"700\">bulk batch</text>\n  <text x=\"483\" y=\"194\" font-family=\"monospace\" font-size=\"8\" fill=\"#706659\">cheap, slow-per-user</text>\n  <circle cx=\"135\" cy=\"52\" r=\"7\" fill=\"#76b900\" stroke=\"#1a1613\" stroke-width=\"1.5\"/>\n  <text x=\"150\" y=\"44\" font-family=\"monospace\" font-size=\"10\" font-weight=\"700\" fill=\"#2f7a3e\">Groq (LPU)</text>\n  <text x=\"150\" y=\"56\" font-family=\"monospace\" font-size=\"8\" fill=\"#706659\">500+ tok/s/user</text>\n  <text x=\"150\" y=\"66\" font-family=\"monospace\" font-size=\"8\" fill=\"#706659\">premium ASP</text>\n  <path d=\"M 95 48 Q 170 40 220 52\" fill=\"none\" stroke=\"#2f7a3e\" stroke-width=\"2\" stroke-dasharray=\"4,2\"/>\n  <text x=\"345\" y=\"55\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" font-style=\"italic\" fill=\"#2f7a3e\">new frontier extension</text>\n</svg>", "section_id": "inference", "section_num": "06", "section_title": "Inference & Serving", "section_color": "blue", "timestamp_sec": 5926, "timestamp_fmt": "1:38:46", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=5926s"}, {"name": "ASP", "expansion": "(Average Selling Price)", "plain": "Average Selling Price — revenue per unit sold. Jensen's insight: AI tokens no longer have one price. A premium fast-response token (coding agent, voice) can sell for 5-10× the price of a batch-mode token from the same model. The market has segmented by latency.", "analogy": null, "why_matters": "Exactly why Nvidia wanted Groq's tech. A Groq rack has lower throughput than NVL72, but per-token ASP is much higher — profitable in segments Nvidia couldn't previously address.", "context": "Jensen: 'there could be very high ASP tokens, and the ASPs make up for' lower throughput.", "subvis": "\n<svg viewBox=\"0 0 680 220\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"340\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">Tokens don't have one price anymore — ASP varies by latency</text>\n  <g font-family=\"monospace\" font-size=\"10\">\n    <rect x=\"40\" y=\"50\" width=\"180\" height=\"130\" fill=\"#fef3d8\" stroke=\"#b8651a\" stroke-width=\"1.5\"/>\n    <text x=\"130\" y=\"72\" text-anchor=\"middle\" font-weight=\"700\">BATCH / BULK</text>\n    <line x1=\"60\" y1=\"82\" x2=\"200\" y2=\"82\" stroke=\"#d9cfc0\"/>\n    <text x=\"60\" y=\"102\" fill=\"#706659\">overnight jobs</text>\n    <text x=\"60\" y=\"118\" fill=\"#706659\">data processing</text>\n    <text x=\"60\" y=\"134\" fill=\"#706659\">content farms</text>\n    <text x=\"130\" y=\"160\" text-anchor=\"middle\" fill=\"#1a1613\" font-weight=\"700\" font-size=\"14\">$0.1–1 / M tok</text>\n    <text x=\"130\" y=\"175\" text-anchor=\"middle\" fill=\"#706659\" font-style=\"italic\">commodity tier</text>\n    <rect x=\"250\" y=\"50\" width=\"180\" height=\"130\" fill=\"#e8eef5\" stroke=\"#2a5f8f\" stroke-width=\"1.5\"/>\n    <text x=\"340\" y=\"72\" text-anchor=\"middle\" font-weight=\"700\">INTERACTIVE</text>\n    <line x1=\"270\" y1=\"82\" x2=\"410\" y2=\"82\" stroke=\"#d9cfc0\"/>\n    <text x=\"270\" y=\"102\" fill=\"#706659\">chatbots</text>\n    <text x=\"270\" y=\"118\" fill=\"#706659\">search</text>\n    <text x=\"270\" y=\"134\" fill=\"#706659\">basic agents</text>\n    <text x=\"340\" y=\"160\" text-anchor=\"middle\" fill=\"#1a1613\" font-weight=\"700\" font-size=\"14\">$1–15 / M tok</text>\n    <text x=\"340\" y=\"175\" text-anchor=\"middle\" fill=\"#706659\" font-style=\"italic\">standard tier</text>\n    <rect x=\"460\" y=\"50\" width=\"180\" height=\"130\" fill=\"#efe6f2\" stroke=\"#6b4a9e\" stroke-width=\"1.5\"/>\n    <text x=\"550\" y=\"72\" text-anchor=\"middle\" font-weight=\"700\">PREMIUM / REAL-TIME</text>\n    <line x1=\"480\" y1=\"82\" x2=\"620\" y2=\"82\" stroke=\"#d9cfc0\"/>\n    <text x=\"480\" y=\"102\" fill=\"#706659\">coding agents</text>\n    <text x=\"480\" y=\"118\" fill=\"#706659\">voice assistants</text>\n    <text x=\"480\" y=\"134\" fill=\"#706659\">autonomous trading</text>\n    <text x=\"550\" y=\"160\" text-anchor=\"middle\" fill=\"#1a1613\" font-weight=\"700\" font-size=\"14\">$15–75 / M tok</text>\n    <text x=\"550\" y=\"175\" text-anchor=\"middle\" fill=\"#706659\" font-style=\"italic\">Groq / o1-pro tier</text>\n  </g>\n  <text x=\"340\" y=\"208\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" font-style=\"italic\" fill=\"#2f7a3e\">Why Jensen bought Groq tech: new high-ASP segment the Pareto frontier didn't cover</text>\n</svg>", "section_id": "inference", "section_num": "06", "section_title": "Inference & Serving", "section_color": "blue", "timestamp_sec": 5945, "timestamp_fmt": "1:39:05", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=5945s"}, {"name": "MLPerf", "expansion": "", "plain": "Industry-standard AI benchmark suite run by MLCommons, a nonprofit consortium. Audited, peer-reviewed, reproducible. If you claim your chip is faster than Nvidia, MLPerf is the neutral ground to prove it — or not show up.", "analogy": null, "why_matters": "Absence of submission is itself a signal. Competitors routinely claim ASIC advantages in marketing — very few submit where numbers get audited. Jensen's challenge ('TPU won't come, Trainium won't come') is leaning on this gap.", "context": "Jensen: 'I would welcome Trainium to demonstrate their 40% that they claim all the time.'", "subvis": "\n<svg viewBox=\"0 0 660 190\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"330\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">MLPerf: the \"marketing claim\" vs \"audited benchmark\" gap</text>\n  <rect x=\"40\" y=\"50\" width=\"270\" height=\"115\" fill=\"#fef3d8\" stroke=\"#b8651a\" stroke-width=\"1.5\"/>\n  <text x=\"175\" y=\"75\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\" fill=\"#b8651a\">Marketing claim</text>\n  <text x=\"175\" y=\"102\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"16\" font-weight=\"700\">\"40% better\"</text>\n  <text x=\"175\" y=\"125\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">workload: chosen by vendor</text>\n  <text x=\"175\" y=\"140\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">result: not independently verified</text>\n  <text x=\"175\" y=\"155\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">audit: none</text>\n  <rect x=\"350\" y=\"50\" width=\"270\" height=\"115\" fill=\"#e8f2e0\" stroke=\"#2f7a3e\" stroke-width=\"1.5\"/>\n  <text x=\"485\" y=\"75\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\" fill=\"#2f7a3e\">MLPerf / InferenceMAX</text>\n  <text x=\"485\" y=\"102\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"16\" font-weight=\"700\">actually measured</text>\n  <text x=\"485\" y=\"125\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">workload: standardized</text>\n  <text x=\"485\" y=\"140\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">result: peer-reviewed</text>\n  <text x=\"485\" y=\"155\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"9\" fill=\"#706659\">audit: mandatory</text>\n  <text x=\"330\" y=\"182\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"10\" font-style=\"italic\" fill=\"#706659\">Jensen: \"TPU won't come, Trainium won't come.\" Absence = tells.</text>\n</svg>", "section_id": "inference", "section_num": "06", "section_title": "Inference & Serving", "section_color": "blue", "timestamp_sec": 1975, "timestamp_fmt": "32:55", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1975s"}, {"name": "InferenceMAX", "expansion": "", "plain": "Newer inference benchmark from SemiAnalysis (Dylan Patel's group). Open-source, reproducible, focused on realistic inference workloads and cost-per-token. More current than MLPerf for the inference-first era.", "analogy": null, "why_matters": "Jensen cites it specifically because it's harder to duck than MLPerf — the methodology and code are public, so 'the workload wasn't fair' doesn't fly. 'Dylan's InferenceMAX is out there.'", "context": "Jensen: 'Dylan's InferenceMAX is out there. TPU won't come, Trainium won't come.'", "subvis": null, "section_id": "inference", "section_num": "06", "section_title": "Inference & Serving", "section_color": "blue", "timestamp_sec": 1958, "timestamp_fmt": "32:38", "youtube_url": "https://youtu.be/Hrbq66XqtCo?t=1958s"}, {"name": "TCO", "expansion": "(Total Cost of Ownership)", "plain": "Total Cost of Ownership — full cost of running a chip over its lifetime: purchase + power + cooling + networking + software + operations. Typical split: chip ~30%, power ~25%, cooling/DC ~20%, network ~15%, ops ~10%.", "analogy": "A $20k car that gets 8 mpg and breaks weekly has worse TCO than a $35k car that gets 35 mpg and runs 20 years. Sticker price is a small part of the real cost.", "why_matters": "A 2× cheaper ASIC with 2× worse efficiency is break-even on TCO. This is why Jensen's TCO argument is strong even when competitors' sticker prices are lower.", "context": "Jensen: 'Nvidia's computing stack is the best performance per TCO in the world, bar none.'", "subvis": "\n<svg viewBox=\"0 0 660 220\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid meet\">\n  <text x=\"330\" y=\"22\" text-anchor=\"middle\" font-family=\"Georgia\" font-size=\"13\" font-weight=\"700\">TCO breakdown: chip sticker is ~30% of actual cost</text>\n  <g font-fa
