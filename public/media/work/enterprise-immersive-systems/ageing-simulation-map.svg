<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Cycling Without Age VR ageing-simulation system map</title>
  <desc id="description">An editorial map of the living-room, street-crossing, and supermarket scenarios used to build empathy for everyday challenges experienced by seniors.</desc>
  <rect width="1600" height="900" fill="#f3f2ee"/>
  <g fill="#090909" font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="96" font-size="64" font-weight="800" letter-spacing="-2">THREE ORDINARY PLACES.</text>
    <text x="80" y="158" font-size="64" font-weight="800" letter-spacing="-2">ONE EMPATHY SYSTEM.</text>
    <text x="80" y="207" font-size="22" fill="#666661">Cycling Without Age Singapore · reviewed programme and source archive</text>
  </g>

  <path d="M80 262H1520" stroke="#b8b7b0" stroke-width="2"/>
  <path d="M560 286V690M1040 286V690" stroke="#b8b7b0" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(80 302)">
      <text x="0" y="0" fill="#1547ff" font-size="22" font-weight="700">LIVING ROOM</text>
      <circle cx="130" cy="156" r="70" fill="none" stroke="#090909" stroke-width="7"/>
      <path d="M130 156L130 111M130 156L166 177" stroke="#090909" stroke-width="7" stroke-linecap="round"/>
      <path d="M42 260H306L344 312H0Z" fill="#090909"/>
      <rect x="306" y="222" width="58" height="106" rx="8" fill="#1547ff"/>
      <circle cx="335" cy="248" r="6" fill="#f3f2ee"/>
      <text x="0" y="374" fill="#090909" font-size="26" font-weight="700">Slow time. Small controls.</text>
      <text x="0" y="410" fill="#666661" font-size="22">Finding the remote, reading a list,</text>
      <text x="0" y="440" fill="#666661" font-size="22">standing, reaching, and being alone.</text>
    </g>

    <g transform="translate(600 302)">
      <text x="0" y="0" fill="#1547ff" font-size="22" font-weight="700">STREET CROSSING</text>
      <rect x="0" y="108" width="400" height="190" fill="#090909"/>
      <g fill="#f3f2ee">
        <rect x="24" y="120" width="45" height="166"/>
        <rect x="92" y="120" width="45" height="166"/>
        <rect x="160" y="120" width="45" height="166"/>
        <rect x="228" y="120" width="45" height="166"/>
        <rect x="296" y="120" width="45" height="166"/>
      </g>
      <circle cx="326" cy="62" r="34" fill="#1547ff"/>
      <path d="M326 62V42M326 62L342 73" stroke="#f3f2ee" stroke-width="5" stroke-linecap="round"/>
      <path d="M86 78L128 43L170 78" fill="none" stroke="#090909" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="374" fill="#090909" font-size="26" font-weight="700">Limited pace. Public pressure.</text>
      <text x="0" y="410" fill="#666661" font-size="22">Cross before the signal changes while</text>
      <text x="0" y="440" fill="#666661" font-size="22">traffic, a bus, and other people move on.</text>
    </g>

    <g transform="translate(1080 302)">
      <text x="0" y="0" fill="#1547ff" font-size="22" font-weight="700">SUPERMARKET</text>
      <path d="M0 86H360V306H0Z" fill="none" stroke="#090909" stroke-width="7"/>
      <path d="M0 157H360M0 230H360M120 86V306M240 86V306" stroke="#090909" stroke-width="5"/>
      <g fill="#1547ff">
        <rect x="30" y="111" width="54" height="25"/>
        <circle cx="176" cy="123" r="19"/>
        <path d="M279 102H325L337 136H267Z"/>
        <rect x="36" y="178" width="64" height="32"/>
        <circle cx="180" cy="194" r="23"/>
        <rect x="276" y="174" width="44" height="40"/>
        <path d="M40 251H92V286H40ZM154 250H207V286H154ZM275 247H325V286H275Z"/>
      </g>
      <text x="0" y="374" fill="#090909" font-size="26" font-weight="700">Reach. Recall. Pay.</text>
      <text x="0" y="410" fill="#666661" font-size="22">Read labels, remember the list, carry</text>
      <text x="0" y="440" fill="#666661" font-size="22">the basket, and handle cash under scrutiny.</text>
    </g>
  </g>

  <path d="M80 760H1520" stroke="#090909" stroke-width="3"/>
  <circle cx="80" cy="760" r="10" fill="#1547ff"/>
  <circle cx="560" cy="760" r="10" fill="#1547ff"/>
  <circle cx="1040" cy="760" r="10" fill="#1547ff"/>
  <circle cx="1520" cy="760" r="10" fill="#1547ff"/>
  <g fill="#090909" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
    <text x="80" y="812">SIMULATED CONSTRAINTS</text>
    <text x="560" y="812">GUIDED EXPERIENCE</text>
    <text x="1040" y="812">REFLECTION</text>
    <text x="1380" y="812">EMPATHY</text>
  </g>
</svg>
